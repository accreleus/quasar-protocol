  /v1/admin/settings:
    get:
      tags: [admin]
      summary: Read instance settings (registration_mode, …).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SettingsEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      summary: Update instance settings.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
                storage_provider: { $ref: "#/components/schemas/StorageProvider" }
                library_discovery_enabled:
                  type: boolean
                  description: >-
                    Steam library discovery Phase 4. EVERY FIELD ON THIS BODY IS OPTIONAL AND
                    ABSENCE MEANS UNCHANGED - a plain (non-pointer) decode of an absent
                    library_discovery_enabled would read false and silently switch discovery off
                    every time an admin changed the registration mode. A PATCH naming no known
                    field is a no-op that returns current state.
                library_discovery_interval_minutes:
                  type: integer
                  minimum: 15
                  maximum: 10080
                  description: >-
                    Admin-libraries amendment (2026-08-01). Absent = unchanged. Out of bounds
                    (below 15 or above 10080 minutes) is 400 validation_failed. Setting it does
                    not lift an environment override - LibraryStatus reports the resolved value.
                library_discovery_appdetails_enabled:
                  type: boolean
                  description: >-
                    Admin-libraries amendment (2026-08-01). Absent = unchanged (pointer decode,
                    same rule as library_discovery_enabled above).
                mic_capture_enabled:
                  type: boolean
                  description: >-
                    Microphone capture amendment (2026-08-02). Absent = unchanged (pointer
                    decode). Default false. Gates the POST /v1/sessions mic request; affects
                    subsequent launches only.
                image_update_policy:
                  type: string
                  enum: [manual, notify, auto]
                  description: >-
                    P3 (image management). Absent = unchanged (pointer decode). Applied by
                    POST /v1/admin/images/sync — see the App-image management P3 section.
                allowed_origins:
                  type: array
                  items: { type: string }
                  description: >-
                    First-run wizard v2 §S6e (migration 0064). The signaling origin allow-list.
                    ABSENT = UNCHANGED; an explicitly-sent [] CLEARS the list. Those are
                    different requests and the server distinguishes them (pointer decode), so a
                    PATCH that only changes the registration mode can never wipe the allow-list.
                    Each entry must be scheme + host only (http/https, no path, query,
                    credentials or trailing slash); the server stores the NORMALIZED form, so
                    what is saved is exactly what /v1/signal compares against. "*" IS REJECTED
                    OUTRIGHT with 400 validation_failed - a wildcard would discard the layer
                    entirely. A bad entry is 400 naming its position, and nothing is written.
                    Setting this does NOT lift an environment override: when
                    QUASAR_ALLOWED_ORIGINS is SET it wins, and GET /v1/admin/access-check
                    reports which source is in force.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SettingsEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ─── admin: encrypted secrets ────────────────────────────────────────────
  # The reusable secrets facility. Values are AES-256-GCM encrypted in Postgres
  # under a master key that lives ONLY in the environment (QUASAR_SECRET_KEY),
  # and are decrypted at the point of use.
  #
  # THE WIRE IS WRITE-ONLY. No response on any route below ever contains a
  # secret value. GET returns declarations plus configured/readable/origin and a
  # MASKED hint (last 4 characters, and nothing at all for a short value). There
  # is deliberately no "reveal" endpoint: a stored credential is for the server
  # to use, and an admin who needs the value again re-issues it at the provider.
  /v1/admin/secrets:
    get:
      tags: [admin]
      summary: List the secrets this deployment declares, and their state (never a value).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SecretsEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/secrets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: "A declared secret name, e.g. artwork.steamgriddb.api_key. An undeclared name is 404, not a new row."
    put:
      tags: [admin]
      summary: Set or replace a secret's value (write-only).
      description: >-
        Encrypts and stores the value. Answers 409 conflict when no master key is configured
        (QUASAR_SECRET_KEY unset), and a DIFFERENT 409 message when the configured master key
        does not match what is already stored - those are different operator problems and are
        deliberately not collapsed into one answer. The response is the same status shape as
        GET and never echoes the value.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, minLength: 1, description: "The plaintext credential. Never returned by any endpoint." }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SecretEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      summary: Clear a stored secret.
      description: >-
        Removes the stored value. Any environment-variable fallback the secret declares then
        takes effect again, so clearing cannot lock an operator out of a feature they had
        working before the admin UI existed.
      x-required-role: admin
      responses:
        "204": { description: Secret cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── remote access: TLS certificate + access self-check ──────────────────
  # First-run wizard v2 §S6 (2026-08-09; Opus + operator sign-off granted for
  # exactly these three routes plus the allowed_origins settings field).
  #
  # THE PROBLEM THESE SOLVE. An operator reaches the instance by a name the
  # certificate does not cover -> the browser refuses or warns -> the page is
  # not a secure context -> the MICROPHONE is unavailable, with a message that
  # correctly says "needs HTTPS" but cannot say why theirs is not trusted. And
  # separately: the signaling origin allow-list returns a 403 that is
  # structurally invisible to browser JS, so a Host-rewriting reverse proxy
  # surfaces to the user as "signaling connection failed" with no cause.
  #
  # THREE SUPPORTED TLS TOPOLOGIES, NONE MANDATORY (§S6-0). (A) self-signed on
  # Quasar's own listener - download and trust it, verifying the fingerprint.
  # (B) the operator's own certificate on Quasar's listener - mount it at
  # QUASAR_TLS_CERT/QUASAR_TLS_KEY.
  # (C) an external reverse proxy (e.g. Caddy + Let's Encrypt) terminating TLS -
  # Quasar keeps its self-signed certificate internally and that is CORRECT.
  # A, B and C all finish setup, and a client must never present any of them as
  # a required step. (An admin UPLOAD route for topology B was specified as §S6d
  # and is deliberately NOT on this contract yet: it is the only surface that
  # would accept a private key, and it needs a listener-level design decision
  # rather than a transport gate on the shared router. Until it exists, topology
  # B is served by mounting the files.)
  /v1/tls/certificate.pem:
    get:
      tags: [access]
      summary: Download the leaf certificate this listener currently serves (PEM).
      description: |
        §S6a. Returns the PUBLIC half of the certificate in force, so an operator can add it
        to their OS trust store and reach the instance over a trusted HTTPS origin.

        DELIBERATELY UNAUTHENTICATED, and that is correct rather than lax: a client that does
        not yet trust the certificate frequently cannot complete a login in order to fetch it,
        so requiring a bearer token would make this route useless in exactly the situation it
        exists for. It discloses SANs (internal hostnames, LAN IPs) to anyone who can reach the
        port - so does the TLS handshake itself. Equivalent exposure, not new exposure.

        NEVER THE PRIVATE KEY. The server builds this response by re-encoding PEM from the
        PARSED LEAF'S DER with a compile-time "CERTIFICATE" block type; it does not read the
        key path, and no key bytes are in scope on this path. An explicit test asserts no
        PRIVATE KEY block can appear in the response.

        THE HONEST CAVEAT: downloading a certificate over a connection you do not yet trust is
        trust-on-first-use, and a MITM can serve their own. The mitigation is the fingerprint,
        and it only works OUT OF BAND - the control plane logs the SHA-256 fingerprint at
        startup, and it is also returned here as X-Quasar-Certificate-Fingerprint. A client
        MUST tell the operator to compare the two before trusting. Without that instruction the
        download button is security theatre; with it, it is a real verification step.

        Under topology C the certificate returned here is Quasar's INTERNAL one and is not what
        the operator's browser validates. GET /v1/admin/access-check says so.
      security: []
      responses:
        "200":
          description: >-
            The leaf certificate, PEM. Sent as an attachment with Cache-Control: no-store (the
            certificate can be replaced at any moment by an upload, and a cached stale one is
            precisely what would make an operator trust the wrong fingerprint).
          headers:
            X-Quasar-Certificate-Fingerprint:
              schema: { type: string }
              description: "SHA-256 over the DER, uppercase colon-separated hex - the same form the startup log and a browser's certificate viewer show, so the comparison is literal."
          content:
            application/x-pem-file: { schema: { type: string } }
        "503":
          description: "TLS is disabled on this control plane (QUASAR_TLS=off), so it serves no certificate."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/admin/access-check:
    get:
      tags: [admin]
      summary: Diagnose reachability for the request that called it - certificate, origin, secure context.
      description: |
        §S6b. Turns three invisible failures into three sentences, for THIS request: the Host
        and Origin seen, whether that host is covered by the served certificate's SANs, the
        fingerprint and days-to-expiry, whether the origin would pass the /v1/signal allow-list,
        and whether that allow-list is configured at all.

        TOPOLOGY DETECTION (§S6-0). When the request arrives with X-Forwarded-Proto or RFC 7239
        Forwarded, a proxy is in front of this control plane, so its certificate is an internal
        detail the browser never validates: `certificate.in_use` is FALSE with a reason saying
        the setup is supported and complete, and the answer focuses entirely on origins.
        Telling an operator to fix something already correct is the failure mode this endpoint
        exists to prevent.

        FORWARDED HEADERS SOFTEN ADVICE AND NOTHING ELSE. They are trivially spoofable by any
        client; the worst a hostile one achieves is making an admin-gated diagnostics page tell
        THEM that their own certificate is not in use. No access decision, on this route or any
        other, reads them.

        Admin-gated by the existing RequireAuth -> RequireAdmin middleware. It reflects the Host
        and Origin headers, so both are LENGTH-CAPPED (256 chars) and are only ever rendered as
        JSON string values - a client must never put them through dangerouslySetInnerHTML. It
        discloses configuration an admin can already read.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/AccessCheck" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/invites:
    get:
      tags: [admin]
      summary: List minted invites (never the plaintext code).
      x-required-role: admin
      parameters:
        # UI v3 amendment (2026-08-28, additive). Absent = `all` = today's behaviour.
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [all, pending], default: all }
          description: >-
            `pending` returns only invites that would still redeem right now: not revoked,
            not expired, and `used_count < max_uses`. The three exclusions are one fact -
            "this code no longer works" - and the client cannot compute the third for a
            page it has not loaded. `all` (the default) filters nothing. An unrecognized
            value is `400 validation_failed` with code `invalid_state`.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { type: object, properties: { invites: { type: array, items: { $ref: "#/components/schemas/Invite" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
