  # ─── admin: session oversight + trace ────────────────────────────────────
  /v1/admin/sessions:
    get:
      tags: [admin]
      summary: List all sessions (oversight).
      x-required-role: admin
      parameters:
        # UI v3 amendment (2026-08-28, additive): an OPTIONAL server-side state
        # filter. Absent means `all`, which is byte-for-byte the pre-amendment
        # behaviour - a client that has never heard of this parameter sees no
        # change. It exists because "how many sessions are live" is not
        # answerable client-side once the fleet has more sessions than one page.
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [all, active, ended, failed], default: all }
          description: >-
            `active` = pending, assigned, starting, running, stopping - every NON-TERMINAL
            state. That is one state wider than the reservation-holding set (`pending` holds
            no GPU yet), because "live sessions" on an oversight page means "not finished",
            not "consuming a slot". `ended` = stopped only. `failed` = failed only. `all`
            (the default) filters nothing. An unrecognized
            value is `400 validation_failed` with code `invalid_state`, never a silent
