      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePolicyResponse" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePolicyResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
