                max_uses: { type: integer, default: 1 }
                expires_at: { type: string, format: date-time }
                note: { type: string }
      responses:
        "201": { description: Invite minted. , content: { application/json: { schema: { type: object, properties: { invite: { $ref: "#/components/schemas/InviteMinted" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/invites/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
