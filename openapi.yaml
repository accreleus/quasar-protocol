  # ─── admin: background jobs (jobs framework, 2026-08-12) ─────────────────
  # ADDITIVE AMENDMENT. Five admin routes over the `jobs` / `job_runs` tables
  # (migration 0066), gated by the SAME server-enforced RequireAuth ->
  # RequireAdmin chain as every other /v1/admin/* route — composed at
  # registration, never as an inline role check in the handler.
  #
  # The framework's one durable idea: every property an operator wants of a
  # background job (last run, duration, result, next run, is it running, may it
  # run at 3pm) is a property of A RECORD OF A RUN, and no such record existed
  # before. So a `pending` row IS the next run; there is no next_run_at column
  # to drift out of sync with the thing it describes.
  /v1/admin/jobs:
    get:
      tags: [admin]
      summary: List every registered background job with its schedule and run state.
      description: >-
        The Jobs viewer's one call. Cursor-paginated {items, next_cursor} over job id, the
        same envelope the admin session list uses. Includes UNMANAGED jobs — background work
        that exists in code but has not been adopted by the framework — because a page whose
        purpose is "what background work exists" that hides half of it reproduces the exact
        problem it was built to fix. An unmanaged row carries null for every run-derived field
        plus a human `unmanaged_note` naming the file that hard-codes it.
      x-required-role: admin
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Opaque forward cursor (the previous page's next_cursor; it is a job id)." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 }, description: "Page size. An unparseable or out-of-range value falls back to the default rather than erroring." }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/JobsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/jobs/{job_id}:
    parameters: [ { $ref: "#/components/parameters/PathJobId" } ]
    get:
      tags: [admin]
      summary: Read one background job.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: Edit the admin-owned half of a job's schedule.
      description: >-
        The `jobs` row is split by OWNERSHIP: identity (name, description, plane, scope,
        managed) is code-owned and reconciled at every boot, and the schedule fields below
        are ADMIN-OWNED and never overwritten by that reconcile. An all-optional body, the
        repo's PATCH convention, so "absent" is distinguishable from "zero" — but an UNKNOWN
        key is rejected with 400 rather than silently ignored, because a typo'd field name
        accepted with a 200 is the "did my edit take effect" confusion this surface exists to
        end. `window_start` and `window_end` move together: both set, or both null to clear.
        400 validation_failed = malformed body, unknown key, or a value of the wrong JSON
        type; 422 validation_failed = a well-formed value the schedule refuses (interval below
        60s, interval_secs on a non-interval job, window_start == window_end, a window_days
        value outside 0..6, an unknown IANA zone, history_limit outside 1..500).
        409 job_unmanaged = the job is not adopted and has no schedule to edit.
        409 schedule_locked = an environment variable is authoritative over this job's
        interval; the edit is refused rather than silently accepted and overruled.
        Every accepted PATCH writes an admin_activity row (`job.update`, `{"keys": [...]}`).
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/JobPatchRequest" } } }
      responses:
        "200": { description: Updated; the job in its post-edit shape. , content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "job_unmanaged (not adopted) or schedule_locked (an env var is authoritative)." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "422": { description: "validation_failed — a well-formed value the schedule model refuses." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/admin/jobs/{job_id}/run:
    parameters: [ { $ref: "#/components/parameters/PathJobId" } ]
    post:
      tags: [admin]
      summary: Trigger a job now (queue a manual run).
      description: >-
        "The framework requests; the job decides." A manual run IGNORES THE WINDOW — an
        operator pressing Run now has said what they want about timing — and NEVER ignores the
        job's own safety gates: a runner that refuses (a host with live sessions, say) reports
        `deferred`, which is an outcome and not an error. A run is queued, not executed
        inline: the response is 202 with the pending run's id, and `eta_note` is a plain
        string the UI renders verbatim ("the host claims due jobs about every 60 s" for an
        agent-plane job) so Run now does not read as broken for a minute. If a pending run
        already exists it is PULLED FORWARD rather than duplicated — at most one open run per
        (job, target) is a database invariant. Audited as `job.run`.
      x-required-role: admin
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/JobRunNowRequest" } } }
      responses:
        "202": { description: Run queued. , content: { application/json: { schema: { $ref: "#/components/schemas/JobRunNowAccepted" } } } }
        "400": { description: "validation_failed — malformed body, or host_id missing for a host-scoped job / supplied for an instance-scoped one." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "job_already_running, job_disabled (a disabled job never runs, not even manually), or job_unmanaged." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/admin/jobs/{job_id}/runs:
    parameters: [ { $ref: "#/components/parameters/PathJobId" } ]
    get:
      tags: [admin]
      summary: Read one job's bounded run history (newest first).
      x-required-role: admin
      parameters:
        - { name: host_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Narrow to one target host's history. Meaningful for a host-scoped job; an instance-scoped job's runs carry no host." }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Opaque forward cursor (the previous page's next_cursor)." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 50 }, description: "Page size; an unparseable or out-of-range value falls back to the default." }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/JobRunsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

