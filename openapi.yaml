      tags: [admin]
      summary: "UI-P4: edit a launch profile, including reordering its rungs (order IS preference)."
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LaunchProfileWrite" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/LaunchProfile" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
