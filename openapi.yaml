  # ─── agent-internal: library discovery (Steam library discovery Phase 4) ──
  # THE SAME PULL SHAPE AS THE #175 GC ENDPOINTS ABOVE, AND FOR THE SAME REASON:
  # the control plane never touches a host filesystem (invariant #1), so the walk
  # runs agent-side. Reusing this channel is what keeps agent-api.md BYTE-IDENTICAL
  # - a new additive HTTP surface, not a WebSocket-message change.
  #
  # NOTHING IN EITHER DIRECTION IDENTIFIES A USER. The job is a scan id, an opaque
  # home path and two bounds; the report is a scan id, a flag and a list of
  # installed titles. The scan_id -> (user, app, host) mapping lives in
  # library_scans and is resolved control-plane-side on receipt, which is
  # agent-api.md's P2-01 verdict (per-user concerns never reach the agent)
  # honoured literally. A change here that put a user on the wire would be the
  # wrong change even though the JSON would still validate.
  #
  # Auth is the per-node node_secret (Authorization: Bearer <node_secret> plus
  # X-Quasar-Node), not a user bearer token - the same scheme as gc-pending /
  # gc-confirm, verified constant-time against hosts.node_secret_hash, with the
  # resolved host_id scoping every query.
  /v1/agent/library/scan-pending:
    get:
      tags: [agent]
      summary: "Node-agent internal: claim pending Steam library scans for this host. (Not operator-facing.)"
      description: >-
        Phase 4. Claims up to 50 pending scans for the calling host with FOR UPDATE SKIP LOCKED,
        so two agents polling simultaneously get DISJOINT sets rather than blocking on each other.
        An empty list is the steady state, and is also what this returns when discovery is
        switched off - the master switch is re-read HERE as well as in the scheduler, because the
        scheduler is what stops rows being created and this is what stops an already-queued row
        being handed out after an operator turned the feature off. relative_roots and the two
        bounds are control-plane-supplied rather than agent constants, so a bound can be tightened
        without an agent release. root_path is control-plane-supplied and the agent validates
        containment against its own configured homes root before walking it - a path outside that
        root is refused and reported as an error, never walked.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/LibraryScanPendingResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Could not list pending scans. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/agent/library/scan-report:
    post:
      tags: [agent]
      summary: "Node-agent internal: report one scan's result. (Not operator-facing.)"
      description: >-
        Phase 4. Accepting an ok:true report runs the whole reconciliation IN ONE TRANSACTION with
        marking the scan reported - observations upserted and pruned, the suppression ladder
        evaluated ONCE, tiles created for what publishes, tiles disabled and their provider
        entitlements revoked for what suppresses, and the scanning user's provider entitlements
        granted and revoked. Tile creation and the first entitlement commit TOGETHER, because
        auto-publish means they are no longer separated by an admin decision and a tile that exists
        with no entitlement is a window in which a user sees nothing where the feature just claimed
        to add something.
        Scan-observability amendment (2026-08-01): reconciliation additionally BACKFILLS existing
        tiles of this parent whose enrichable fields are EMPTY (description, initially), from the
        same appdetails source the suppression rung uses - gated by the SAME appdetails switch (off
        = no backfill, no third-party call), bounded per scan, and FILL-BLANKS-ONLY: a non-empty
        field is never overwritten, so an operator's edit survives every scan. This is why "Scan
        now" is also the "fetch newly-supported data for what I already have" button - as
        enrichment capabilities grow, a re-scan tops up blanks instead of requiring tiles to be
        deleted and re-discovered. The per-scan outcome counts (including backfilled) are stored
        on the scan row (migration 0048) and surfaced via LibraryStatus.recent_scans.
        An ok:false report CHANGES NOTHING BUT ITS OWN ROW: revocation is driven
        by absence, and absence is exactly what a transient error looks like, so "reconcile whatever
        entries did arrive" would make a partial walk indistinguishable from an uninstall. 404 for a
        scan the calling host does not own - indistinguishable from one that does not exist,
        deliberately, since a 403 would confirm another host's scan id to anyone holding one valid
        node secret. 409 for a scan that is not currently claimed, which is where a duplicate report
        after a successful reconcile lands.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryScanReport" } } }
      responses:
        "200": { description: Report accepted (and reconciled, if ok). , content: { application/json: { schema: { $ref: "#/components/schemas/LibraryScanAccepted" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { description: Could not record or reconcile the report. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  # ─── agent-internal: background jobs (jobs framework, 2026-08-12) ────────
  # THE SAME PULL SHAPE AS THE #175 GC AND PHASE-4 LIBRARY ENDPOINTS ABOVE, AND FOR
  # THE THIRD TIME FOR THE SAME REASON: a claim is a DATABASE ROW, so an agent
  # reconnect has nothing to correlate and `agent-api.md` stays BYTE-IDENTICAL — a
  # new additive HTTP surface, not a WebSocket-message change. An implementer who
  # concludes a new AgentMsg variant is needed here is escalating, not patching.
  #
  # THE AGENT ASKS; IT IS NEVER TOLD. Nothing pushes a job at a host: the host polls
  # when it is ready, claims what is due FOR ITSELF, and reports what its own runner
  # decided. A runner's gate refusing is an ordinary `deferred` report, not an error.
  #
  # Auth is the per-node node_secret (Authorization: Bearer <node_secret> plus
  # X-Quasar-Node), not a user bearer token — the same scheme as gc-pending /
  # scan-pending, verified constant-time against hosts.node_secret_hash, with the
  # resolved host_id scoping every query.
  /v1/agent/jobs/pending:
    get:
      tags: [agent]
      summary: "Node-agent internal: claim this host's due agent-plane job runs. (Not operator-facing.)"
      description: >-
        THE CLAIM IS THE RESPONSE. Returning a run and marking it `running` is one statement
        (FOR UPDATE ... SKIP LOCKED), so two polls arriving together take DISJOINT sets rather
        than both executing the same warm-up. Capped at 5 runs per poll: a host coming back
        after an outage with a dozen jobs due must not start all of them at once, and the rest
        are still pending because the work is a durable row. A claim that is then never
        reported is not lost work — the dispatcher's reaper aborts it after deadline_secs and
        materializes a fresh pending row. An empty list is the steady state, and is also what
        this returns when the jobs master switch is off: the switch is re-read HERE as well as
        in the dispatcher, because the dispatcher is what stops rows being CREATED and this is
        what stops an already-materialized row being HANDED OUT.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/AgentJobsPendingResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Could not claim pending jobs. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/agent/jobs/report:
    post:
      tags: [agent]
      summary: "Node-agent internal: close a claimed job run with its outcome. (Not operator-facing.)"
      description: >-
        IDEMPOTENT BY CONTRACT: a report for a run that is already terminal is a 200 no-op, so
        an agent retrying after a network blip is safe — the alternative, a 409 the agent
        cannot act on, would turn a run that actually succeeded into a permanent error in an
        operator's face. `state` is the closed set {succeeded, failed, deferred, skipped};
        `aborted` is deliberately ABSENT, because it is the reaper's verdict on a host that
        said nothing and a host claiming it would be describing a decision it does not get to
        make. Ownership is checked BEFORE anything is written and a failure is a 401, never a
        404: an unknown run id, a run belonging to another host, and a bad node secret are one
        indistinguishable answer, so these routes never become an oracle for run ids. A
        `deferred` report is a normal outcome (the runner's own gate refused) and the
        dispatcher schedules the retry on the persisted backoff ladder.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentJobReportRequest" } } }
      responses:
        "200": { description: Report recorded (or a no-op for an already-terminal run). , content: { application/json: { schema: { $ref: "#/components/schemas/AgentJobReportAccepted" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Could not record the report (the run moved under the caller, or the summary blew the 4096-byte ceiling). , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Could not record the job report. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  # ─── signaling (WebSocket) ───────────────────────────────────────────────
  /v1/signal:
    get:
      tags: [signaling]
      summary: WebRTC signaling channel (WebSocket upgrade; not a REST body).
      description: |
        Upgrades to a WebSocket carrying the signaling protocol (offer/answer/ICE).
        Authenticated by the single-use `?token=<...>` minted in the launch response,
        NOT a bearer header. The frame protocol is defined in protocol/signaling.md;
        OpenAPI cannot model it — this stub exists only for route-coverage completeness.
      security: []
      x-websocket: true
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: "Single-use signaling token from the launch response." }
      responses:
        "101": { description: Switching Protocols (WebSocket). }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "The opaque access_token from POST /v1/auth/login (Authorization: Bearer <access_token>)."

  parameters:
    ClientVersionHeader:
      name: X-Quasar-Client-Version
      in: header
      required: false
      description: >-
        #380 (P9-08 follow-up): the calling client's own version, strict MAJOR.MINOR.PATCH.
        Accepted on EVERY bearer-authenticated endpoint and enforced once in the shared auth
        middleware, so it is declared here rather than repeated on each operation (see
        info.x-global-request-headers). Absent = web/legacy client, no gate - identical to an
        omitted client_version at login. Below the operator floor = 426 client_too_old. A value
        that is not valid semver is treated as ABSENT and logged, deliberately unlike login
        (which gates it): this header rides every request, so gating a typo would brick an
        already-signed-in client on every call, and the gate is cooperative anyway - omitting
        the header evades it just as effectively.
      schema: { type: string, pattern: "^v?[0-9]+\\.[0-9]+\\.[0-9]+$" }
      example: "1.2.0"
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathAppId:
      name: app_id
      in: path
      required: true
      description: "UI-P1: an app id in a path whose parameter is named app_id (PathId hardcodes name: id)."
      schema: { type: string, format: uuid }
    PathEntitlementId:
      name: entitlement_id
      in: path
      required: true
      description: >-
        Steam library discovery Phase 2: the entitlement being revoked. It must belong to the
        app named by the sibling {id}; a well-formed pair that does not match is 404, never a
        cross-app delete.
      schema: { type: string, format: uuid }
    PathProvider:
      name: provider
      in: path
      required: true
      description: >-
        #465 amendment: the library_provider name (e.g. "steam"), NOT an app id - this route
        exists precisely because the caller does not have one yet (see the amendment note on
        POST /v1/admin/library-providers/{provider}/entitlement-mode). Matched
        case-insensitively against apps.library_provider, mirroring EnsureProviderApp's own
        lower-casing on write. An empty/whitespace-only value is 400 validation_failed.
      schema: { type: string, minLength: 1 }
    PathExternalId:
      name: external_id
      in: path
      required: true
      description: >-
        Steam library discovery Phase 4: the provider title id an appid rule applies to - today a
        Steam appid. VALIDATED AT THE HANDLER AS WELL AS BY THE DATABASE CHECK, deliberately: this
        table is ADMIN-WRITABLE and takes the value straight from a URL, and the value ends up in
        STEAM_STARTUP_FLAGS, which the quasar-steam entrypoint word-splits with `read -r -a`. The
        handler is what makes a bad value a 400 instead of a 500; the CHECK is the durable guard and
        the only one of the two that survives an admin editing the row directly later. Bounded below
        2^32 in addition to the pattern.
      schema: { type: string, pattern: "^[1-9][0-9]{0,9}$" }
    PathJobId:
      name: job_id
      in: path
      required: true
      description: >-
        Jobs framework (2026-08-12): a job's id. NOT a uuid — it is the code-owned dotted
        identifier from the registry ("artwork.sweep", "template.warmup"), which is also the
        `jobs` primary key, so the id in a URL is the same string an operator reads in a log
        line. That is deliberate: a job's identity is authored in code and reconciled at boot,
        never minted by a database default.
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing/invalid/expired/revoked token.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Authenticated but insufficient role / not the owner (precedes resource lookup).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: No such resource.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: Conflict (duplicate, in-use, quota, non-swappable, home-in-use, …).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationFailed:
      description: Malformed or invalid request.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Too many requests.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ClientTooOld:
      description: >-
        client_too_old (P9-08 / #380) - the presented client version is below the
        operator-configured floor. Emitted by POST /v1/auth/login (body client_version) and by
        the shared auth middleware on any bearer endpoint (header X-Quasar-Client-Version); the
        body is byte-identical either way, so a client parses it from one place.
      content: { application/json: { schema: { $ref: "#/components/schemas/ClientTooOldError" } } }
    Unavailable:
      description: "no_host_available / capacity_exhausted — well-formed but no room to place now (retryable)."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  schemas:
    Role:
      type: string
      enum: [user, admin]
    RegistrationMode:
      type: string
      enum: [closed, invite_only, open]
    Encoder:
      type: string
      enum: [openh264, va, nvenc, vulkan]
    H264Profile:
      type: string
      enum: [constrained-baseline, baseline, main, high]
    AppKind:
      type: string
      description: >-
        UI-P1: presentation-only library classification. Nothing in scheduling, admission,
        profile/codec resolution, or the agent wire reads it.
        STEAM LIBRARY DISCOVERY PHASE 3 WIDENED THIS ENUM TO ADD 'launcher' (migration 0044) -
        additive, no existing value is removed or redefined. It is the category the Steam
        provider app is filed under once it has derived children; it stays in the library
        rather than being hidden. THE PRESENTATION-ONLY PROMISE ABOVE IS UNCHANGED AND IS LOAD
        BEARING: library discovery is triggered by AdminApp.library_provider and never by kind,
        so an operator changing this dropdown can never stop a background job. The single
        server-side reader is artwork resolution, which short-circuits 'desktop' AND 'launcher'
        to source='none' - presentation deciding presentation, see control-api.md
        §Cover artwork.
        FORWARD COMPATIBILITY: a client pinned to a protocol before this amendment holds a
        closed two-value union and will receive kind: "launcher". Nothing crashes - a TS union
        is erased at runtime and the library's kind filter simply never matches - so the tile
        appears under "All" and under no segment. Benign, but a degradation; re-pin the client.
      enum: [game, desktop, launcher]
    AppOrigin:
      type: string
      description: >-
        Steam library discovery Phase 3 (apps.origin, migration 0044): how this app row came to
        exist. 'manual' = an operator created it, which is every app predating 0044 and every
        app an admin creates. 'discovered' = a library-discovery sync created it - WRITTEN
        SINCE PHASE 4 (migration 0045) by the scan reconciler. PROVENANCE, NOT AUTHORITY - both launch identically. It is
        READ-ONLY and admin-only: see AdminApp.origin.
      enum: [manual, discovered]
    LibraryProvider:
      type: string
      description: >-
        Steam library discovery Phase 3 (apps.library_provider, migration 0044): this app IS the
        configured client for external library provider X, so a user's installs under its
        managed home can be discovered. "" = not a provider app, which is every app predating
        0044. Distinct from ExternalSource, which says the app IS a provider TITLE; a derived
        tile carries external_source and never library_provider. Enumerated + a DB CHECK for the
        same reason as AppKind; widening the enum is a later migration.
      enum: ["", steam]
    ExternalSource:
      type: string
      description: >-
        Steam library discovery Phase 1: which external library provider this app IS a title of.
        "" means the app is not a provider title, which is every app predating migration 0042 -
        so "" is the meaningful default value, not a missing one. Enumerated + a DB CHECK for the
        same reason as AppKind; widening the enum is a later migration.
      enum: ["", steam]
    Codec:
      type: string
      description: "Multi-codec: the WIRE session video codec (h265 is HEVC). Resolved server-side at launch; the client answers the single codec the host offers. Distinct from CatalogCodec, which spells HEVC 'hevc'."
      enum: [h264, h265, av1]
    CatalogCodec:
      type: string
      description: >-
        The CATALOG codec vocabulary used by stream profiles (rungs). Note 'hevc', not the wire
        'h265' - the rename is bridged in exactly one place server-side and never on this surface.
      enum: [h264, hevc, av1]
    RungRejection:
      type: string
      description: >-
        UI-P6: the clamp that rejected a rung during the walk. Treat this set as OPEN - render an
        unrecognised value rather than assuming the list is closed. host_encoder=clamp 1,
        client_decode=clamp 2/3 (codec), decode_height=clamp 2/3 (resolution), decode_history=clamp
        4, hardware_encoder=clamp 5, encoder_throughput=clamp 6 (#506: the host's reported sustained
        encode throughput for this codec cannot carry the LAUNCH-EFFECTIVE width x height x fps - the
        rung's values with any explicit stream.* size override applied - see agent-api.md
        `capacity.codec_throughput`; a host that reports no hint never rejects this way),
        unknown_codec=a rung whose catalog codec does not map (hand-edited data; `codec` then carries
        the raw catalog value).
      enum: [host_encoder, client_decode, decode_height, decode_history, hardware_encoder, encoder_throughput, unknown_codec]
    CodecDecisionRung:
      type: object
      description: "UI-P6: one rung's verdict in the resolution walk."
      required: [rung_id, codec, rejected_by, selected, clamps_bypassed]
      properties:
        rung_id: { type: string }
        codec:
          type: string
          description: >-
            Wire vocabulary (h264|h265|av1), except when rejected_by is unknown_codec, where it is
            the raw unmappable catalog value - the only useful thing to show for a hand-edited row.
        rejected_by:
          oneOf:
            - { $ref: "#/components/schemas/RungRejection" }
            - { type: "null" }
          description: "The clamp that killed this rung, or null when it passed. A floor-selected rung KEEPS this - see CodecDecision."
        selected:
          type: boolean
          description: "The rung that was actually dispatched. Exactly one entry per recorded decision."
        clamps_bypassed:
          type: boolean
          description: >-
            This rung was dispatched WITHOUT being measured against the full clamp chain - the
            clamp-0 override path (clamps 2/3/4/5/6 skipped) or the floor (every clamp skipped).
            Never set on a rung that won the walk.
    CodecDecision:
      type: object
      description: >-
        UI-P6: how this session's rung/codec was resolved. Persisted at launch and echoed on every
        session body; null for every pre-UI-P6 session and for any launch that walked no rung chain
        (console, or a legacy/tier launch that resolved no launch profile).

        THE THREE OUTCOMES ARE DELIBERATELY DISTINGUISHABLE and a client must not collapse them,
        because `stream.codec` is identical in all three. Won on merit: selected with
        rejected_by=null, clamps_bypassed=false, floor=false, override=null. Operator override:
        `override` names the forced codec and the selected rung has clamps_bypassed=true with
        rejected_by=null (it SKIPPED clamps 2/3, 4, 5 and 6 rather than surviving them). Floor:
        floor=true and the selected rung is clamps_bypassed=true WHILE STILL CARRYING the
        rejected_by that killed it - it was dispatched despite being rejected. `floor` and
        `clamps_bypassed` answer different questions ("did anything survive?" vs "was THIS rung
        measured?") and the override case sets the second without the first; do not merge them.
      required: [result_rung, result_codec, override, floor, considered]
      properties:
        result_rung: { type: string, description: "The dispatched rung id." }
        result_codec: { $ref: "#/components/schemas/Codec" }
        override:
          oneOf:
            - { $ref: "#/components/schemas/Codec" }
            - { type: "null" }
          description: "The operator/diagnostic stream.codec that pre-empted the walk (clamp 0), or null."
        floor:
          type: boolean
          description: "NO rung survived the clamp chain and the unconditional h264 floor fired."
        considered:
          type: array
          description: >-
            Every rung WALKED, in position order. The walk stops at the first survivor, so a clean
            top-rung win lists exactly one entry - that is the whole decision, not a truncation.
          items: { $ref: "#/components/schemas/CodecDecisionRung" }
    ProfilePolicy:
      type: string
      description: >-
        How an app resolves its launch profile. UI-P4 REMOVED the value 'custom' (breaking): under
        the two-object model every app points at a launch profile, and 'custom' was also the one
        mode that could not express a codec. profile_policy:"custom" is now 400 validation_failed.
        inherit = the user/global default decides; prefer = the app's default_profile_id, the user
        may still override; force = the app's profile always.
      enum: [inherit, prefer, force]
    WriteWarning:
      type: object
      description: >-
        UI-P4: a non-fatal advisory returned on an admin profile write. A warning NEVER fails the
        request - it reports a configuration that is legal but almost certainly not what the
        operator meant.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [h264_floor_not_last, floor_not_least_demanding]
          description: >-
            h264_floor_not_last - every rung after the H.264 rung is unreachable, because H.264
            passes every clamp. floor_not_least_demanding - the H.264 rung has a higher
            min_offer_bandwidth_kbps or min_decode_height than a rung above it, or requires a
            hardware encoder while a rung above it does not; a floor harder to satisfy than the
            rung above it is a misconfiguration.
        message: { type: string }
    SessionState:
      type: string
      enum: [pending, assigned, starting, running, stopping, stopped, failed]

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "e.g. validation_failed, unauthorized, forbidden, not_found, conflict, session_quota_exceeded, home_in_use, home_not_provisioned, parent_app_disabled, profile_ineligible, profile_not_launchable_for_app, no_host_available, capacity_exhausted, restart_required, rate_limited, internal. Open string, not an enum: new codes are additive and an unknown one falls through to a client's generic per-status branch." }
        message: { type: string }
        live_sessions: { type: integer, description: "Present on restart_required." }
        session_id:
          type: string
          format: uuid
          description: >-
            Steam library discovery Phase 3, ADDITIVE: present on home_in_use when the guard could
            name the CONFLICTING live session - the one already holding the home. It is here so
            the client can offer "go to your running session" with a link instead of a dead-end
            toast. OMITTED rather than empty when the conflict is known but the session is not, so
            a client branches on presence and never renders a link to nowhere.
            Load-bearing once derived tiles exist: the lock is held by the PARENT's home, so a
            user who clicks a game tile can be refused because a DIFFERENT app (the Steam
            launcher, or another game from the same install) is running, and without the session
            id the refusal reads as a bug. See control-api.md §Derived tiles.
        derived_tiles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
          description: >-
            Steam library discovery Phase 3, ADDITIVE: present on the 409 conflict from
            DELETE /v1/apps/{id} when the app has derived tiles and ?delete_derived=true was not
            sent. A LIST, not a count - the point of the confirmation is that the admin sees what
            they are about to destroy. Capped; an empty array means the tiles could not be
            listed, never that there are none.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    ClientTooOldError:
      type: object
      description: >-
        The 426 body (P9-08 / #380). The standard error envelope plus the two advisory fields as
        TOP-LEVEL SIBLINGS - the same place the login 200 carries them, so a client reads them
        from one location whatever the status. A gated client never reaches a 200, so this is its
        only chance to learn which version to update to.
      required: [error, min_client_version]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        min_client_version:
          type: string
          description: "Always present on a 426 - the gate only fires when a floor is configured."
        latest_client_version:
          type: string
          description: "Present only when the operator configured a latest-version advisory."

    User:
      type: object
      required: [id, email, username, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time, description: "Present on /v1/me + register; omitted from the login user." }

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string }
        invite_code: { type: string, description: "Required when registration_mode = invite_only." }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_key: { type: string, description: "Optional; binds the minted token to this device (LP-SEC-01)." }
        client_version: { type: string, description: "Optional; native client (P9-01)." }
        contract_version: { type: string, description: "Optional; native client (P9-01)." }
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string, description: "The opaque bearer token — the field is access_token, NOT token." }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        min_client_version: { type: string }
        latest_client_version: { type: string }

    DevAgentSessionRequest:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
          default: user
          description: role=admin mints a REAL admin (same enforcement path); the server logs it at WARN with the source address.
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 28800
          default: 1800
          description: Identity lifetime. Default 30 min, hard cap 8 h. The token TTL is clamped to this — a token cannot outlive its user.
    DevAgentSessionResponse:
      type: object
      required: [access_token, token_type, expires_at, user, storage_keys]
      properties:
        access_token: { type: string, description: "The only credential ever returned — the identity's password is random and never exposed." }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time, description: "Token AND identity expiry; the reaper deletes the user at/after this instant." }
        user: { $ref: "#/components/schemas/User" }
        storage_keys:
          type: object
          description: "Convenience: the three web-SPA localStorage entries (quasar.auth.token / quasar.auth.expires_at / quasar.auth.user) ready to inject."
          additionalProperties: { type: string }

    SetupStatus:
      type: object
      required: [admin_exists, setup_completed]
      properties:
        admin_exists: { type: boolean, description: "True once any admin account exists (env-bootstrap or claim)." }
        setup_completed: { type: boolean, description: "True once the wizard finished or was explicitly skipped." }
    SetupClaimRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string }
        username: { type: string }
        password: { type: string, description: "Obeys the same strength rule as /v1/auth/register; never logged or returned." }
        device_key:
          type: string
          description: >-
            Optional; binds the minted founding-admin token to this device, exactly as
            POST /v1/auth/login does (LP-SEC-01). Without it the first admin's token carries
            no device_id and is therefore invisible to per-device revocation in Account >
            Devices — the longest-lived, highest-privilege session would be the one that
            cannot be killed if stolen. Absent is accepted and behaves as before.

    ImageCatalogEnvelope:
      type: object
      required: [images]
      properties:
        manifest_version: { type: integer, description: "The manifest schema version the cached catalog was parsed from." }
        catalog_ref: { type: string, description: "The pinned quasar-images ref the catalog was fetched at (instance_settings.image_catalog_ref)." }
        fetched_at: { type: [string, "null"], format: date-time, description: "When the cached catalog was last successfully refreshed. P3: backed by instance_settings.image_synced_at, so this survives a control-plane restart." }
        sync_error: { type: [string, "null"], description: "Non-null when the last sync failed; the cached catalog is still served. P3: backed by instance_settings.image_sync_error, so this survives a control-plane restart." }
        manifest_provenance:
          oneOf: [ { $ref: "#/components/schemas/ManifestProvenance" }, { type: "null" } ]
          description: "Where the served catalog came from (#548). Null until the first successful sync has recorded one."
        images:
          type: array
          items: { $ref: "#/components/schemas/CatalogImage" }
    ManifestProvenance:
      type: object
      required: [sha256, previous_sha256, commit_sha, ref, url, changed, changed_at]
      description: >-
        Provenance of the manifest the served catalog was parsed from (#548). Recorded only
        on a successful sync, in the same transaction as the catalog rows, so it can never
        describe a manifest other than the one whose rows are stored. Backed by
        instance_settings.image_manifest_* (schema.md, migration 0070).
      properties:
        sha256: { type: string, description: "SHA-256 of the fetched manifest bytes the served catalog was parsed from. Never empty - the envelope carries null instead when nothing has been recorded." }
        previous_sha256: { type: [string, "null"], description: "The digest recorded before sha256; null until a change has ever been observed." }
        commit_sha: { type: [string, "null"], description: "The resolved upstream commit the manifest was fetched at; null when ref resolution failed and the fetch fell back to the mutable ref." }
        ref: { type: string, description: "The configured quasar-images ref the catalog is pinned to (instance_settings.image_catalog_ref)." }
        url: { type: string, description: "The URL the manifest bytes were retrieved from." }
        changed: { type: boolean, description: "The digest moved at the LAST sync. Self-clears on the next unchanged sync; false on a first-ever sync, which has nothing to have changed from." }
        changed_at: { type: [string, "null"], format: date-time, description: "When the digest last moved. Durable - unlike changed, it does not self-clear." }
    CatalogImage:
      type: object
      required: [id, display_name, kind, version, installed]
      properties:
        id: { type: string, description: "Stable manifest id; never reused for a different image." }
        display_name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [prebuilt, template], description: "prebuilt = pull a registry ref; template = build locally (later phase)." }
        version: { type: string, description: "Upstream's version for this entry; an update is available when this exceeds installed_version." }
        registry_ref: { type: [string, "null"], description: "Pinned image reference for a prebuilt entry (never a floating tag)." }
        registry_digest: { type: [string, "null"], description: "P3 (#440). Content-digest form (name@sha256:<64hex>) resolved from registry_ref's tag at sync; empty/null when the last sync could not resolve it — installing this image is then refused (409 digest_unresolved) until a later sync resolves it. Install/update adopt this form, never the mutable registry_ref tag." }
        artwork: { type: object, additionalProperties: true }
        library_provider: { type: [string, "null"], description: "Set when this image is a library provider's canonical image (e.g. steam)." }
        installed: { type: boolean }
        installed_version: { type: [string, "null"] }
        pinned: { type: boolean, description: "P3: real. A pinned image is never auto-updated under any policy (auto sync or explicit .../update, both 409 while pinned)." }
        lazy: { type: boolean, description: "P3. True when installed without dispatching ensure-everywhere; hosts pull this image on first launch placement instead." }
        runtime_preset_id: { type: [string, "null"], format: uuid, description: "P5. The managed runtime_presets row materialized from this image's manifest runtime block at install; null when not installed or the image carries no runtime block. Makes the installed image launchable." }
        update_available: { type: boolean }
        hosts:
          type: array
          description: "Per-host presence (present from the phase that ships host_images; may be empty in the read-only P1 surface)."
          items: { $ref: "#/components/schemas/ImageHostState" }
    ImageInstallRequest:
      type: object
      description: "P3. Optional body; an omitted body or {} installs eagerly (lazy defaults false)."
      properties:
        lazy: { type: boolean, default: false, description: "P3. When true, seeds the installed_images adoption row without dispatching ensure-everywhere; hosts pull on first launch placement instead." }
    ImageUpdateResult:
      type: object
      required: [applied, image]
      properties:
        applied: { type: boolean, description: "P3. false (still 200) when installed_version already equalled the catalog version — a no-op, not an error." }
        image: { $ref: "#/components/schemas/CatalogImage" }
    ImageHostState:
      type: object
      required: [host_id, state]
      properties:
        host_id: { type: string, format: uuid }
        node_name: { type: string }
        version: { type: [string, "null"] }
        state: { type: string, enum: [absent, pulling, building, ready, failed] }
        error: { type: [string, "null"] }
        bytes: { type: [integer, "null"] }

    Device:
      type: object
      # Shared by the list (full shape) + the upsert response (id/first_seen_at/last_seen_at
      # only), so `required` is the intersection always present in every response.
      required: [id, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        device_key: { type: string }
        name: { type: string }
        trusted: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
        active_session_id: { type: [string, "null"], format: uuid }
        capabilities: { type: object, additionalProperties: true }
    DeviceUpsert:
      type: object
      properties:
        device_key: { type: string }
        capabilities: { type: object, additionalProperties: true }

    Stream:
      type: object
      # Shared shape: session.stream carries h264_profile + playout0_ms; an app's
      # display_stream carries only width/height/fps/bitrate_kbps. `required` is the
      # intersection present in both contexts.
      required: [width, height, fps, bitrate_kbps]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate_kbps: { type: integer }
        h264_profile: { $ref: "#/components/schemas/H264Profile" }
        codec: { allOf: [ { $ref: "#/components/schemas/Codec" } ], description: "Multi-codec: the resolved session video codec on session.stream; absent on an app's display_stream. Additive; h264 for every pre-multi-codec session. h264_profile applies only when codec is h264." }
        playout0_ms: { type: integer, description: "AS-02: tier-selected initial receiver playout target (ms) on session.stream; absent on an app's display_stream." }
        mic: { type: boolean, description: "Microphone capture (2026-08-02): the GRANTED state on session.stream (request mic AND instance mic_capture_enabled); absent on an app's display_stream and on pre-amendment sessions (absent = false)." }
        external_width:
          type: integer
          description: >-
            session-display-stream (approved 2026-08-16) (2026-08-16, approved — PR #15). Current EXTERNAL
            (encoded/streamed) width on session.stream; absent on an app's display_stream.
            PRESENT WHENEVER THE CONTROL PLANE KNOWS the current external size — i.e. it has seen
            a 202 from PATCH /v1/sessions/{id}/display or a session_metrics sample reporting it —
            INCLUDING when that size equals the launch width/height. ABSENT MEANS UNKNOWN (a
            fresh control plane, or no such signal yet for this session), NOT "at launch size" —
            do not infer launch size from absence. Ephemeral, in-memory control-plane cache of the
            last-known value (agent session_metrics is the authoritative source), lost on a
            control-plane restart until the next 202 or session_metrics sample repopulates it. See
            control-api.md for the INTERNAL-vs-EXTERNAL vocabulary.
        external_height:
          type: integer
          description: "session-display-stream (approved 2026-08-16). Pairs with external_width; see its description."
        external_resize_supported:
          type: boolean
          description: >-
            session-display-stream (approved 2026-08-16). Whether the assigned host's encoder can live-resize the
            stream at all (readback of agent-api.md session_metrics.external_resize_supported).
            Absent until an amendment-aware agent reports = unknown, never false.
        external_owner:
          type: string
          enum: [auto, pinned]
          description: >-
            abr-resolution-fps-ladder (approved 2026-08-16) amendment (2026-08-16, approved — PR #15). Who
            currently owns the live external size on session.stream: "auto" (the host's ABR
            resolution ladder) or "pinned" (a PATCH /v1/sessions/{id}/display stream_width/
            stream_height set it to a non-launch size, which suspends the ladder for the rest of
            the session or until released). Readback of agent-api.md
            session_metrics.external_owner. PRESENT ONLY WHEN KNOWN AND external_width/
            external_height differ from the launch width/height — mirrors external_width's
            presence rule, since the agent reports external_owner only in that same window.
            Absent on every pre-amendment session and while the external size sits at launch.
        rungs:
          type: array
          description: >-
            session-display-stream (approved 2026-08-16). The fixed, aspect-ratio-filtered table of [width,height]
            pairs this session's stream_width/stream_height may be set to via
            PATCH /v1/sessions/{id}/display (always <= the launch size, launch size always
            included). Always present on session.stream for a running session; absent on an app's
            display_stream. Not the admin-configured stream-profile "rungs" (AS10-01) — a separate,
            fixed table unrelated to the admin encode-rung catalog. 21:9 family membership is by a
            set of reduced ratios {43:18, 64:27, 7:3} — 3440x1440 reduces to 43:18, 2560x1080 to
            64:27 — control-api.md's table is the reference, not a computed tolerance.
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
    AppListItem:
      # UI-P1: kind + favourite are added HERE, so App and AdminApp — which are allOf
      # compositions over this schema — inherit both. There is no read shape that omits them.
      type: object
      required: [id, name, description, cover_url, hero_url, kind, parent_app_id, external_source, external_id, favourite, default_width, default_height, default_fps, default_bitrate_kbps, default_profile_id, profile_policy, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        cover_url:
          type: [string, "null"]
          description: >-
            UI-P7: the TILE crop - the 2:3 PORTRAIT library-tile artwork (16:10 before #385; the
            move to portrait box art is an operator-directed deviation from the signed-off mockup,
            and the hero crop stays wide). Null when the app has no
            artwork, which is the shipped default and renders the gradient tile. Written
            EXCLUSIVELY by the artwork service (/v1/admin/apps/{id}/artwork) for any app that
            has an artwork record; a value set directly via AppWrite is honoured only while the
            app has no artwork record.
        hero_url:
          type: [string, "null"]
          description: >-
            UI-P7, ADDITIVE: the HERO crop - a much wider banner asset for the detail/hero
            panels. A DIFFERENT source asset from cover_url, not the same image scaled: a
            ~2.1:1 tile stretched into a ~3:1 hero reads as a blown-up thumbnail. Null
            independently of cover_url (a title may have one crop and not the other); a client
            falls back hero_url -> cover_url -> gradient. Read-only: not accepted on AppWrite,
            written only by the artwork service.
        kind: { allOf: [ { $ref: "#/components/schemas/AppKind" } ], description: "UI-P1: presentation-only library classification (apps.kind). Always serialized; 'game' for every pre-UI-P1 row. Phase 3 added 'launcher' - see AppKind." }
        parent_app_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Steam library discovery Phase 3, ADDITIVE (apps.parent_app_id, migration 0044): the
            app this tile is DERIVED from, or null for a normal app - which is every app
            predating 0044. Always serialized. A derived tile carries identity and presentation
            only and borrows everything executable (image, runtime_spec, managed home, resource
            defaults, mounts) from its parent at launch; see control-api.md §Derived tiles.
            ON THE PUBLIC READ SHAPE DELIBERATELY, unlike origin and library_provider, and for
            one concrete reason: the single-writer lock is held by the PARENT's home, so with any
            tile in a family live, every other tile in that family answers
            409 home_in_use. The client needs parent_app_id to mark the siblings of a live
            session as blocked instead of letting the user discover it by clicking. That is a
            presentation nicety - THE ENFORCEMENT IS THE SERVER'S 409, never this field.
        external_source:
          allOf: [ { $ref: "#/components/schemas/ExternalSource" } ]
          description: >-
            Steam library discovery Phase 1, ADDITIVE (apps.external_source, migration 0042):
            "this app IS provider X's title Y", read together with external_id. Always serialized
            and never omitted - "" is the meaningful default ("not a provider title", the state of
            every pre-0042 app), so a client must be able to tell it from absent. Defined here on
            AppListItem, so App and AdminApp inherit it exactly as they inherit kind. Phase 1's
            only reader is the artwork service (§Cover artwork): a tagged app resolves its art by
            id and never enters the fuzzy title matcher. Nothing in scheduling, admission,
            profile/codec resolution, or the agent wire reads it.
        external_id:
          type: string
          pattern: "^([1-9][0-9]{0,9})?$"
          description: >-
            Steam library discovery Phase 1, ADDITIVE (apps.external_id, migration 0042): the
            provider-native id, today a Steam appid. Always serialized; "" when the app is not a
            provider title. A bare positive integer, no leading zero, no sign, no whitespace, no
            separators - the grammar is ARGUMENT-INJECTION CONTAINMENT, not tidiness; see
            AppWrite.external_id and control-api.md.
        favourite:
          type: boolean
          description: >-
            UI-P1: whether THE CALLING USER has favourited this app. Always serialized. Resolved
            per request from the bearer identity - never a stored property of the app, never
            settable via AppWrite, never assertable by a client. Set/cleared via
            PUT/DELETE /v1/me/favourites/{app_id}.
        default_width: { type: integer }
        default_height: { type: integer }
        default_fps: { type: integer }
        default_bitrate_kbps: { type: integer }
        default_profile_id:
          type: [string, "null"]
          description: "UI-P4: the LAUNCH PROFILE this app pins or prefers, per profile_policy."
        profile_policy: { $ref: "#/components/schemas/ProfilePolicy" }
        display_stream:
          allOf: [ { $ref: "#/components/schemas/Stream" } ]
          description: >-
            The stream advertised in the library. UI-P4: resolved through the launch profile's TOP
            rung (position 1), falling back to the app's default_* columns when no launch profile
            resolves. Advertised, not resolved - a launch may fall through to a lower rung and
            stream at a different resolution; the session's own `stream` block is the truth.
        enabled: { type: boolean }
    AppList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppListItem" }
        next_cursor: { type: [string, "null"] }
    App:
      allOf:
        - { $ref: "#/components/schemas/AppListItem" }
    RuntimeSpec:
      type: object
      description: "Agent-internal container spec (not exposed on public read shapes)."
      properties:
        image: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        mounts: { type: array, items: { type: string } }
        gpu: { type: boolean }
    AppWrite:
      type: object
      required: [name]
      description: "Admin create/edit shape. runtime_spec + resource defaults are admin/scheduler-internal."
      properties:
        name: { type: string }
        description: { type: string }
        cover_url:
          type: [string, "null"]
          description: >-
            UI-P7 amendment (2026-07-28, control-api.md §"The app write shape and cover_url"):
            enforced, not just documented. Once the app has an app_artwork record this write is
            REFUSED whole-request with 409 conflict, never silently dropped and never a partial
            update of the request's other fields. Only meaningful while the app has no artwork
            record (see AppListItem.cover_url), and even then a non-null/non-empty value must be
            http/https or a schemeless same-origin path — any other scheme is
            400 validation_failed.
        kind:
          allOf: [ { $ref: "#/components/schemas/AppKind" } ]
          description: >-
            UI-P1, OPTIONAL. Absent = the server default on create, unchanged on patch - absence
            is NEVER a zero value (the cb97bfb trap: an omitted field decoding to ""/0 and being
            written clobbers the schema default). kind: "" is NOT "use the default"; it is
            400 validation_failed, as is any value outside the enum. The DB CHECK is the
            backstop, not the primary gate. Note crud.decodeJSON sets DisallowUnknownFields(),
            so sending kind to a control plane without this amendment is a hard 400, not a
            silent ignore - deploy the control plane before the client.
        external_source:
          allOf: [ { $ref: "#/components/schemas/ExternalSource" } ]
          description: >-
            Steam library discovery Phase 1, OPTIONAL. Absent = the server default ("") on create,
            UNCHANGED on patch - absence is NEVER a zero value (the cb97bfb trap), and here an
            absent field silently overwriting the column would un-tag an app's appid on any
            unrelated PATCH and send its artwork back to the fuzzy matcher. UNLIKE kind, an
            explicit "" IS valid: "" is the real domain value for "not a provider title", so
            external_source: "" is a deliberate clear, not a malformed request. Any other value is
            400 validation_failed. The handler is the primary gate; the DB CHECK
            (apps_external_source_ck) is the backstop. Validated INDEPENDENTLY of external_id -
            the contract states no pairing rule, and a half-set pair is inert (the artwork
            resolver requires both before it takes the by-id path). Note crud.decodeJSON sets
            DisallowUnknownFields(), so sending this to a control plane without this amendment is
            a hard 400, not a silent ignore - deploy the control plane before the client.
        external_id:
          type: string
          pattern: "^([1-9][0-9]{0,9})?$"
          description: >-
            Steam library discovery Phase 1, OPTIONAL, with the same presence semantics as
            external_source: absent = default ("") on create, unchanged on patch; explicit "" is a
            deliberate clear. A non-empty value must be a bare positive integer, no leading zero,
            no sign, no whitespace, no separators (400 validation_failed otherwise), so "0",
            "007", "1 2" and "-applaunch 480 -foo" are all rejected. THAT GRAMMAR IS
            ARGUMENT-INJECTION CONTAINMENT, NOT A FORMAT PREFERENCE: the value ends up in
            STEAM_STARTUP_FLAGS, which the quasar-steam entrypoint word-splits with `read -r -a`,
            so a stored "480 -foo" would reach the Steam client as two extra arguments. The
            handler is the primary gate; the DB CHECK (apps_external_id_ck) carries the same regex
            as the backstop and is the one that also covers an admin editing the value later.
        parent_app_id:
          type: [string, "null"]
          format: uuid
          description: >-
            Steam library discovery Phase 3, OPTIONAL. The app this tile is DERIVED from. On
            create, absent/null = a normal app (today's behaviour). On patch it is TRI-STATE,
            exactly like runtime_preset_id: absent = unchanged, explicit null = clear (the tile
            becomes a normal app), a uuid = set it. A uuid that does not resolve is
            400 validation_failed at write time, never an FK error surfacing at launch.
            SETTING IT PUTS THE ROW UNDER THE DERIVED-TILE SHAPE RULE, which is a database CHECK
            (apps_derived_shape_ck) and not a convention: the tile must carry
            runtime_spec = '{}', managed_home = false, runtime_preset_id = null,
            library_provider = "", and a non-empty external_source + external_id. A write that
            violates any of those is 400 validation_failed at the handler, with the CHECK as the
            backstop that also survives a later direct edit.
            THE TILE STORES NO RUNTIME OF ITS OWN ON PURPOSE. Merging at launch rather than
            flattening at save is what makes an edit to the parent - an image bump, a new GPU
            flag, a new mount - reach every derived tile with no re-sync and no stale copies. It
            is the same decision as UI-P3's runtime presets, and it is the reason the validated
            Tower experiment (which hardcoded a host path into a tile's runtime_spec.mounts)
            cannot ship. A parent may not itself be derived: one level, never a chain.
            One tile per (parent_app_id, external_source, external_id) fleet-wide - a duplicate
            is 409 conflict, from the apps_parent_external_uk unique index.
            Note crud.decodeJSON sets DisallowUnknownFields(), so sending this to a control plane
            without this amendment is a hard 400 - deploy the control plane before the client.
            EVERY ONE OF THESE RULES ANSWERS 4xx, NEVER 500. apps_derived_shape_ck maps to
            400 validation_failed and apps_parent_external_uk to 409 conflict, both naming what
            the operator can fix: a CHECK violation reaching a client as 500 internal is a lie,
            because the request is malformed and the server is not. Two rules the database cannot
            express as a row CHECK are enforced at the handler and answer 400: parent_app_id must
            name an EXISTING app that is NOT ITSELF DERIVED (one level, never a chain - home
            resolution substitutes the parent exactly once, so a grandchild would resolve its home
            to a tile that owns none), and library_provider may not be set on a derived tile,
            evaluated against the EFFECTIVE patched-or-stored shape rather than the request alone,
            so a two-request path cannot assemble a state a single request would be refused for.
        library_provider:
          allOf: [ { $ref: "#/components/schemas/LibraryProvider" } ]
          description: >-
            Steam library discovery Phase 3, OPTIONAL, with the same presence semantics as
            external_source: absent = the server default ("") on create, UNCHANGED on patch -
            absence is NEVER a zero value (the cb97bfb trap) - and an explicit "" IS valid, as a
            deliberate un-marking. Any other value outside the enum is 400 validation_failed.
            MARKING AN APP HERE IS THE ENTIRE TRIGGER FOR DISCOVERY (Phase 4), so an absent field
            silently overwriting the column on an unrelated PATCH would turn scanning off for a
            whole instance without anyone touching the setting.
            It is refused on a derived tile (parent_app_id set) - a tile cannot be a provider -
            and it is INDEPENDENT of kind: an admin UI may suggest kind='launcher' alongside it,
            but nothing server-side reads kind, and gating discovery on kind would let a
            presentation dropdown silently stop a background job.
        enabled: { type: boolean }
        default_width: { type: integer }
        default_height: { type: integer }
        default_fps: { type: integer }
        default_bitrate_kbps: { type: integer }
        default_profile_id:
          type: [string, "null"]
          description: "UI-P4: a LAUNCH PROFILE id. An id that does not resolve is 400 validation_failed."
        profile_policy:
          allOf: [ { $ref: "#/components/schemas/ProfilePolicy" } ]
          description: >-
            DRIFT FIX (UI-P4), not a new field - the Go handler has validated this on create and
            patch since migration 0015 (crud/handler.go validProfilePolicy) while this schema
            omitted the property entirely. OPTIONAL, with the same presence semantics as `kind`:
            absent = the server default on create, unchanged on patch, and absence is NEVER a zero
            value. UI-P4 removed 'custom' from the enum, so profile_policy:"custom" is now
            400 validation_failed on a control plane carrying this amendment.
        runtime_spec: { $ref: "#/components/schemas/RuntimeSpec" }
        runtime_preset_id:
          type: [string, "null"]
          format: uuid
          description: >-
            UI-P3, OPTIONAL. The shared runtime preset this app inherits its container
            configuration from. On create, absent/null = no preset = the app carries everything
            itself (today's behaviour). On patch it is TRI-STATE: absent = unchanged, explicit
            null = clear the reference, a uuid = set it. A uuid that does not resolve is
            400 validation_failed at write time, never an FK error surfacing at launch. NOT a
            launch profile - see RuntimePreset. Note crud.decodeJSON sets DisallowUnknownFields(),
            so sending this to a control plane without the UI-P3 amendment is a hard 400 - deploy
            the control plane before the client.
        launchable_profile_ids:
          type: array
          items: { type: string }
          description: >-
            UI-P5, OPTIONAL. The LAUNCH PROFILE ids a user may pick for this app. On create,
            absent or [] = unrestricted = today's behaviour. On patch: absent = UNCHANGED,
            [] = clear the allow-list (back to unrestricted), a non-empty array = replace it
            wholesale (it is a set, not an ordered list).
            EXPLICIT null IS 400 validation_failed. The contract gives null no meaning for this
            field - unlike default_profile_id and runtime_preset_id, where null explicitly means
            "clear" - and [] already says clear. Reinterpreting null would silently act on a
            value the caller clearly meant something by, which is exactly the defect fixed for
            the runtime-preset list fields.
            Every id must name a USER-VISIBLE launch profile (400 otherwise). A RUNG id (a stream
            profile) is not a launch profile and is rejected - the two id spaces look alike and
            differ only in table. Duplicates are deduped rather than rejected.
            SETTING IT WHILE profile_policy IS 'force' IS 400: that policy pins the app's launch
            profile, so no allow-list can ever apply. Switching an app TO 'force' CLEARS any
            stored list, even when the patch says nothing about it, so nothing can silently
            reactivate on a later switch back to 'prefer'.
            Note crud.decodeJSON sets DisallowUnknownFields(), so sending this to a control plane
            without the UI-P5 amendment is a hard 400 - deploy the control plane before the
            client.
        entitle:
          type: string
          enum: [all, none]
          default: all
          description: >-
            Steam library discovery Phase 2, OPTIONAL and CREATE-ONLY. "all" (the default, and
            what an absent field means) creates the app with an ('all', granted_by='admin')
            entitlement, so it is immediately visible to everyone - i.e. EXACTLY the
            pre-entitlements behaviour of creating an app. "none" creates it entitled to nobody,
            for an admin who wants to configure access before anyone sees it. THE DEFAULT IS THE
            WHOLE POINT: once GET /v1/apps is entitlement-filtered a new app is invisible until
            something entitles it, so without a default grant "I made an app and nobody can see
            it" becomes the default experience - the same failure as an un-backfilled migration,
            one app at a time. Any other value is 400 validation_failed, REJECTED rather than
            treated as "none", because a typo ("nome", "None") that quietly created an invisible
            app would be diagnosed as "the catalogue is broken". CREATE-ONLY: this property is
            declared on the shared AppWrite shape, but PATCH /v1/apps/{id} does NOT accept it -
            sending it there is 400 validation_failed (crud.decodeJSON sets
            DisallowUnknownFields()). It describes how an app is BORN, not a property it
            carries; after creation, access is edited through /v1/admin/apps/{id}/entitlements,
            which is the surface that produces an audit row and can express a per-user grant.
            NOT a stored column and never returned on any read shape - the resulting entitlement
            row is what persists.

    SubjectType:
      type: string
      description: >-
        Steam library discovery Phase 2: who an entitlement is granted to. 'all' = everyone
        (subject_id is null); 'user' = one account. Widening to 'group' is additive - a new value
        and a third partial unique index, no shape change - which is why an entitlement carries a
        subject TYPE plus id rather than a bare user_id.
      enum: [user, all]
    EntitlementGrantedBy:
      type: string
      description: >-
        Steam library discovery Phase 2: PROVENANCE, NOT AUTHORITY - all three grant identical
        access. 'admin' = an operator granted it (audited). 'provider' = a library-discovery sync
        wrote it and a sync may revoke it - WRITTEN SINCE PHASE 4 (migration 0045) by the scan
        reconciler, carrying source_ref 'library:steam:<appid>'. It was in the contract from Phase 2
        precisely so Phase 4 needed no migration and so revoking one was already a working path the
        day the first appeared. THE SYNC OWNS ONLY WHAT THE SYNC WROTE: it never touches an 'admin'
        row in either direction, so an operator's grant survives an uninstall. 'migration' = the 0043 backfill and only ever that, so "who
        made this app public" answers "it was public before entitlements existed" rather than
        falsely attributing it to whichever admin happened to act first.
      enum: [admin, provider, migration]
    Entitlement:
      type: object
      description: >-
        Steam library discovery Phase 2. One fact: "this subject may see and launch this app".
        PRESENCE OF THE ROW IS THE FACT - there is no revoked boolean and no soft delete. An app
        may carry BOTH an 'all' row and a personal row for the same user: they are independent
        facts and revoking one must not revoke the other, which is why readers match on EXISTENCE
        and never by joining entitlements into the app query (a join would emit such an app twice
        and, because GET /v1/apps pages by offset with a limit+1 overfetch, shift the page
        boundary and silently drop an app off the far end).
      required: [id, subject_type, subject_id, subject_username, app_id, app_name, granted_by, granted_by_user, source_ref, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id:
          type: [string, "null"]
          format: uuid
          description: "The subject account; null when subject_type is 'all'."
        subject_username:
          type: [string, "null"]
          description: "Joined for display; null when subject_type is 'all'. Never accepted on the write shape."
        app_id: { type: string, format: uuid }
        app_name: { type: string, description: "Joined for display; never accepted on the write shape." }
        granted_by: { $ref: "#/components/schemas/EntitlementGrantedBy" }
        granted_by_user:
          type: [string, "null"]
          format: uuid
          description: >-
            The acting admin for a granted_by='admin' row, null otherwise. Recorded server-side
            from the bearer identity and never assertable by a client. Deleting that operator
            NULLs this rather than revoking the entitlement.
        source_ref:
          type: string
          description: >-
            Free-form provenance for a 'provider' grant. '' for everything Phase 2 writes; Phase 4's
            reconciler writes 'library:<external_source>:<external_id>' (e.g. 'library:steam:620').
            It is provenance for a human reading a row, NOT a key anything joins on.
        created_at: { type: string, format: date-time }
    EntitlementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Entitlement" }
    EntitlementEnvelope:
      type: object
      required: [entitlement]
      properties:
        entitlement: { $ref: "#/components/schemas/Entitlement" }
    EntitlementGrant:
      type: object
      description: >-
        Steam library discovery Phase 2. granted_by / granted_by_user / source_ref are NOT
        accepted here: a grant made through this route is always recorded as granted_by='admin'
        with the acting admin resolved server-side from the bearer identity.
      required: [subject_type]
      properties:
        subject_type: { $ref: "#/components/schemas/SubjectType" }
        subject_id:
          type: [string, "null"]
          format: uuid
          description: >-
            REQUIRED (a user uuid) when subject_type is 'user'; must be OMITTED, null or "" when
            subject_type is 'all'. Any other combination is 400 validation_failed.

    ProviderEntitlementMode:
      type: string
      description: >-
        #465. Who a provider app is for, as one exclusive state rather than an incremental
        grant/revoke pair. Mirrors the server-side images.EntitlementMode vocabulary
        (control-plane internal/images).
      enum: [all, user, none]
    ProviderEntitlementModeSet:
      type: object
      description: "#465. The request body for POST .../library-providers/{provider}/entitlement-mode."
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/ProviderEntitlementMode" }
    ProviderEntitlementModeEnvelope:
      type: object
      description: >-
        #465. app_id is surfaced READ-ONLY so a caller that wants to keep using the generic
        entitlements routes afterward (e.g. to add one more specific user) has it without a
        second lookup; items is the full post-write entitlement list, same shape and ordering
        as GET /v1/admin/apps/{id}/entitlements.
      required: [entitlement_mode]
      properties:
        entitlement_mode:
          type: object
          required: [provider, app_id, mode, items]
          properties:
            provider: { type: string, description: "Echoes the path parameter, normalized." }
            app_id: { type: string, format: uuid }
            mode: { $ref: "#/components/schemas/ProviderEntitlementMode" }
            items:
              type: array
              items: { $ref: "#/components/schemas/Entitlement" }

    Session:
      type: object
      # health_state/health_reason are additive (present only when running/unsustainable);
      # app_launch_state is additive (present only when the app image reports one);
      # every other key is always serialized (nullable ones present-but-null).
      required: [id, user_id, app_id, host_id, state, state_detail, error_message, failure_code, app_log_tail, profile_id, stream_profile_id, stream, codec_decision, negotiated_codec, created_at, started_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        host_id: { type: [string, "null"], format: uuid }
        state: { $ref: "#/components/schemas/SessionState" }
        state_detail: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        failure_code:
          type: [string, "null"]
          description: >-
            First-run-experience §S5. Machine-readable classification of a terminal failure -
            "app_exited_early" today. Sits beside error_message (free-text prose that may be
            rewritten freely); the UI branches on THIS. Always serialized; null unless a failure
            warranted it.
        app_log_tail:
          type: [string, "null"]
          description: >-
            First-run-experience §S5. The app container's own captured log tail (newline-joined,
            oldest first, ~100 lines bound) - the only surviving copy, since app containers run
            --rm. Always serialized; null unless a failure warranted capturing it. Rendered
            preformatted, distinct from error_message's prose rendering.
        profile_id:
          type: [string, "null"]
          description: >-
            The profile the session was launched from; null for a legacy/tier/override launch.
            UI-P4: this is now a LAUNCH PROFILE id, i.e. the USER'S PICK. The rung it resolved to
            is stream_profile_id.
        stream_profile_id:
          type: [string, "null"]
          description: >-
            UI-P4: the RUNG this launch resolved to (e.g. "1080p60-h264"). Always serialized; null
            for every pre-UI-P4 session and for any legacy/tier/override/console launch. profile_id
            answers "what did the user pick", this answers "what did they get" - and because a rung
            carries its own resolution, the two can legitimately disagree about width/height/fps/
            bitrate. The `stream` block below is always the truth for the running session.
        stream: { $ref: "#/components/schemas/Stream" }
        codec_decision:
          oneOf:
            - { $ref: "#/components/schemas/CodecDecision" }
            - { type: "null" }
          description: >-
            UI-P6: WHY this session got the codec it got - every rung walked and the clamp that
            rejected each. Always serialized; null when no rung chain was walked.
        negotiated_codec:
          type: [string, "null"]
          description: >-
            UI-P6: the wire codec the CLIENT reports it is actually decoding (normalised getStats
            mimeType), beside stream.codec, which is what the SERVER resolved. They should agree;
            when they do not, that is how a silent fallback or a mis-negotiated m-line presents, so
            both are kept and neither is reconciled away. NOT constrained to the Codec enum - a
            value the server never resolves (vp9) is preserved rather than dropped, because it is
            the loudest disagreement there is. Always serialized; null until the client reports one.
        health_state:
          type: string
          description: "AS10-06: computed stream-health classification; present only when the session is running/unsustainable."
          enum: [healthy, network_degrading, abr_at_floor, client_decode_degrading, client_presentation_degrading, unsustainable, failed]
        health_reason: { type: string, description: "AS10-06: optional human explanation accompanying a degraded health state." }
        app_launch_state:
          type: string
          description: >-
            Steam game-exit lifecycle amendment (2026-08-02): coarse in-container application
            launch state last reported by the agent (agent-api.md session_metrics.
            app_launch_state, the normative definition). Read-only; there is no request field.
            OMITTED when the app image does not report launch state - absence means UNKNOWN,
            and a client must treat an absent field and an unrecognised value identically and
            fall back to transport-level readiness. A hint and a metric, never a session-state
            authority and never access control: `state` remains the only progress signal.
          enum: [starting, client_only, game_running, game_exited]
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    SessionEnvelope:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/Session" }
    SessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        next_cursor: { type: [string, "null"] }
    SessionDisplayUpdate:
      type: object
      additionalProperties: false
      description: >-
        PATCH /v1/sessions/{id}/display body (session-display-update, additive, pre-approved
        2026-08-15; stream_width/stream_height added by session-display-stream (approved 2026-08-16), 2026-08-16,
        approved 2026-08-16 (PR #15)). At least one property (or both-or-neither pair) must be present.
        render_width/render_height are BOTH-OR-NEITHER, and independently so are
        stream_width/stream_height (the server rejects either pair supplied alone with 400
        validation_failed). Omitted properties are left unchanged - this is a partial update, not
        a snapshot. render_width/render_height must be even and within [16, the session's pinned
        LAUNCH width/height]; ui_scale must be within [1.0, 3.0]; stream_width/stream_height
        must be even and must resolve to one of the session's stream.rungs pairs (always
        <= the launch size). (2026-08-16 amendment: render and external/stream size are
        INDEPENDENT axes - render is bounded only by the pinned launch size, never by the
        current or any past external size; a stream size below the current render size is
        downsampled by the encoder from the unchanged render framebuffer, and render is never
        forced down to match.) Ephemeral - not persisted to the sessions table; stream_width/
        stream_height is mirrored into an in-memory cache surfaced as
        Session.stream.external_width/external_height for GET convenience only.
      properties:
        render_width:
          type: integer
          format: int32
          minimum: 16
          description: New app-facing wl_output logical width, in pixels. Must be even and ≤ the session's pinned LAUNCH width, independent of the current external/stream size. Requires render_height.
        render_height:
          type: integer
          format: int32
          minimum: 16
          description: New app-facing wl_output logical height, in pixels. Must be even and ≤ the session's pinned LAUNCH height, independent of the current external/stream size. Requires render_width.
        ui_scale:
          type: number
          format: double
          minimum: 1.0
          maximum: 3.0
          description: New wp_fractional_scale_v1 preferred_scale hint pushed to session toplevels.
        stream_width:
          type: integer
          format: int32
          minimum: 16
          description: >-
            session-display-stream (approved 2026-08-16) (approved 2026-08-16 (PR #15)). New EXTERNAL (encoded/streamed)
            width, in pixels. Must be even and must, together with stream_height, match one of
            the session's stream.rungs pairs. Requires stream_height. Rejected with
            409 external_resize_unsupported if the assigned host's encoder cannot live-resize.
        stream_height:
          type: integer
          format: int32
          minimum: 16
          description: >-
            session-display-stream (approved 2026-08-16) (approved 2026-08-16 (PR #15)). Pairs with stream_width; see its
            description. Requires stream_width.
    LaunchRequest:
      type: object
      required: [app_id]
      properties:
        app_id: { type: string, format: uuid }
        profile_id: { type: string, description: "User-facing selector (AS10-03)." }
        client_type: { type: string, enum: [browser, native], description: "Absent ⇒ browser." }
        mic: { type: boolean, description: "Microphone capture request (2026-08-02). Absent ⇒ false. Granted only when instance setting mic_capture_enabled is on; an ungranted request is not an error — the session stream body reports the granted state." }
        stream:
          type: object
          description: "Admin/debug/back-compat override; beats profile_id field-by-field."
          properties:
            width: { type: integer }
            height: { type: integer }
            fps: { type: integer }
            bitrate_kbps: { type: integer }
            h264_profile: { $ref: "#/components/schemas/H264Profile" }
            codec: { allOf: [ { $ref: "#/components/schemas/Codec" } ], description: "Multi-codec: optional admin/diagnostic codec override. Orthogonal to the resolution envelope (a codec-only override does not bypass the eligibility gate). Bypasses the device-decode and failure-history clamps (forced re-test path) but not the host-encoder clamp (409 conflict if the placed host cannot encode it)." }
    LaunchResponse:
      type: object
      required: [session, signaling]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        signaling: { $ref: "#/components/schemas/SignalingCoords" }
    SignalingCoords:
      type: object
      required: [url, token, expires_at]
      properties:
        url: { type: string, description: "wss://<host>/v1/signal" }
        token: { type: string, description: "Single-use, short-TTL, plaintext this response only." }
        expires_at: { type: string, format: date-time }
        ice_servers:
          type: array
          description: "#509. STUN/TURN servers the client configures its RTCPeerConnection with, sourced from control-plane configuration. Always serialized by the control plane (empty array when nothing is configured, which is the default and reproduces the pre-#509 hardcoded empty list). Declared optional rather than required so a client generated at this pin still parses a response from an older control plane; treat a missing key as an empty list."
          items: { $ref: "#/components/schemas/ICEServer" }
    ICEServer:
      type: object
      description: "#509. One ICE server, shaped as the W3C RTCIceServer dictionary so a browser client passes it through untranslated."
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          description: "One or more ICE URLs. Every entry carries a stun:, stuns:, turn:, or turns: scheme."
          items: { type: string }
        username: { type: string, description: "TURN username. Present for turn:/turns: entries, absent for stun:/stuns: (STUN has no authentication)." }
        credential: { type: string, description: "TURN credential. Present for turn:/turns: entries. Readable by every authenticated user who launches a session, which is inherent to browser TURN — deployments should issue ephemeral, time-limited credentials rather than a shared static password." }
    SignalingEnvelope:
      type: object
      required: [signaling]
      properties:
        signaling: { $ref: "#/components/schemas/SignalingCoords" }
    AdminActivity:
      type: object
      required: [id, actor_user_id, action, target_type, target_id, details, created_at, actor_username, severity]
      properties:
        id: { type: integer, format: int64 }
        actor_user_id: { type: [string, "null"], format: uuid }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        # UI v3 amendment (2026-08-28, additive): two derived read-only fields.
        actor_username:
          type: [string, "null"]
          description: >-
            `users.username` for `actor_user_id`, resolved by a LEFT JOIN at read time and
            never stored - the log is append-only, so a later rename must show the current
            name, not the one at the time. Null when the actor row is gone (the audit table
            keeps no FK on purpose: a deleted admin must not take their history with them)
            and null when the event had no actor at all.
        severity:
          type: string
          enum: [info, warn, err]
          description: >-
            DERIVED SERVER-SIDE from `action`, never stored and never client-supplied, so
            one rule governs every consumer: `*.failed` and any action containing `error`
            are `err`; `*.deleted`, `*.delete`, `*.revoked`, `*.disabled`, plus
            `host.drain`, `session.stop` and `storage.home.tombstone`, are `warn`;
            everything else is `info`. A new action needs no schema change - it lands as
            `info` unless it matches a rule.
    AdminActivityList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminActivity" } }
        next_cursor: { type: [integer, "null"], format: int64 }

    Host:
      type: object
      # crud/handler.go hostResp — every key is always serialized (nullable ones present-but-null).
      required: [id, node_name, status, agent_version, cpu_cores, mem_mb, cpu_model, last_registered_at, last_heartbeat_at, storage, capacity_detection, capacity_reason, readiness, readiness_reported_at, capacity]
      properties:
        id: { type: string, format: uuid }
        node_name: { type: string }
        status: { type: string, enum: [online, offline, draining] }
        agent_version: { type: [string, "null"] }
        cpu_cores: { type: [integer, "null"] }
        mem_mb: { type: [integer, "null"] }
        # host-observability-2: agent-reported CPU marketing name; null until reported.
        cpu_model: { type: [string, "null"] }
        last_registered_at: { type: [string, "null"], format: date-time }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        storage:
          # host-observability amendment: agent-reported storage volumes (capacity report);
          # null until an amendment-aware agent reports.
          type: [array, "null"]
          items: { $ref: "#/components/schemas/StorageVolume" }
        capacity_detection:
          type: string
          enum: [ok, unavailable, failed]
          description: "Whether the latest hardware capacity report is authoritative and schedulable."
        capacity_reason:
          type: [string, "null"]
          description: "Operator-facing reason when capacity detection is unavailable or failed."
        readiness:
          # first-run-experience §S1, additive: agent-reported advisory readiness checks
          # (capacity.readiness). null = no amendment-aware agent has reported yet, distinct from
          # [] = reported, nothing to say. ADVISORY ONLY - never gates registration, admission or
          # scheduling.
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ReadinessCheck" }
        readiness_reported_at:
          type: [string, "null"]
          format: date-time
          description: "When the stored readiness value last changed; null until reported."
        capacity:
          # UI v3 amendment (2026-08-28, additive): the per-host roll-up of what
          # GET /v1/hosts/{id}/gpus already serves per GPU. Exists to remove the 1+N
          # fan-out a fleet KPI otherwise needs; the per-GPU route stays the detail view.
          allOf: [ { $ref: "#/components/schemas/HostCapacity" } ]
          description: >-
            Summed over this host's REPORTED GPUs. Null - not a zeroed object - when the
            host has no schedulable GPUs to sum: none reported yet, or `capacity_detection`
            is not `ok`, which is the same condition under which `GET /v1/hosts/{id}/gpus`
            returns an empty list. "Nothing to say" and "zero capacity" are different facts
            and a fleet gauge must not draw the first as the second.
    HostCapacity:
      type: [object, "null"]
      description: >-
        A host's capacity roll-up (UI v3 amendment). Every figure is derived at read time
        from `gpus` and live session reservations - nothing here is stored, so it cannot
        drift from the per-GPU view.
      required: [slots_total, slots_used, vram_mb_total, vram_mb_used, active_sessions, gpu_count]
      properties:
        slots_total: { type: integer, description: "Sum of `slots_total` over the host's reported GPUs." }
        slots_used:
          type: integer
          description: "Sum of `slots_reserved`: encode slots held by sessions in a reservation-holding state (assigned, starting, running, stopping)."
        vram_mb_total: { type: integer, description: "Sum of `vram_mb_total`." }
        vram_mb_used:
          type: integer
          description: >-
            Sum of the LIVE-SAMPLED per-GPU `vram_mb_used` (the same figure the per-GPU
            route serves), counting only GPUs that have a sample; 0 when none has. It is
            deliberately NOT the declared `vram_mb_reserved` accounting, which #383 removed
            from admission and which is permanently 0 for every session created since.
        active_sessions: { type: integer, description: "Sessions in a reservation-holding state on this host's GPUs." }
        gpu_count: { type: integer, description: "How many reported GPUs the figures above are summed over. Never 0 (the object is null instead)." }
    ReadinessCheck:
      type: object
      description: >-
        One host-readiness check (first-run-experience §S1). The check set is agent-owned - a
        consumer must pass an unrecognized status through rather than reject it.
      required: [id, status, summary, remediation]
      properties:
        id: { type: string, description: "Stable machine key, e.g. \"nvidia_egl_vendor_json\"." }
        status:
          type: string
          description: >-
            Known values: "pass", "fail", "skip" — "skip" means "not applicable to this host" (an
            NVIDIA check on an AMD box), never "we could not tell". DELIBERATELY NOT AN ENUM: the
            check set (and its status vocabulary) is agent-owned and forward-compatible, so a closed
            schema type would force every generated client to reject a value the contract requires
            it to pass through. Consumers MUST render/store an unrecognized value rather than
            reject it.
        summary: { type: string, description: "One sentence an operator can act on, in plain language." }
        remediation: { type: string, description: "Exact commands to fix it, distro-aware where cheaply knowable. Empty for pass/skip." }
    StorageVolume:
      type: object
      required: [label, path, total_mb, available_mb]
      properties:
        label: { type: string }
        path: { type: string }
        total_mb: { type: integer }
        available_mb: { type: integer }
    HostList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        next_cursor: { type: [string, "null"] }
    HostSettings:
      type: object
      description: "GET returns pending_restart; PATCH returns restart_triggered — otherwise same shape."
      properties:
        resolved: { type: object, additionalProperties: true }
        overrides: { type: object, additionalProperties: true }
        # host-observability amendment: agent-reported env←overrides overlay from its latest
        # capacity report (agent-api.md effective_settings); null when never reported.
        effective:
          type: [object, "null"]
          additionalProperties: { type: string }
        # wizard-v2 S5 amendment (additive, admin-gated): the host's LAST-REPORTED wire
        # codec set (schema.md hosts.codecs, written from agent-api.md capacity.codecs).
        # Read-only, GET only - PATCH never returns or accepts it. null when the host has
        # never reported the field (a pre-multi-codec agent), which the launch resolver
        # treats as h264-only; it is deliberately NOT normalised to ["h264"] here, because
        # "never reported" and "reported h264 only" need different operator advice.
        codecs:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Codec" }
        pending_restart: { type: boolean }
        restart_triggered: { type: boolean }
    HostRestartRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: "Required true to restart while the host has live sessions (mirrors HostSettingsPatch.restart_confirm)."
    HostRestartResponse:
      type: object
      required: [restart_triggered]
      properties:
        restart_triggered: { type: boolean }
    HostSettingsPatch:
      type: object
      required: [overrides]
      description: "The field is 'overrides' — a top-level 'settings' key is silently ignored. A null value clears an override."
      properties:
        overrides:
          type: object
          additionalProperties: true
        restart_confirm:
          type: boolean
          description: "Required true to apply a restart-class knob while the host has live sessions."

    StorageProvider:
      type: string
      enum: [auto, local, volume]
      description: "Managed-home backing store: auto = local when the session host has an effective home root, volume otherwise. Affects new homes only."

    SettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          required: [registration_mode, storage_provider, library_discovery_enabled, library_discovery_interval_minutes, library_discovery_appdetails_enabled, mic_capture_enabled, updated_by, updated_at]
          properties:
            registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
            storage_provider: { $ref: "#/components/schemas/StorageProvider" }
            image_update_policy:
              type: string
              enum: [manual, notify, auto]
              description: >-
                P3 (image management). Instance-wide update policy applied by
                POST /v1/admin/images/sync. Column exists since migration 0054
                (DDL default notify) but only reaches the wire from P3. Optional
                in the envelope so pre-P3 servers stay conformant.
            mic_capture_enabled:
              type: boolean
              description: >-
                Microphone capture amendment (2026-08-02). Instance-wide gate for the
                POST /v1/sessions mic request. Default false (ship-dark). Server-enforced at
                launch; flipping it affects subsequent launches only.
            library_discovery_interval_minutes:
              type: integer
              minimum: 15
              maximum: 10080
              description: >-
                Admin-libraries amendment (2026-08-01). The operator-set scan interval, minutes,
                default 360. THE DATABASE COLUMN IS THE OPERATOR PATH AND THE ENV VAR IS AN
                OVERRIDE, NOT A DEFAULT: when QUASAR_LIBRARY_SCAN_INTERVAL is set it wins - and
                its documented 0 = hard-kill-regardless-of-the-database-flag semantics are
                unchanged. LibraryStatus.scan_interval_secs remains the RESOLVED value
                (database-then-env-override), and LibraryStatus.interval_overridden_by_env says
                which source won so a UI can grey a control the environment has pinned.
            library_discovery_appdetails_enabled:
              type: boolean
              description: >-
                Admin-libraries amendment (2026-08-01). The operator-set third-party appdetails
                lookup switch, default false - the same privacy decision
                QUASAR_STEAM_APPDETAILS_LOOKUP carried, now settable from the admin UI. Same
                override rule as the interval: a SET env var wins (a privacy-hardened deployment
                can pin it off in the environment), and
                LibraryStatus.appdetails_overridden_by_env reports when that happened.
            library_discovery_enabled:
              type: boolean
              description: >-
                Steam library discovery Phase 4 (migration 0045). THE MASTER SWITCH, AND THE ONLY
                SWITCH. Default false - ship-dark, the posture artwork already holds - and with it
                false the scheduler returns before its first query and the agent pull answers an
                empty list: no scan rows, no agent work, no third-party calls. Under operator
                decision 1 AUTO-PUBLISH IS THE BEHAVIOUR, NOT A MODE (there is no review queue), so
                there is deliberately no second "publish" toggle: its false branch would select a
                path that was never built. Read PER PASS and per request rather than cached at boot,
                so flipping it in the admin UI takes effect without a restart.
            allowed_origins:
              type: array
              items: { type: string }
              description: >-
                First-run wizard v2 §S6e (migration 0064). The admin-editable signaling origin
                allow-list, normalized (scheme + lowercased host). THIS IS THE DATABASE COLUMN,
                NOT NECESSARILY WHAT /v1/signal ENFORCES: QUASAR_ALLOWED_ORIGINS, when SET,
                overrides it outright - including when set to the empty string, which is how a
                hardened deployment pins the list off. That override rule is what makes the
                migration a behavioural no-op on upgrade for every existing deployment.
                GET /v1/admin/access-check reports the RESOLVED list plus which source won, so a
                UI can grey out a control the environment has pinned - the same shape
                library_discovery_interval_minutes uses. AN EMPTY LIST IS NOT "DENY ALL":
                /v1/signal still admits a same-origin request and a request with no Origin
                header at all, so a fresh instance with nothing configured works. Optional in
                the envelope so pre-amendment servers stay conformant.
            updated_by: { type: [string, "null"], format: uuid }
            updated_at: { type: string, format: date-time }

    # ─── remote access (first-run wizard v2 §S6) ───────────────────────────
    TLSCertificateInfo:
      type: object
      description: >-
        The PUBLIC metadata of a certificate. Every field here is already disclosed by any TLS
        handshake with this listener. THERE IS DELIBERATELY NO FIELD THAT COULD HOLD KEY
        MATERIAL, and adding one would be the bug this shape exists to prevent.
      required: [source, fingerprint_sha256, not_before, not_after, days_until_expiry, dns_names, ip_addresses, chain_length, self_signed]
      properties:
        source:
          type: string
          enum: [self_signed, provided]
          description: >-
            self_signed = the batteries-included pair generated into QUASAR_TLS_DIR on first
            boot; provided = files mounted at QUASAR_TLS_CERT/QUASAR_TLS_KEY. (A third value,
            `uploaded`, is reserved for the §S6d upload route and is not emitted by any server
            that does not serve it.)
        fingerprint_sha256:
          type: string
          description: "SHA-256 over the DER, uppercase colon-separated hex. The value to compare OUT OF BAND against the control-plane startup log before trusting a self-signed certificate."
        subject: { type: string }
        issuer: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        days_until_expiry:
          type: integer
          description: >-
            Recomputed on every read, never served frozen at install time. This is the number
            that catches the 90-day Let's Encrypt trap, and a stale one would be worse than none.
            Can be negative for an already-expired certificate loaded from disk (upload refuses one).
        dns_names: { type: array, items: { type: string } }
        ip_addresses: { type: array, items: { type: string } }
        chain_length: { type: integer, description: "Leaf plus any intermediates supplied with it." }
        self_signed: { type: boolean, description: "The leaf issued itself - true for the batteries-included pair, and the reason a browser warns." }
    AccessCheck:
      type: object
      required: [request, certificate, origins]
      properties:
        request:
          type: object
          required: [host, origin, scheme, tls_terminated_upstream, secure_context]
          properties:
            host: { type: string, description: "The Host header seen, LENGTH-CAPPED at 256 characters (a truncated value is suffixed). Reflected input - render as text, never as HTML." }
            origin: { type: string, description: "The Origin header seen, or \"\" when the client sent none. Same cap and same rule as host." }
            scheme:
              type: string
              enum: [http, https]
              description: "What THIS control plane observed on the wire - https when the request arrived on the TLS listener. Observed, never taken from a header."
            forwarded_proto:
              type: string
              description: "The protocol an upstream proxy CLAIMS the browser used (X-Forwarded-Proto, or the proto parameter of RFC 7239 Forwarded). A CLAIM, not a fact - it may soften advice and authorises nothing. Absent when no proxy header was present."
            tls_terminated_upstream:
              type: boolean
              description: "§S6-0 topology C: a proxy is in front of this control plane. When true the certificate section reports in_use=false and a client MUST NOT present the internal certificate as a problem."
            secure_context:
              type: boolean
              description: >-
                Whether the browser will treat the page as a secure context - the precondition
                for getUserMedia (the microphone, §S7) and Keyboard Lock. True for https to this
                listener or https to an upstream proxy. THE LOOPBACK EXCEPTION IS TAKEN FROM THE
                BROWSER'S ORIGIN, NEVER FROM THE HOST HEADER once a forwarded protocol shows a
                proxy is in play: a proxy passing to 127.0.0.1 rewrites Host to a loopback
                authority, which would otherwise report an insecure public page as secure. That
                false positive is expensive out of proportion - it tells the operator the
                microphone should work and sends them hunting a bug that is not there. This is the
                link between the certificate story and the microphone story, and why they belong
                on one panel.
        certificate:
          type: object
          required: [in_use]
          properties:
            in_use:
              type: boolean
              description: "False under topology C, and false when QUASAR_TLS=off. Both are supported, complete configurations."
            not_in_use_reason: { type: string, description: "Operator-facing prose stating that the setup is supported and what to look at instead. Present only when in_use is false." }
            info: { $ref: "#/components/schemas/TLSCertificateInfo" }
            host_covered:
              type: [boolean, "null"]
              description: >-
                Whether the request's Host is covered by the leaf's SANs. Present only when
                in_use is true. A leaf with no SANs covers NOTHING - the legacy Common Name
                fallback is dead in every current browser, so reporting CN coverage would tell
                an operator their setup is fine while their browser refuses it.
            advice:
              type: string
              description: >-
                The remedy, when there is one, in operator language. ORDERED BY WHAT BLOCKS THE
                OPERATOR, VALIDITY FIRST: already-expired, then near-expiry, then SAN mismatch,
                then self-signed, with NOT-YET-VALID ahead of all of them - a post-dated or
                expired certificate cannot be rescued by trusting it or by correcting its names,
                and both are reachable because the on-disk compatibility path deliberately keeps
                serving such a pair rather than refusing to boot. Also SOURCE-SPECIFIC: the fix for
                a SAN mismatch depends entirely on where the certificate came from, so this
                branches on info.source. For self_signed it names the QUASAR_TLS_HOSTS value AND
                the fact that the certificate is NEVER regenerated when that variable changes
                (delete the pem files and recreate the container) - the single most expensive
                unstated fact in this area. For provided it says QUASAR_TLS_HOSTS does not apply
                and the mounted file must be re-issued. A single remedy would send operators of
                the other supported topologies down steps that cannot work.
        origins:
          type: object
          required: [configured, source, allowed, request_origin_allowed, same_origin_exemption]
          properties:
            configured: { type: boolean, description: "Whether any allow-list entry is in force. FALSE IS A NORMAL, WORKING STATE - see same_origin_exemption." }
            source:
              type: string
              enum: [environment, database]
              description: "Which source won. environment means QUASAR_ALLOWED_ORIGINS is SET and the admin-editable column is not consulted; a UI should grey out its editor and say so."
            allowed: { type: array, items: { type: string }, description: "The RESOLVED list /v1/signal actually enforces." }
            request_origin_allowed:
              type: [boolean, "null"]
              description: "Whether THIS request's Origin would pass. Null when the request carried no Origin header at all (a non-browser client, which /v1/signal admits)."
            same_origin_exemption:
              type: boolean
              description: >-
                True when the origin passes ONLY because it matches Host, not because it is
                listed. This is the case that silently breaks behind a Host-rewriting reverse
                proxy, and it is why "always seed the IP as an allowed origin" would be a no-op
                that looks load-bearing - a same-origin request already passes with NO
                configuration.
            advice: { type: string }
            suggested_entry:
              type: string
              description: >-
                The current origin, normalized and ready to add, when it would otherwise be
                refused - detection plus the fix, not detection alone. Empty when there is
                nothing to suggest, and deliberately empty when the list is pinned by the
                environment, because adding it in the UI would do nothing.

    Invite:
      type: object
      description: "List shape — never carries the plaintext code."
      required: [id, code_prefix, role, max_uses, used_count, expires_at, revoked_at, note, created_at, created_by_user_id, created_by_username]
      properties:
        id: { type: string, format: uuid }
        code_prefix: { type: string, description: "First 8 hex of code_hash — a stable non-secret handle." }
        role: { $ref: "#/components/schemas/Role" }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        # UI v3 amendment (2026-08-28, additive): provenance. The column
        # (`invites.created_by`, migration 0020) has always been written; it was
        # simply never served. No migration.
        created_by_user_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The admin who minted this invite. Nullable on the wire for the same reason
            `actor_username` is on AdminActivity - a restore or a repaired row may dangle -
            though under the current schema `invites.created_by` is NOT NULL and cascades,
            so an invite never outlives its minter.
        created_by_username:
          type: [string, "null"]
          description: "`users.username` for `created_by_user_id`, resolved by a LEFT JOIN at read time. Null when that row is gone."
    InviteMinted:
      type: object
      description: "POST /v1/admin/invites 201 body's `invite` — the plaintext code + magic link, ONCE. Distinct shape from the Invite list row (no code_prefix/revoked_at/note)."
      required: [id, code, role, max_uses, used_count, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Plaintext, returned once, never retrievable again." }
        invite_url: { type: string, description: "Present only when the server has a configured public base URL." }
        role: { $ref: "#/components/schemas/Role" }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ─── admin: encrypted secrets ─────────────────────────────────────────────
    SecretStatus:
      type: object
      description: >-
        One declared secret and its current state. This schema has NO field that can hold a
        value, by construction - adding one would be the bug it exists to prevent.
      required: [name, label, description, env_var, docs_url, configured, readable, hint, env_set, origin, key_version, updated_by, updated_at]
      properties:
        name: { type: string, description: "Stable identifier, dotted and namespaced by feature (artwork.steamgriddb.api_key)." }
        label: { type: string, description: "Operator-facing name." }
        description: { type: string, description: "What setting it enables." }
        env_var: { type: string, description: "The environment variable that supplies the same credential as a FALLBACK, or empty when there is none." }
        docs_url: { type: string, description: "Where to obtain the credential. May be empty." }
        configured:
          type: boolean
          description: "True when a value is stored in the database, whether or not this control plane can decrypt it."
        readable:
          type: boolean
          description: >-
            False when a value is stored but the master key is missing or wrong. Distinguishing
            this from 'not configured' is the point: the operator's fix is completely different.
        hint:
          type: string
          description: >-
            Masked tail of the STORED value - last 4 characters, and EMPTY for a value short
            enough that 4 characters would be a meaningful fraction of it. Never a full value.
        env_set:
          type: boolean
          description: "Whether the fallback environment variable is present on the server. PRESENCE only; the value is never reported."
        origin:
          type: string
          enum: [none, database, environment]
          description: >-
            Which source is actually IN EFFECT. 'database' wins over 'environment' when both
            are present, so an admin typing a key into the UI is never silently overridden by a
            stale env var. A stored-but-unreadable secret reports 'none' rather than falling
            through to the environment - silently using a different credential than the one an
            admin configured is the surprise this facility exists to prevent.
        key_version: { type: integer, description: "Master-key version the stored value was written under; 0 when nothing is stored." }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: [string, "null"], format: date-time }
        problem:
          type: string
          description: "Operator-facing explanation when readable is false. Never contains any part of a value."
    SecretsEnvelope:
      type: object
      required: [secrets, master_key_configured, key_versions]
      properties:
        secrets:
          type: array
          items: { $ref: "#/components/schemas/SecretStatus" }
        master_key_configured:
          type: boolean
          description: >-
            False when QUASAR_SECRET_KEY is unset. This is a SUPPORTED state, not a fault: the
            control plane boots normally and secret-backed features report themselves
            unavailable. The UI reads this to explain that storing secrets is unavailable
            rather than offering a field whose save always fails.
        key_versions:
          type: array
          items: { type: integer }
          description: "Master-key versions this control plane can decrypt with, so a version mismatch is diagnosable."
    SecretEnvelope:
      type: object
      required: [secret, master_key_configured]
      properties:
        secret: { $ref: "#/components/schemas/SecretStatus" }
        master_key_configured: { type: boolean }

    # ─── admin: apps ──────────────────────────────────────────────────────────
    AppArtwork:
      type: object
      description: "UI-P7: an app's artwork provenance and the two locally served crops."
      required: [app_id, source, provider, provider_ref, matched_name, tile_url, hero_url, attribution, locked, updated_at]
      properties:
        app_id: { type: string, format: uuid }
        source:
          type: string
          enum: [provider, manual, none]
          description: >-
            'provider' = matched and fetched automatically. 'manual' = an admin picked, supplied
            or uploaded it. 'none' = we looked and there is nothing - a NEGATIVE CACHE and a
            first-class outcome, not an error: a desktop app is not in a games database and never
            will be, so recording it stops every sweep re-querying a third party for a row that
            can never match. All three render correctly; 'none' is the gradient tile.
        provider: { type: string, description: "Which provider produced the match ('steamgriddb'); empty for a manual or unmatched app." }
        provider_ref: { type: string, description: "The provider's opaque id for the matched title." }
        matched_name:
          type: string
          description: >-
            The provider-side title that was matched. Surfaced so an operator can SEE that
            "Portal" matched "Portal Knights" before deciding to override it.
        tile_url: { type: [string, "null"], description: "Local /v1/artwork/... path for the 2:3 portrait tile crop, or null." }
        hero_url: { type: [string, "null"], description: "Local /v1/artwork/... path for the wide hero crop, or null." }
        attribution: { type: string, description: "Credit line to render beside the art, when the source asks for one." }
        locked:
          type: boolean
          description: >-
            True once an admin has overridden the match. The automatic sweep NEVER touches a
            locked record - fuzzy matching is wrong sometimes, and a correction must not be
            silently re-broken.
        updated_at: { type: string, format: date-time }
    AppArtworkEnvelope:
      type: object
      required: [artwork, provider_configured, provider_name, provider_origin]
      properties:
        artwork:
          oneOf: [ { $ref: "#/components/schemas/AppArtwork" }, { type: "null" } ]
          description: "Null when the app has no artwork record at all - the gradient-tile state."
        provider_configured:
          type: boolean
          description: >-
            Whether a third-party artwork provider is configured on this deployment. False is the
            SHIPPED DEFAULT. The admin UI reads this to explain why the provider-backed controls
            are unavailable, rather than offering a button that silently does nothing.
            Resolved PER REQUEST from the encrypted secrets store, so a key set from the admin UI
            flips this without a control-plane restart.
        provider_name: { type: string, description: "Empty when no provider is configured." }
        provider_origin:
          type: string
          enum: [none, database, environment, static]
          description: >-
            Where the credential in effect came from: 'database' (an admin set it through
            /v1/admin/secrets), 'environment' (the legacy QUASAR_STEAMGRIDDB_API_KEY), 'static'
            (a provider supplied directly at construction - embedded/test wiring only, never the
            shipped server) or 'none'. An operator upgrading a deployment that already had the
            env var must be able to SEE that it is still what is being used.
        provider_problem:
          type: string
          description: >-
            Why the provider is unavailable despite something being configured - e.g. a stored
            API key the master key cannot decrypt. Empty when there is nothing to explain. Never
            contains any part of a credential.
    AppArtworkWrite:
      type: object
      description: "Exactly one intent per request; an empty body is 400 validation_failed."
      properties:
        provider_ref: { type: string, description: "Accept this candidate from a prior .../artwork/search." }
        tile_url: { type: string, description: "Fetch operator-supplied art for the tile crop. Absent leaves the existing tile untouched." }
        hero_url: { type: string, description: "Fetch operator-supplied art for the hero crop. Absent leaves the existing hero untouched." }
        rematch: { type: boolean, description: "Re-run automatic matching now instead of waiting for the background sweep. 409 conflict when the record is locked, unless force is also sent." }
        force: { type: boolean, description: "Qualifies `rematch` ONLY: replace a locked record. The other intents set locked themselves and were never blocked by it." }
    AppArtworkCandidates:
      type: object
      required: [candidates, provider_configured, provider_name, provider_origin]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [ref, name, thumb_url]
            properties:
              ref: { type: string }
              name: { type: string }
              thumb_url:
                type: string
                description: >-
                  A REMOTE preview URL, the one place a provider URL is loaded directly and only
                  for an admin who explicitly opened the picker. Never stored, never rendered to
                  an end user - the no-hotlinking rule governs the library, and a picker an
                  operator opened is not the library.
        provider_configured: { type: boolean }
        provider_name: { type: string }
        provider_origin:
          type: string
          enum: [none, database, environment, static]
          description: "Where the credential in effect came from. See AppArtworkEnvelope.provider_origin."
    AdminApp:
      allOf:
        - { $ref: "#/components/schemas/App" }
        - type: object
          description: "Admin-visible app shape: includes runtime_spec + resource/storage defaults (P2-08, P5-01)."
          required: [default_vram_mb, default_encode_slots, runtime_spec, managed_home, home_container_path, runtime_preset_id, launchable_profile_ids, origin, library_provider, library_discovery_suspended, sessions_30d]
          properties:
            sessions_30d:
              # UI v3 amendment (2026-08-28, additive).
              type: integer
              description: >-
                Sessions created for this app in the last 30 days, counted at read time
                (`sessions.created_at >= now() - interval '30 days'`), EVERY state included -
                a launch that failed is still a launch someone attempted, and an admin
                ranking a catalogue by use wants attempts, not successes. Admin-only: it is
                fleet-wide across all users, so it never appears on App/AppListItem.
            origin:
              allOf: [ { $ref: "#/components/schemas/AppOrigin" } ]
              description: >-
                Steam library discovery Phase 3, ADDITIVE. Always serialized; 'manual' for every
                app predating migration 0044.
                READ-ONLY: it is deliberately NOT on AppWrite. An admin create is 'manual' by
                construction and only the Phase 4 reconciler writes 'discovered', so accepting it
                on write would let an operator mislabel a hand-made tile as discovered - and the
                reconciler keys its create/suppress behaviour off provenance, so a lie here is a
                lie to a background job rather than a cosmetic one.
                BOTH relabel directions are footguns under apps_parent_external_uk, which is what
                settles it: a tile relabelled 'manual' still occupies its (parent, source, appid)
                slot, so a reconciler reading it as "not mine, therefore missing" cannot re-create
                it either - a resurrection loop with no visible cause - and hand-creating a tile
                pre-labelled 'discovered' so a sweep adopts it has the same root cause. The field
                being unwritable removes both.
                ENFORCEMENT IS DisallowUnknownFields, NOT A FIELD-SPECIFIC BRANCH. Because this
                property is absent from AppWrite, sending {"origin": ...} to POST /v1/apps or
                PATCH /v1/apps/{id} is 400 validation_failed with the generic malformed-body
                message, not a message naming `origin`. That is the same mechanism that rejects
                any unknown key on this shape; do not expect a bespoke error string.
                Admin-only, like runtime_preset_id: it is operator/provenance detail, not library
                presentation, so it is not on AppListItem.
            library_provider:
              allOf: [ { $ref: "#/components/schemas/LibraryProvider" } ]
              description: >-
                Steam library discovery Phase 3, ADDITIVE. Always serialized; "" for every app
                predating migration 0044.
                THIS - AND ONLY THIS - IS THE TRIGGER FOR LIBRARY DISCOVERY (Phase 4). It is
                operator-set and NEVER inferred from the image name, because image names change
                and a wrong inference here starts a filesystem scan of somebody's home. It is
                also NOT `kind`: an admin editor may reasonably suggest kind='launcher' when this
                is set to steam, but no server path may branch on kind (control-api.md
                §Derived tiles).
                A derived tile must carry "" - a tile cannot itself be a provider, and the DB
                CHECK enforces it. Admin-only, like runtime_preset_id: operator configuration,
                not library presentation.
            library_discovery_suspended:
              type: boolean
              description: >-
                #534 AMENDMENT (2026-08-25), ADDITIVE. Always serialized; true when the
                library-discovery reconciler disabled this provider app because
                library_discovery_enabled is false (apps.library_discovery_suspended,
                migration 0060 - the column predates this amendment; it was previously
                invisible on every read shape, which made a suspended provider app
                indistinguishable from a deleted one). Admin-only, like origin: a suspended
                app is correctly ABSENT from the user library and 404 at launch (POST
                /v1/sessions is the authorization boundary and must not distinguish absent
                from withheld); the admin surface is where the state must be visible so the
                operator can see WHY the app is dark and that library_discovery_enabled=true
                reverses it. READ-ONLY: written only by the reconciler, not on AppWrite.
            default_vram_mb:
              type: integer
              deprecated: true
              description: >-
                DEPRECATED (#383). Still accepted on write and returned on read, but no longer
                read by the scheduler - admission gates on default_encode_slots plus a live
                free-VRAM veto. It was never enforceable (no VRAM cap is applied to a session).
            default_encode_slots: { type: integer }
            runtime_spec: { type: object, additionalProperties: true }
            managed_home: { type: boolean, description: "P5-01: whether this app provisions a per-user managed home directory." }
            home_container_path: { type: string, description: "P5-01: container path where the home is mounted (default /home/quasar)." }
            runtime_preset_id:
              type: [string, "null"]
              format: uuid
              description: >-
                UI-P3: the runtime preset this app inherits its container configuration from, or
                null when the app carries everything itself (the pre-UI-P3 behaviour). Always
                serialized. This is the app's OWN stored column - the preset is NEVER flattened
                into runtime_spec here; the merge happens server-side at launch, so this read
                shape shows the operator exactly what they configured. Admin-only, like
                runtime_spec: a preset is container configuration, not library presentation, so it
                is deliberately NOT on AppListItem.
            launchable_profile_ids:
              type: array
              items: { type: string }
              description: >-
                UI-P5: which LAUNCH PROFILES a user may pick for this app from the menu beside
                Play. ALWAYS serialized as an array, never null. EMPTY = unrestricted (any launch
                profile the device is eligible for), which is every pre-UI-P5 app, so the feature
                ships inert. NON-EMPTY = intersect with eligibility; it can only ever narrow what
                eligibility already permits, never widen it.
                The app's OWN default (default_profile_id under profile_policy 'prefer') is
                IMPLICITLY always included and cannot be removed, and is deliberately absent from
                this array - it is one field away and duplicating it would create a second copy to
                keep in sync.
                Only meaningful for profile_policy 'inherit' and 'prefer'. 'force' pins the app's
                profile outright, so this is always [] for a forced app and setting it is
                400 validation_failed - mirroring the admin UI hiding the control, rather than
                storing a rule that does nothing today and silently takes effect on a later policy
                change.
                Admin-only, for the same reason as runtime_preset_id: it is operator
                configuration, and a client is served the already-filtered menu by
                GET /v1/me/profiles?app_id= rather than being asked to intersect anything itself.
    AdminAppsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminApp" }
        next_cursor: { type: [string, "null"] }

    # ─── admin: runtime presets (UI-P3) ─────────────────────────────────────────
    # A RUNTIME PRESET is a reusable container configuration (image, args, env, mounts,
    # managed-home defaults) that many apps inherit instead of repeating. It is NOT a launch
    # profile: UI-P4's launch profiles are the quality/encode chain, an unrelated object. A
    # runtime preset says WHAT CONTAINER RUNS; a launch profile says HOW THE STREAM IS ENCODED.
    # The preset is merged into the app SERVER-SIDE AT LAUNCH, never flattened on save - that is
    # what makes a preset edit reach every app already using it. The node agent sees no
    # difference (agent-api.md is unchanged: still one opaque flattened `app` object).
    PresetUser:
      type: object
      description: "One app inheriting a runtime preset."
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    RuntimePreset:
      type: object
      required: [id, name, description, image, args, env, mounts, managed_home, home_container_path, network, used_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Unique. A collision on create/patch is 409 conflict." }
        description: { type: string }
        image: { type: string, description: "Inherited by apps whose own runtime_spec.image is blank/absent; an app that sets one overrides it." }
        args:
          type: array
          items: { type: string }
          description: "Prepended to the app's own launch arguments at launch (preset first)."
        env:
          type: object
          additionalProperties: { type: string }
          description: "Merged UNDER the app's environment at launch - a key set on the app wins."
        mounts:
          type: array
          items: { type: string }
          description: >-
            Prepended to the app's own mounts at launch (preset first), with NO DEDUPE. Two mounts
            on the same container path is a real misconfiguration and must surface rather than be
            silently resolved by the server picking one.
        managed_home:
          type: boolean
          description: >-
            Storage default for inheriting apps. apps.managed_home has no "unset", so an app can
            turn a managed home ON when its preset has none but cannot turn a preset's OFF.
        home_container_path:
          type: string
          description: "Container-side mount point default; an app with its own non-default path keeps it."
        network:
          type: string
          enum: ["", "none", "bridge"]
          description: >-
            First-run-experience §S2. Docker network mode for app containers launched from an app
            inheriting this preset. "" (default) = inherit the agent's host default
            (QUASAR_CONTAINER_NETWORK, else none). An app's own runtime_spec.network overrides
            this at launch, within the same none/bridge range. "host" is NOT available here:
            --network host removes the container's network namespace rather than widening it,
            exposing the host's own loopback (control plane, Postgres, the docker proxy, any
            admin-only port) to the app - and because a preset is portable (it can be materialized
            from a catalog image manifest authored on another machine), accepting "host" here
            would let a manifest dissolve the isolation boundary on every host that installs it.
            Host networking stays reachable only through the agent's own host-local
            QUASAR_CONTAINER_NETWORK operator knob, never through this API.
        used_by:
          type: array
          items: { $ref: "#/components/schemas/PresetUser" }
          description: >-
            The apps inheriting this preset - RESOLVED PER READ, never stored. It is what the
            admin UI's "Used by" row and its disabled-Delete affordance render; it is NOT the
            enforcement (DELETE returns 409 while it is non-empty). [] for an unused preset.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RuntimePresetEnvelope:
      type: object
      required: [runtime_preset]
      properties:
        runtime_preset: { $ref: "#/components/schemas/RuntimePreset" }
    RuntimePresetsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RuntimePreset" }
    RuntimePresetWrite:
      type: object
      required: [name]
      description: >-
        Admin create/edit shape. Only name is required; EVERY other absent field falls through to
        the server default on create and is left UNCHANGED on patch - absence is never a zero
        value written over the stored one.
      properties:
        name: { type: string }
        description: { type: string }
        image: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        mounts: { type: array, items: { type: string } }
        managed_home: { type: boolean }
        home_container_path: { type: string, description: "Must be absolute (400 otherwise)." }
        network:
          type: string
          enum: ["", "none", "bridge"]
          description: >-
            Closed set (400 validation_failed otherwise). Absent = unchanged on patch, default on
            create; explicit "" clears an override back to inherit. "host" is refused with a 400
            that names QUASAR_CONTAINER_NETWORK and why: host networking is a per-host operator
            decision made via that agent knob, never a portable preset/manifest property (a
            manifest-carried "host" would dissolve host isolation on every host that installs it).

    # ─── hosts: GPU availability ────────────────────────────────────────────────
    GPUAvailability:
      type: object
      description: "One GPU's capacity from GET /v1/hosts/{id}/gpus."
      required: [gpu_id, gpu_index, vendor, model, vram_mb_total, vram_mb_reserved, vram_mb_used, vram_mb_free, vram_sampled_at, slots_total, slots_reserved, active_sessions, render_node]
      properties:
        gpu_id: { type: string }
        gpu_index: { type: integer }
        vendor: { type: string }
        model: { type: string }
        vram_mb_total: { type: integer }
        vram_mb_reserved:
          type: integer
          deprecated: true
          description: >-
            DEPRECATED (#383). Sum of declared per-app VRAM over active sessions. Declared VRAM
            no longer participates in admission and new sessions record 0, so this trends to 0
            and should not be rendered as utilization. Use vram_mb_used / vram_mb_free instead.
        vram_mb_used:
          type: [integer, "null"]
          description: >-
            (#383, additive) Live per-GPU memory in use, from the agent heartbeat sample. Null
            means unknown - never sampled, agent predates the field, or the sample failed
            plausibility validation. Null is not zero.
        vram_mb_free:
          type: [integer, "null"]
          description: >-
            (#383, additive) Live free memory. This is the figure the admission veto reads. Null
            means unknown, in which case admission abstains and encode slots decide alone.
        vram_sampled_at:
          type: [string, "null"]
          format: date-time
          description: >-
            (#383, additive) When the control plane ingested the sample, on its own clock. A
            sample older than the server freshness window is treated as unknown.
        slots_total: { type: integer }
        slots_reserved: { type: integer }
        active_sessions: { type: integer }
        # host-observability-2: stable by-path render-node device path for this GPU
        # (valid as a render_node setting value); null until reported.
        render_node: { type: [string, "null"] }
    GPUsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GPUAvailability" }

    # ─── stream profiles / policy (AS10-01/02) ───────────────────────────────────
    StreamProfile:
      type: object
      description: >-
        ONE ENCODE RUNG (UI-P4): a single codec at a single resolution, frame rate and bitrate.
        NOT user-facing - a user picks a LaunchProfile, which lists these in preference order.
        BREAKING vs the pre-UI-P4 shape: `codecs[]` and its launchable|future|unsupported status
        enum are GONE, replaced by a single `codec`. A rung IS a codec, so there is nothing left
        for a status to describe; a codec is offered because a rung using it exists in a launch
        profile, and withdrawn by removing that rung.
      required: [id, display_name, codec, width, height, fps, h264_profile, nominal_bitrate_kbps, min_offer_bandwidth_kbps, recommended_offer_bandwidth_kbps, headroom_factor, abr_floor_kbps, max_startup_rtt_ms, min_decode_height, high_refresh_display, hardware_encoder_required, browser_client, playout0_ms, visibility]
      properties:
        id:
          type: string
          description: "Rungs created by migration 0036's fan-out use '<launch-profile-id>-<codec>', e.g. '1080p60-h264'."
        display_name: { type: string }
        codec: { $ref: "#/components/schemas/CatalogCodec" }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        h264_profile:
          type: string
          description: >-
            Meaningful only when codec is h264. The browser (WebRTC) receiver rejects High on both
            VA and NVENC, so a browser launch still negotiates down to constrained-baseline; this
            records the rung's preference for a capable client.
        nominal_bitrate_kbps: { type: integer }
        min_offer_bandwidth_kbps: { type: integer }
        recommended_offer_bandwidth_kbps: { type: integer }
        headroom_factor: { type: number }
        abr_floor_kbps: { type: integer }
        max_startup_rtt_ms: { type: integer }
        min_decode_height: { type: integer }
        high_refresh_display: { type: string, enum: [none, recommended, required] }
        hardware_encoder_required: { type: boolean }
        browser_client: { type: string, enum: [recommended, supported, risky] }
        playout0_ms: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/WriteWarning" }
          description: >-
            Present only on a WRITE response (PATCH /v1/admin/stream-profiles/{id}), and
            omitted entirely when there is nothing to say, so every read path is byte-identical
            to before. Reuses UI-P4's WriteWarning shape rather than inventing a second one.

            Emitted when a codec change leaves every launch profile listing this rung still
            carrying a launchable H.264 rung, but no longer LAST. That warns rather than
            rejects, because the 0036 fan-out preserved each profile's stored codec order and
            H.264 is often first, so rejecting would make migrated profiles permanently
            uneditable. A change that would leave a chain with NO launchable H.264 rung is a
            409 instead, naming the affected launch profiles: an operator editing one rung has
            no way to know which chains depend on it.

            This guard exists because the rule was previously enforced only when editing a
            launch profile's rung LIST, so editing a stream profile's codec could silently
            invalidate every chain listing it, with nothing surfacing until a launch failed at
            dispatch. See docs/design/plans/2026-07-29-library-ux-fixes-spec.md.
        visibility:
          type: string
          enum: [user, debug, internal]
          description: "Rungs created by the fan-out are 'internal': a rung is never offered standalone, only via the launch profile that lists it."
        used_by:
          type: array
          description: "Admin read only: the launch profiles listing this rung. Shown inside the editor as well as the list, because editing a shared object changes every consumer."
          items: { $ref: "#/components/schemas/ProfileRef" }
        session_count:
          type: integer
          description: >-
            Admin read only, ADDITIVE, omitted when zero: how many session rows record this rung as
            the one they resolved to. This is the SECOND "used by" dimension and it also blocks
            DELETE - sessions.stream_profile_id is a plain foreign key with no ON DELETE clause
            (NO ACTION on purpose: ON DELETE SET NULL would erase which rung a historical session
            actually got, which is the entire reason the column exists), so one historical session
            refuses the delete at the database. A client must treat a non-zero session_count exactly
            like a non-empty used_by when deciding whether to offer Delete.
    ProfileRef:
      type: object
      description: "A minimal reference to a profile object, used in 'used by' lists."
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
    StreamProfileWrite:
      type: object
      description: "UI-P4: admin create/edit shape for one encode rung."
      required: [display_name, codec, width, height, fps, nominal_bitrate_kbps]
      properties:
        id:
          type: string
          description: "Required on POST (rung ids are operator-chosen text, not uuids); ignored on PATCH."
        display_name: { type: string }
        codec: { $ref: "#/components/schemas/CatalogCodec" }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        h264_profile: { type: string }
        nominal_bitrate_kbps: { type: integer }
        min_offer_bandwidth_kbps: { type: integer }
        recommended_offer_bandwidth_kbps: { type: integer }
        headroom_factor: { type: number }
        abr_floor_kbps: { type: integer }
        max_startup_rtt_ms: { type: integer }
        min_decode_height: { type: integer }
        high_refresh_display: { type: string, enum: [none, recommended, required] }
        hardware_encoder_required: { type: boolean }
        browser_client: { type: string, enum: [recommended, supported, risky] }
        playout0_ms: { type: integer }
        visibility: { type: string, enum: [user, debug, internal] }
    AdminStreamProfilesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StreamProfile" }

    # ─── admin: launch profiles (UI-P4) ────────────────────────────────────────
    # A LAUNCH PROFILE is an ORDERED CHAIN of stream profiles (rungs), best first. It is what a
    # user picks, what the global default points at, and what an app pins. The launch walks the
    # rungs and takes the first the placed host can encode and the client can decode, so falling
    # through a rung can change RESOLUTION as well as codec. Fall-through happens AT LAUNCH ONLY,
    # never mid-session (a mid-session resolution change is a WebRTC renegotiation, out of scope).
    # Distinct from a RUNTIME PRESET (UI-P3), which says what container runs.
    LaunchProfileRung:
      type: object
      required: [position, stream_profile]
      properties:
        position:
          type: integer
          minimum: 1
          description: "Preference order, 1 = tried first. Server-assigned from the ordered id array on write; a client never sends positions."
        stream_profile: { $ref: "#/components/schemas/StreamProfile" }
    LaunchProfileUsedBy:
      type: object
      description: "Everything referencing this launch profile. Non-empty in any dimension means DELETE is 409."
      required: [apps, global_default, user_preferences]
      properties:
        apps:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        global_default: { type: boolean, description: "True when stream_profile_policy.global_default_profile_id points here." }
        user_preferences: { type: integer, description: "Count of user_profile_preferences rows pointing here." }
    LaunchProfile:
      type: object
      required: [id, display_name, description, visibility, sort_order, rungs]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        visibility:
          type: string
          enum: [user, debug, internal]
          description: "Debug/internal launch profiles are never returned by GET /v1/me/profiles."
        sort_order: { type: integer }
        rungs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/LaunchProfileRung" }
        used_by: { $ref: "#/components/schemas/LaunchProfileUsedBy" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/WriteWarning" }
    LaunchProfileWrite:
      type: object
      description: >-
        UI-P4 admin create/edit shape. THE H.264 FLOOR RULE - the rung list must contain at least
        one rung whose codec is h264, or the write is 400 validation_failed. "And it must be LAST"
        is a WARNING (h264_floor_not_last), not a rejection: rejecting would make a migrated launch
        profile whose stored codec order puts h264 first permanently uneditable, and would add no
        safety, because the guarantee is the resolver's unconditional floor (if no rung survives
        the clamp chain, the last h264 rung dispatches bypassing EVERY clamp, including its own
        hardware_encoder_required).
      required: [display_name, rungs]
      properties:
        id: { type: string, description: "Required on POST; ignored on PATCH." }
        display_name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [user, debug, internal] }
        sort_order: { type: integer }
        rungs:
          type: array
          minItems: 1
          description: >-
            ORDERED stream-profile ids, best first. ORDER IS PREFERENCE. A stream profile may
            appear at most once (a duplicate is 400 validation_failed). An id that does not
            resolve is 400 validation_failed at write time, never an FK error surfacing at launch.
          items: { type: string }
    AdminLaunchProfilesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LaunchProfile" }
    ProfileReason:
      type: object
      description: "A stable reason code + message explaining an eligibility decision (AS10-02)."
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ProfileEvaluation:
      allOf:
        - { $ref: "#/components/schemas/StreamProfile" }
        - type: object
          description: >-
            Per-RUNG eligibility verdict inside a LaunchProfileEvaluation (AS10-02 rules, UI-P4
            grain). Before UI-P4 this was the top-level element of GET /v1/me/profiles; it is now
            nested under a launch profile's rungs[].
          required: [position, eligibility, reasons]
          properties:
            position: { type: integer, minimum: 1 }
            eligibility: { type: string, enum: [eligible, risky, ineligible] }
            reasons:
              type: array
              items: { $ref: "#/components/schemas/ProfileReason" }
    ProfileNominal:
      type: object
      description: >-
        UI-P4: the TOP rung's numbers, echoed so a picker and the admin app-editor preview have
        something to render. ADVERTISED, NOT RESOLVED - if a rung falls through, the session
        streams something else, and the session's own `stream` block is the truth. Clients must
        not treat this as a promise.
      required: [width, height, fps, bitrate_kbps]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate_kbps: { type: integer }
    LaunchProfileEvaluation:
      type: object
      description: >-
        UI-P4: a launch profile with its eligibility verdict and its per-rung verdicts. A launch
        profile is `eligible` if ANY rung is - which INVERTS the pre-UI-P4 semantics on purpose, so
        a 4K launch profile no longer vanishes for a client that cannot decode 4K; it is offered
        and resolves to its H.264 floor rung. Counterweight: a launch profile whose TOP rung is
        ineligible while a lower one is not is classified `risky`, NOT `eligible`, so it can never
        become recommended_id - without that rule the inverted semantics would silently recommend
        a "4K" profile that always streams 1080p.
      required: [id, display_name, description, nominal, eligibility, reasons, rungs]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        nominal: { $ref: "#/components/schemas/ProfileNominal" }
        eligibility: { type: string, enum: [eligible, risky, ineligible] }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/ProfileReason" }
        rungs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProfileEvaluation" }
    ProfilesResponse:
      type: object
      description: >-
        GET /v1/me/profiles response: eligibility + recommendation. BREAKING (UI-P4) - `profiles[]`
        now holds LAUNCH PROFILES, which have no single top-level resolution. A consumer reading
        profiles[].width breaks; quasar-client (ffi_control.rs, ffi.rs) hand-projects
        width/height/fps off this shape and needs a re-pin, deliberately deferred to its own work.
      required: [recommended_id, confidence, notes, profiles]
      properties:
        recommended_id: { type: string, description: "UI-P4: a LAUNCH PROFILE id." }
        confidence: { type: string, enum: [high, low] }
        notes:
          type: array
          items: { $ref: "#/components/schemas/ProfileReason" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/LaunchProfileEvaluation" }
    ProfilePolicyResponse:
      type: object
      properties:
        global_default_profile_id:
          type: [string, "null"]
          description: >-
            UI-P4: a LAUNCH PROFILE id (400 validation_failed for an id that is not a user-visible
            launch profile). null means there is no global default and the per-user recommendation
            decides - which is the shipped state; migration 0036 deliberately does NOT populate it,
            because doing so would change the effective resolution of every `inherit` app for every
            user in one invisible step.
        user_overrides_allowed: { type: boolean }
    ProfilePreferencesResponse:
      type: object
      properties:
        default_profile_id:
          type: [string, "null"]
          description: "UI-P4: the caller's preferred LAUNCH PROFILE; honoured only while user_overrides_allowed is true."
        global_default_profile_id: { type: [string, "null"] }
        user_overrides_allowed: { type: boolean }

    SessionOverlayPreferences:
      type: object
      description: >
        In-session overlay presentation. The server validates the vocabulary but
        never interprets the values — they only shape what the client draws.
      properties:
        strip_preset:
          type: string
          enum: [full, minimal, metrics, custom]
          description: >
            Named starting point for strip_items. "custom" means the item set was
            hand-edited and no longer matches a named preset. The client, not the
            server, decides when a preset becomes custom.
        strip_items:
          type: object
          description: >
            Per-item visibility. Absent keys default to visible — which is what
            makes adding an item additive: a client that has never written the
            key still gets the new item, and an older client simply ignores it.
            signal/identity/codec/metrics/hint are readouts;
            capture/exit/mic/fullscreen are ACTIONS, and a client that draws
            them must keep them inert while input is captured (the pointer is
            locked, so they cannot be clicked anyway, and drawing a live control
            that cannot be reached is worse than drawing none).

            An action item is a request to DRAW the control, never a grant of
            the underlying capability. `mic` in particular is independent of
            whether the session actually permits microphone capture — that is
            `session.mic_granted`, a server decision. A client honouring
            mic=true on a session with mic_granted=false must render the
            control unavailable, not hide it and not enable it.
          properties:
            signal:     { type: boolean }
            identity:   { type: boolean }
            codec:      { type: boolean }
            metrics:    { type: boolean }
            hint:       { type: boolean }
            capture:    { type: boolean }
            exit:       { type: boolean }
            mic:        { type: boolean }
            fullscreen: { type: boolean }
          additionalProperties: false
        strip_position:
          type: string
          # UI v3 amendment (2026-08-28): `left` and `right` join the vocabulary. The v3
          # session HUD, shipping with that UI pass, renders all four docks; the enum is
          # widened AHEAD of it so a user who picks a side dock can have the choice
          # persisted - not a claim that an earlier overlay already drew them. Widening an
          # accepted-value set is additive - no stored value changes meaning, and a client
          # that only ever writes top/bottom is unaffected.
          enum: [top, bottom, left, right]
        strip_auto_hide:
          type: string
          enum: [on_capture, always_visible, never_visible]
          description: >
            never_visible suppresses the strip entirely. The microphone "hot"
            indicator is NOT part of the strip and remains visible regardless —
            a live microphone must never become invisible.
      additionalProperties: false

    UIPreferences:
      type: object
      description: >
        Per-user client presentation preferences, synced across that user's
        devices. One key per client surface so a new surface needs no new
        endpoint. Unknown top-level keys are preserved through a PATCH.
      properties:
        session_overlay: { $ref: "#/components/schemas/SessionOverlayPreferences" }

    # ─── home rail (GET /v1/me/highlights) ────────────────────────────────────
    HighlightList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Highlight" }

    HighlightReason:
      type: string
      description: >-
        WHY this app is on the rail. The server ranks and labels; the client renders the
        kicker and never re-derives the reason. Enumerated so a client can style each kicker
        (live = success, most_played / resume = accent, recently_added = info) without
        string-matching prose. Widening this enum is a later amendment; a client pinned to
        this version holds a closed union and must fall through to a neutral kicker for an
        unknown value rather than dropping the item.
      enum: [live, most_played, resume, recently_added]

    Highlight:
      type: object
      required: [app_id, reason, session_id, session_started_at, play_seconds, last_played_at]
      properties:
        app_id:
          type: string
          format: uuid
          description: >-
            The app this highlight is about. The client already holds the full AppListItem
            from GET /v1/apps and joins on this id — name, cover_url, hero_url, kind and
            favourite are DELIBERATELY NOT duplicated here. One source of truth for
            presentation; a second copy would drift the moment artwork is re-resolved.
        reason: { $ref: "#/components/schemas/HighlightReason" }
        session_id:
          type: [string, "null"]
          format: uuid
          description: 'The live session, when reason is "live". Null for every other reason.'
        session_started_at:
          type: [string, "null"]
          format: date-time
          description: >-
            sessions.started_at for the live session, so the client renders the elapsed clock
            itself and it ticks without polling. Null unless reason is "live".
        play_seconds:
          type: integer
          description: >-
            Total play time in the requested window, clamped per-session (an unreconciled
            NULL ended_at is bounded, never open-ended) and excluding state='failed'. 0 when
            not applicable to the reason.
        last_played_at:
          type: [string, "null"]
          format: date-time
          description: >-
            MAX(ended_at) over the user's non-failed sessions for this app. Null when the app
            has never been played to completion - which is the state of every app for a user
            whose only session is the currently-live one.

    # ─── admin: users ─────────────────────────────────────────────────────────
    AdminUser:
      type: object
      description: "User record from GET /v1/users (admin)."
      required: [id, email, username, role, disabled, max_concurrent_sessions, created_at, last_seen_at, active_session_count]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        max_concurrent_sessions: { type: integer }
        created_at: { type: string, format: date-time }
        # UI v3 amendment (2026-08-28, additive): two derived read-only fields, both
        # aggregated in the list query - never a per-row follow-up call.
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The most recent `user_devices.last_seen_at` across this user's devices, or null
            when they have none. This is DEVICE activity (a login or a capability probe),
            deliberately not "last request": there is no per-request write on the hot path
            and adding one to answer a dashboard would be the wrong trade.
        active_session_count:
          type: integer
          description: >-
            This user's sessions in a non-terminal state (pending, assigned, starting,
            running, stopping) right now. Deliberately ONE STATE WIDER than the quota gate,
            which counts `('pending','assigned','starting','running')`: a session being torn
            down is still this user's session on an operator's screen, while the quota
            releases early on purpose so a relaunch is not blocked by a teardown. Read it as
            "sessions this user has open", not as "quota consumed".
    AdminUsersResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_cursor: { type: [string, "null"] }
    AdminUserUpdate:
      type: object
      description: "PATCH /v1/users/{id} request body — role/quota/disable, all fields optional."
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        max_concurrent_sessions: { type: integer }

    # ─── admin: sessions + telemetry ─────────────────────────────────────────────
    AgentMetrics:
      type: object
      description: "Metrics from the node-agent encode pipeline."
      properties:
        fps: { type: number }
        bitrate_kbps: { type: integer }
        encode_ms: { type: number }
        frames_encoded: { type: integer }
        frames_dropped: { type: integer }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        overlay_frames: { type: integer }
        abr_floor_kbps: { type: number, description: "The governor's live floor, sent ONLY when the ladder has moved it off the launch floor. Absent means 'the floor the session launched with', never 'unknown'. Uncurated: readable via GET .../metrics, not in the diagnostic lens." }
        abr_mode: { type: string, description: "The ABR mode this session is actually running ('smooth' | 'protective' | 'off'). Reported rather than inferred: deriving it from setpoint presence was wrong for 'off', where rtpgccbwe stays attached. Uncurated (a label, not a series)." }
        abr_setpoint_kbps: { type: number, description: "The in-session ABR governor's CURRENT CBR setpoint at drain time — a level, not a window average. Absent when ABR is disarmed." }
        adaptation_state: { type: string, description: "The agent's own per-window bottleneck label ('healthy' | 'network_congested' | 'encoder_saturated' | 'unknown'). SIGNAL-ONLY — it changes no ABR behaviour, and it can never say 'client_presentation_limited' because the agent never sees browser data (invariant #1)." }
        compositor_fps: { type: number, description: "Frames emitted by waylanddisplaysrc per second, BEFORE caps normalisation and interpipe. The first stage where a rate can differ from what the app painted." }
        compositor_pts_delta_p50_ms: { type: number, description: "p50 spacing of consecutive compositor buffer PTS. NOMINAL, NOT REALIZED: PTS come off the shared pipeline clock at the negotiated rate, so this sits at a flat ~16.668 ms at 60 fps however badly the wall-clock cadence jitters. For realized emit spacing read probe_compositor_frame_interval_p95_ms." }
        compositor_pts_delta_p95_ms: { type: number, description: "p95 of the same NOMINAL PTS spacing. Same trap as the p50: a healthy-looking 16.7 here is not evidence the compositor emitted on time." }
        external_owner: { type: string, description: "Who owns the external size — 'auto' (the ladder) or 'pinned' (a user/admin PATCH). Rides the size echo, so it is present only while the size is off the launch size." }
        external_resize_supported: { type: boolean, description: "Whether this session's encode path can change the external resolution live. Always sent by a capable agent; ABSENT MEANS UNKNOWN, not false." }
        gcc_estimate_kbps: { type: number, description: "The raw rtpgccbwe bandwidth estimate BEFORE the governor's EWMA / deadband / step logic. The delta against abr_setpoint_kbps is the governor's own smoothing contribution." }
        interpipe_queue_drops: { type: integer, description: "Leaky-queue overruns in the window. Host-side loss BEFORE the encoder; distinct from frames_dropped (encoder) and from the client's frames_dropped (presentation)." }
        interpipe_queue_dwell_p50_ms: { type: number, description: "p50 time a buffer spent between the interpipe sink and src. Omitted when nothing traversed." }
        interpipe_queue_dwell_p95_ms: { type: number, description: "p95 interpipe dwell — where a queue that is filling shows up before drops do." }
        interpipe_queue_level_max: { type: integer, description: "Deepest the interpipe queue got, in buffers, since the previous drain reset it. A max, so one burst sets it for the whole window — which is the point." }
        ladder_fps: { type: integer, description: "The encoded frame rate the fps rung currently asks for. Present only BELOW the launch rate; only a 120 fps session can ever carry it." }
        ladder_res_rung: { type: integer, description: "The ladder's current external-resolution rung index (0 = launch). Present only when non-zero." }
        ladder_speed_bias: { type: integer, description: "The ABR ladder's current encoder speed-bias rung. Present only when non-zero — absent is 'baseline quality posture', never 'unknown'." }
        probe_capture_to_enc_in_p50_ms: { type: number, description: "Host-stage latency probe: p50 of compositor src to encoder sink — the pre-encode transit the interpipe hides. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_capture_to_enc_in_p95_ms: { type: number, description: "Host-stage latency probe: p95 of compositor src to encoder sink — the pre-encode transit the interpipe hides. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_compositor_frame_interval_p95_ms: { type: number, description: "p95 REALIZED wall-clock spacing of compositor emits — the honest counterpart to the nominal compositor_pts_delta_p95_ms. Probe-gated." }
        probe_enc_out_to_send_p50_ms: { type: number, description: "Host-stage latency probe: p50 of encoder src to the pre-SRTP seam, FIFO-paired and guarded at one frame period so a persistent off-by-one cannot inflate every sample. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_enc_out_to_send_p95_ms: { type: number, description: "Host-stage latency probe: p95 of encoder src to the pre-SRTP seam, FIFO-paired and guarded at one frame period so a persistent off-by-one cannot inflate every sample. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_pay_to_send_p50_ms: { type: number, description: "Host-stage latency probe: p50 of payloader to the pre-SRTP seam, keyed on the RTP timestamp rather than on order, so unlike enc_out_to_send it cannot desync and keeps its tail. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_pay_to_send_p95_ms: { type: number, description: "Host-stage latency probe: p95 of payloader to the pre-SRTP seam, keyed on the RTP timestamp rather than on order, so unlike enc_out_to_send it cannot desync and keeps its tail. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_pts_to_emit_p50_ms: { type: number, description: "Host-stage latency probe: p50 of the compositor's own PTS-to-emit hold, from Element::current_running_time. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_pts_to_emit_p95_ms: { type: number, description: "Host-stage latency probe: p95 of the compositor's own PTS-to-emit hold, from Element::current_running_time. Present ONLY when QUASAR_LATENCY_PROBE is on AND that stage sampled this window — absent means not measured, never 0. Observability only: nothing in the control plane may key on it." }
        probe_pts_unmatched: { type: integer, description: "Encoder-input PTS that never matched a compositor-emit ring entry — the correlation key stopped surviving to the encoder. Probe-gated." }
        probe_send_desyncs: { type: integer, description: "Encoder-src entries dropped from the S3 pairing for exceeding one frame period of age — the count that says enc_out_to_send's tail is truncated rather than clean. Probe-gated." }
        render_height: { type: integer, description: "The compositor's CURRENT app-facing wl_output logical height; see render_width." }
        render_width: { type: integer, description: "The compositor's CURRENT app-facing wl_output logical width. Present only when it differs from the session's pinned stream size. With render_height and ui_scale this is the ONLY authoritative readback of live render resolution — the value lives nowhere else." }
        rtp_bitrate_kbps: { type: number, description: "RTP packet bitrate before WebRTC transport overhead (SRTP, RTX, FEC). Always a little above bitrate_kbps; a large gap is retransmission." }
        rtp_fps: { type: number, description: "RTP access units completed per second, counted on marker packets — the last host-side rate before the wire." }
        source_fps: { type: number, description: "New buffers committed by the MAPPED FULLSCREEN app top-level per second. Cursor, popup, subsurface and configure-only commits are excluded, so this is the app's own paint rate, not Wayland traffic." }
        stream_height: { type: integer, description: "The session's CURRENT external (encoded) height; see stream_width." }
        stream_width: { type: integer, description: "The session's CURRENT external (encoded) width, read back from the encode graph's NEGOTIATED caps — not from the last request. Present only when != the launch size, so absent means 'at launch size', never 'unknown'." }
        ui_scale: { type: number, description: "The compositor's CURRENT fractional-scale preferred_scale. Present only when != 1.0." }

    BrowserMetrics:
      type: object
      description: "Metrics from the browser WebRTC client."
      properties:
        fps: { type: number }
        bitrate_kbps: { type: integer }
        rtt_ms: { type: number }
        jitter_buffer_ms: { type: number }
        decode_ms: { type: number }
        packets_lost: { type: integer }
        frames_dropped: { type: integer }
        present_fps: { type: number, description: "Presentation fps derived from the MEAN RVFC interval. DEPRECATED as a headline: at source fps == display Hz a single missed vsync doubles one interval and drags the mean (a healthy 1440p120 session read 88-108 on 2026-08-22). Read present_fps_median. Retained unchanged for series continuity." }
        present_fps_median: { type: number, description: "Presentation fps from the MEDIAN RVFC interval — the fps a viewer perceives, unmoved by an occasional doubled frame. The number to read." }
        present_interval_median_ms: { type: number, description: "Median frame-to-frame presentation interval (ms)." }
        present_interval_sd_ms: { type: number }
        present_interval_p95_ms: { type: number }
        present_interval_max_ms: { type: number, description: "Longest presentation interval in the window (ms) — the real stall length, and the source of client.freeze_detected's gap_ms." }
        present_beat_fraction: { type: number, description: "Share (0..1) of the window's intervals within +/-20% of exactly 2x the median. At source fps == display Hz this is the inherent vsync beat, not stutter; read it beside present_long_frames." }
        present_long_frames: { type: integer, description: "Intervals longer than 2.5x the median — above the doubled band, so genuine stalls rather than the beat. Zero is what makes a beat benign." }
        present_n: { type: integer, description: "Intervals the window actually contained. Below 5 every other present_* key is omitted rather than computed from a fragment." }
        playout_target_ms: { type: number }
        rvfc_capture_time_available: { type: integer, description: "RVFC captureTime has a current validated sample (0/1); stale/missing/invalid captureTime resets it. Not proof of abs-capture-time RTP negotiation." }
        abs_capture_time_negotiated: { type: integer, description: "Strict abs-capture-time RTP-extension negotiation evidence (0 until SDP/RTP wire proof exists)." }
        freeze_count: { type: integer, description: "CUMULATIVE getStats freezeCount. Its advances drive the client.freeze_detected event; the freeze LENGTH is present_interval_max_ms, never 1000/freezeCount. Stored and taxonomised since P1; declared here 2026-08-23." }
        display_refresh_hz: { type: number, description: "The client monitor's refresh rate, measured from rAF vsync spacing with a MEDIAN (AS10-14). Not RVFC-derived. Stored and taxonomised since AS10-14; declared here 2026-08-23." }
        glass_to_glass_ms: { type: number, description: "DEPRECATED in favour of rvfc_capture_to_display_ms, which names what is actually measured. Unchanged in value and still posted: RTP capture-time to browser present, MEDIAN over a never-drained ring of up to 600 RVFC samples — minutes of history, not this second, and not true glass-to-glass (it excludes app render and client scan-out)." }
        rvfc_capture_to_display_ms: { type: number, description: "RTP capture-time to browser present (ms), median over a rolling ring of up to 600 RVFC samples. Identical in value to glass_to_glass_ms, which it replaces; both are posted this release so no stored series breaks. Additive, approved by Michael 2026-08-23." }
        encode_ms: { type: number, description: "Accepted by the browser ingest allow-list and declared here, but no client has ever posted it — the browser cannot observe host encode time. Kept declared so the ingest contract does not change." }
        network_pacing_ms: { type: number }
        decode_display_ms: { type: number }
        is_hidden: { type: integer, description: "AS10-11: tab visibility at sample time (0/1)." }
        input_backpressure: { type: integer, description: "AS10-13 input-pipeline health: the DataChannel hit its backpressure threshold. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_channel_buffered_bytes: { type: integer, description: "AS10-13 input-pipeline health: DataChannel bufferedAmount — the backpressure reading. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_coalesced_per_sec: { type: integer, description: "AS10-13 input-pipeline health: pointer samples coalesced away per second (a subset of input_msg_per_sec). POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_gamepad_count: { type: integer, description: "AS10-13 input-pipeline health: connected gamepads. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_gamepad_send_per_sec: { type: integer, description: "AS10-13 input-pipeline health: gamepad state messages sent per second. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_mm_per_sec: { type: integer, description: "AS10-13 input-pipeline health: relative mouse-motion messages sent per second. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_msg_per_sec: { type: integer, description: "AS10-13 input-pipeline health: input DataChannel messages sent per second. POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }
        input_trace: { type: integer, description: "AS10-13 input-pipeline health: the input tracer is on (seq + tc stamped). POSTED EVERY SECOND AND SILENTLY DROPPED — it is not in FilterBrowserMetrics's allow-list, so it is visible live in the diagnostics panel and exists in no stored sample." }

    MetricPoint:
      type: object
      description: "One row from GET /v1/admin/sessions/{id}/metrics."
      required: [source, ts_unix_ms, metrics]
      properties:
        source: { type: string, enum: [agent, browser] }
        ts_unix_ms: { type: integer }
        metrics:
          oneOf:
            - { $ref: "#/components/schemas/AgentMetrics" }
            - { $ref: "#/components/schemas/BrowserMetrics" }
    MetricsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
        next_cursor: { type: [string, "null"] }
    LatestMetrics:
      type: object
      description: "latest_metrics on each session list item — present only when telemetry exists."
      properties:
        agent: { $ref: "#/components/schemas/MetricPoint" }
        browser: { $ref: "#/components/schemas/MetricPoint" }
    AdminSession:
      allOf:
        - { $ref: "#/components/schemas/Session" }
        - type: object
          description: >-
            A Session plus the admin-only display names of the rows it references.
            All three name fields are additive and OMITTED when the join resolves
            nothing; the client falls back to the truncated id.
          properties:
            latest_metrics: { $ref: "#/components/schemas/LatestMetrics" }
            username:
              type: string
              description: "users.username for user_id. Omitted when the user row is gone."
            app_name:
              type: string
              description: "apps.name for app_id. Omitted when the app row is gone."
            host_name:
              type: string
              description: >-
                hosts.node_name for host_id. Omitted while the session is
                unassigned (host_id is null) and when the host row is gone.
    AdminSessionsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminSession" }
        next_cursor: { type: [string, "null"] }

    # ─── admin: host runtime config catalog ──────────────────────────────────────
    ConfigKnob:
      type: object
      description: "One entry from GET /v1/admin/config/catalog."
      # min/max/enum are omitempty in hostcfg.Knob — present only for knobs that carry them.
      required: [key, type, default, nullable, class, env_var]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, float, enum, string] }
        default: { type: [boolean, number, string, "null"] }
        min: { type: number }
        max: { type: number }
        enum:
          type: array
          items: { type: string }
        nullable: { type: boolean }
        class: { type: string, enum: [live, restart] }
        env_var: { type: string }
    ConfigCatalogResponse:
      type: object
      required: [knobs]
      properties:
        knobs:
          type: array
          items: { $ref: "#/components/schemas/ConfigKnob" }

    # ─── console mode (CM-01) ────────────────────────────────────────────────────
    ConsoleConfig:
      type: object
      description: "Per-host console-mode config. On PATCH the body is partial (any subset); on GET it is the resolved object. Off + local-only by default; audio_output has no default (null = quiet)."
      properties:
        enabled: { type: boolean }
        connector: { type: string, description: "'auto' or a DRM connector name (DP-4, HDMI-A-1, …)." }
        output_id: { type: [string, "null"], description: "Card-scoped DRM output id from capabilities.outputs; null selects automatic output." }
        mode:
          description: "Exact static physical mode for output_id; null selects the compositor preferred mode."
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/ConsoleModeSelection" }
        compositor: { type: string, enum: [weston, cage] }
        audio_output: { type: [string, "null"], description: "Local host sink id ('auto' | alsa hw id | hdmi | motherboard | usb:*), or null = no local audio." }
        stream: { type: boolean, description: "Also stream over WebRTC (dual-output). Default false = local-only." }
        stream_audio: { type: boolean }
        input_devices:
          description: "'auto' or an explicit list of /dev/input/event* paths."
          oneOf:
            - { type: string, enum: [auto] }
            - { type: array, items: { type: string } }
        grab: { type: boolean }
        auto_start_on_display: { type: boolean }
        auto_connect_controller: { type: boolean }
        default_app: { type: [string, "null"], format: uuid }
        default_user: { type: [string, "null"], format: uuid, description: "CM-06: owner of auto-started console sessions (users.id). Required when auto_start_on_display=true." }
        fullscreen: { type: boolean }
    ConsoleModeSelection:
      type: object
      required: [width, height, refresh_millihz]
      properties:
        width: { type: integer }
        height: { type: integer }
        refresh_millihz: { type: integer }
    ConsoleCapabilities:
      type: object
      description: "What the host can do in console mode (from agent-api capacity.console_capabilities). Empty arrays if unreported."
      required: [connectors, audio_sinks, input_devices]
      properties:
        connectors:
          type: array
          items: { type: string }
        outputs:
          type: array
          description: "Typed per-card DRM connector and mode inventory. Additive; absent from older agents."
          items: { $ref: "#/components/schemas/DrmOutputCapability" }
        audio_sinks:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        input_devices:
          type: array
          items:
            type: object
            required: [path, label]
            properties:
              path: { type: string }
              label: { type: string }
    DrmOutputCapability:
      type: object
      required: [id, card, render_node, connector, connected, active_mode, modes]
      properties:
        id: { type: string, description: "Stable card-scoped output id, e.g. card1:DP-4." }
        card: { type: string }
        render_node: { type: [string, "null"] }
        connector: { type: string }
        connected: { type: boolean }
        active_mode:
          description: "Mode currently programmed on the connector CRTC, or null when inactive."
          oneOf:
            - { $ref: "#/components/schemas/DrmModeCapability" }
            - { type: "null" }
        modes: { type: array, items: { $ref: "#/components/schemas/DrmModeCapability" } }
    DrmModeCapability:
      type: object
      required: [name, width, height, refresh_millihz, preferred, interlaced, clock_khz, htotal, vtotal]
      properties:
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        refresh_millihz: { type: integer, description: "Millihertz derived from exact DRM timing totals." }
        preferred: { type: boolean }
        interlaced: { type: boolean }
        clock_khz: { type: integer }
        htotal: { type: integer }
        vtotal: { type: integer }
    ConsoleConfigEnvelope:
      type: object
      required: [config, capabilities]
      properties:
        config: { $ref: "#/components/schemas/ConsoleConfig" }
        capabilities: { $ref: "#/components/schemas/ConsoleCapabilities" }

    # ─── session trace / diagnostic bundle (ST-06/ST-07) ─────────────────────────
    TraceSeriesPoint:
      type: object
      properties:
        ts_unix_ms: { type: integer }
        v: { type: number }
    TraceEvent:
      type: object
      properties:
        source: { type: string, enum: [agent, browser] }
        ts_unix_ms: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
    Falsifier:
      type: object
      description: "One named, estimator-qualified number the verdict relies on (ST-09). `holds` is whether the data satisfies the condition; a series with no samples reports value null, n 0, holds false and a note. Some falsifiers are INFORMATIVE — client.present_beat_fraction is compared against the upper bound of its own unit, so it cannot fail; it is in the set to carry the number and the note that explains it."
      required: [name, estimator, value, op, threshold, unit, n, holds]
      properties:
        name: { type: string, description: "Taxonomy series name, e.g. encoder.fps." }
        estimator: { type: string, enum: [p10, p95, max, delta, mean, any, count_ge_threshold] }
        value: { type: [number, "null"], description: "Null when the series had no samples in the window." }
        op: { type: string, enum: [">=", "<=", ">", "<", "=="] }
        threshold: { type: number }
        unit: { type: string, enum: [fps, ms, count, bool, fraction] }
        n: { type: integer, description: "Samples the estimator consumed." }
        holds: { type: boolean }
        note: { type: string }
    Verdict:
      type: object
      description: "The single stream-health judgement as a value (ST-09): state + prose evidence + the falsifiers that would overturn it + window/clock/tier. Observational only, no session authority. An unknown `verdict` string is DATA to a consumer."
      required: [verdict, evidence, reason, window, clock, evidence_tier, falsifiers, thresholds_version]
      properties:
        verdict:
          type: string
          description: "The control plane owns this vocabulary and grows it; the enum below is today's set, not a closed world."
          enum: [likely_encoder_saturation, likely_network_congestion, likely_client_presentation_limit, nominal, indeterminate_client_hidden, unknown]
        evidence:
          type: array
          items: { type: string }
        reason: { type: string, description: "One sentence." }
        window:
          type: object
          required: [from_ms, to_ms, n_host, n_client]
          properties:
            from_ms: { type: integer }
            to_ms: { type: integer }
            n_host: { type: integer, description: "Agent samples in the window." }
            n_client: { type: integer, description: "Browser samples in the window." }
            warmup_excluded_ms: { type: integer, description: "Milliseconds at the head of the window excluded from warm-up-sensitive rules (hitch detection and the encoder.fps floor). 0 when nothing was excluded." }
        clock:
          type: object
          required: [quality]
          properties:
            quality: { type: string, enum: [measured, unmeasured] }
            offset_ms: { type: number }
            uncertainty_ms: { type: number }
            applied: { type: boolean, description: "Whether the offset was actually applied to the client-clock series before the rules ran. False for an unmeasured clock, in which case every cross-source coincidence claim is downgraded and says so." }
            age_ms: { type: integer, description: "Now minus the clock's measured_at (ms). Staleness is visible: the client re-posts the offset while it drifts, so a large age means the estimate stopped being refreshed." }
        evidence_tier:
          type: string
          enum: [full, host_only, client_only, insufficient]
        falsifiers:
          type: array
          items: { $ref: "#/components/schemas/Falsifier" }
        thresholds_version: { type: string }
    CaptureRequest:
      type: object
      description: "POST /v1/admin/sessions/{id}/capture body (session-capture)."
      required: [kind]
      properties:
        kind:
          type: string
          description: "The control plane owns this vocabulary and grows it; the enum is today's set, not a closed world."
          enum: [pipeline_dot, encoder_props, burst_stats]
        params:
          type: object
          description: "burst_stats only; ignored by the other kinds. Clamped by the control plane and again by the agent."
          properties:
            windows: { type: integer, minimum: 1, maximum: 40 }
            window_ms: { type: integer, minimum: 100, maximum: 1000 }
    CaptureAccepted:
      type: object
      description: "202 body: the capture is ARMED. The capture_id is minted before dispatch, so the caller holds the join key immediately."
      required: [capture_id, kind, session_id, accepted_at]
      properties:
        capture_id: { type: string, format: uuid }
        kind: { type: string }
        session_id: { type: string, format: uuid }
        accepted_at: { type: string, format: date-time }
    Capture:
      type: object
      description: "One capture result — the stored diag.* trace event's payload plus its timestamp. Bounded by construction: compressed_bytes never exceeds the capture's byte budget."
      required: [capture_id, kind, ts_unix_ms, encoding, content_type, bytes, compressed_bytes, truncated, duration_ms]
      properties:
        capture_id: { type: string, format: uuid }
        kind: { type: string }
        ts_unix_ms: { type: integer, description: "Agent wall-clock at completion." }
        encoding: { type: string, enum: [gzip+base64, json], description: "gzip+base64 puts the payload in `data`; json puts it in `json`." }
        content_type: { type: string, description: "What the decoded bytes are, e.g. text/vnd.graphviz or application/json." }
        data: { type: string, description: "base64 of the gzip stream. Present when encoding = gzip+base64." }
        json: { type: object, additionalProperties: true, description: "The result object. Present when encoding = json." }
        bytes: { type: integer, description: "Uncompressed size AFTER any truncation." }
        compressed_bytes: { type: integer }
        original_bytes: { type: integer, description: "Uncompressed size BEFORE truncation." }
        truncated: { type: boolean, description: "True when the budget forced a line-boundary cut; original_bytes then says how much was there." }
        duration_ms: { type: integer, description: "arm to done." }
        error: { type: string, description: "Set only when the capture was accepted and then failed. The event is still emitted, so a poller always terminates on a body." }
    DiagnosticBundle:
      type: object
      description: "GET /v1/admin/sessions/{id}/diagnostic-bundle response shape (ST-06/ST-07)."
      properties:
        trace:
          type: object
          properties:
            session_id: { type: string, format: uuid }
            host_id: { type: string, format: uuid }
            profile_id: { type: string }
            started_at: { type: string, format: date-time }
            ended_at: { type: [string, "null"], format: date-time }
        window:
          type: object
          properties:
            from_ms: { type: integer }
            to_ms: { type: integer }
        clock:
          oneOf:
            - type: object
              properties:
                client_offset_ms: { type: number }
                uncertainty_ms: { type: number }
                measured_at: { type: string, format: date-time }
            - type: object
              properties:
                unmeasured: { type: boolean, enum: [true] }
        series:
          type: object
          description: "Named metric series; keys include encoder.encode_ms, encoder.fps, abr.setpoint_kbps, transport.rtt_ms, transport.packets_lost, client.present_interval_sd_ms, the present-cadence series client.present_fps_median / client.present_interval_median_ms / client.present_interval_max_ms / client.present_beat_fraction / client.present_long_frames / client.present_n (absent for sessions from clients predating them), client.rvfc_capture_time_available, and the qualified pair client.rvfc_capture_to_display_ms / client.glass_to_glass_ms. client.present_fps remains a MEAN and is kept for continuity; client.present_fps_median is the one to read. client.glass_to_glass_ms is deprecated in favour of client.rvfc_capture_to_display_ms, which names what is measured (RTP capture-time to browser present) rather than overclaiming glass-to-glass; both carry the same value this release. Unmarked historical glass_to_glass values are omitted. THE FIELD DICTIONARY OF RECORD for every series name and raw key — its unit, clock, window, estimator and sample-count key — is `docs/session-trace/metrics.json` in the quasar repo (the metric manifest); the taxonomy, the browser ingest allow-list and the trace-format table are all derived from it."
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TraceSeriesPoint" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
        derived_windows:
          type: object
          properties:
            hitches:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  present_interval_sd_ms: { type: number }
            abr_downshifts:
              type: array
              items:
                type: object
                properties:
                  ts_unix_ms: { type: integer }
                  from_kbps: { type: integer }
                  to_kbps: { type: integer }
            encoder_saturation:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  encode_ms_p95: { type: number }
            likely_network_congestion:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  packets_lost_delta: { type: integer }
                  rtt_ms_p95: { type: number }
        classifier: { $ref: "#/components/schemas/Verdict" }
        ingest:
          type: object
          description: "Per-session ingest rejection counters (in-memory, admin-read-only). A client sample or trace event whose ts_unix_ms is not plausibly a Unix-epoch-ms stamp is dropped at ingest rather than stored where it would silently vanish outside every read window. Absent or zeroed when nothing was rejected; the batch itself still returns 202."
          required: [rejected_ts]
          properties:
            rejected_ts: { type: integer, description: "Client samples + trace events dropped for an implausible ts_unix_ms since this control plane last started." }
            last_rejected_ts_unix_ms: { type: integer, description: "The offending value, verbatim." }
            last_rejected_reason: { type: string, description: "The likely domain of the offending value, e.g. \"looks like seconds\"." }
        captures:
          type: array
          description: "session-capture: every capture belonging to this session, REGARDLESS of the bundle's window (captures are sparse, explicitly requested, and exempt from the rolling trace prune). Always present; empty when there are none."
          items: { $ref: "#/components/schemas/Capture" }

    # ─── storage (P5-05) ─────────────────────────────────────────────────────────
    AdminHome:
      type: object
      description: "One managed-home row from GET /v1/admin/storage/homes (storage/handler.go homeResp)."
      required: [id, user_id, app_id, host_id, username, app_name, host_name, provider, ref, bytes_used, created_at, last_used_at, gc_after]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, "null"], format: uuid, description: "Null when the user was deleted and the row is orphaned pending GC." }
        app_id: { type: [string, "null"], format: uuid, description: "Null when the app was deleted and the row is orphaned pending GC." }
        host_id: { type: [string, "null"], format: uuid }
        username: { type: [string, "null"], description: "users.username for user_id — display only. Null when user_id is null (the home outlived its user); the row still appears so its bytes stay accounted for." }
        app_name: { type: [string, "null"], description: "apps.name for app_id — display only. Null when app_id is null (the home outlived its app); the row still appears so its bytes stay accounted for." }
        host_name: { type: [string, "null"], description: "hosts.node_name for host_id — display only. Null when host_id is null or the host row is gone." }
        provider: { type: string }
        ref: { type: string }
        bytes_used: { type: integer }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        gc_after: { type: [string, "null"], format: date-time, description: "Non-null means a GC tombstone has been set." }
    AdminHomesResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminHome" }
        next_cursor: { type: [string, "null"] }
    MyStorageItem:
      type: object
      description: "One row from GET /v1/me/storage (storage.MyStorageItem)."
      required: [app_id, app_name, bytes_used, last_used_at]
      properties:
        app_id: { type: string, format: uuid }
        app_name: { type: string }
        bytes_used: { type: integer }
        last_used_at: { type: [string, "null"], format: date-time }
    MyStorageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MyStorageItem" }

    # ─── session telemetry / trace ingest (request bodies) ───────────────────────
    StatsRequest:
      type: object
      description: "POST /v1/sessions/{id}/stats body (metrics_handler.go). `metrics` is filtered to the BrowserMetrics dictionary at ingest."
      required: [samples]
      properties:
        client:
          type: string
          enum: [browser, native]
          description: "Optional reporter discriminator (P9-07). Absent ⇒ browser. Any other value is rejected, not coerced."
        samples:
          type: array
          items:
            type: object
            required: [ts_unix_ms, metrics]
            properties:
              ts_unix_ms: { type: integer }
              metrics: { $ref: "#/components/schemas/BrowserMetrics" }
              client_health:
                type: string
                enum: [smooth, decode_degrading, presentation_degrading, backgrounded_or_hidden, client_unsupported]
                description: "AS10-11: browser-classified client health (sibling of the numeric metrics dict)."
              client_health_reason: { type: string }
              device_key: { type: string }
              codec_mime_type:
                type: string
                description: >-
                  UI-P6 (additive): the getStats() codec mimeType the receiver reports it is
                  actually decoding, e.g. "video/H264". A sibling STRING field, not a metrics
                  dictionary key (the dictionary is numeric). Normalised server-side to the wire
                  codec vocabulary and recorded on the session as negotiated_codec; an
                  unparseable value is dropped and the POST still returns 202.
    TraceEventsRequest:
      type: object
      description: "POST /v1/sessions/{id}/trace/events body (ST-04). Events with unknown types are dropped at ingest."
      required: [events]
      properties:
        client: { type: string, enum: [browser, native], description: "Optional reporter discriminator (P9-01). Absent ⇒ browser." }
        events:
          type: array
          maxItems: 64
          items:
            type: object
            required: [ts_unix_ms, type]
            properties:
              ts_unix_ms: { type: integer }
              type: { type: string, enum: [playout.changed, client.freeze_detected, client.visibility_changed, webrtc.state_changed, bench.window] }
              payload: { type: object, additionalProperties: true }
    TraceClockRequest:
      type: object
      description: "POST /v1/sessions/{id}/trace/clock body (ST-05). Both values required + finite; uncertainty non-negative."
      required: [client_offset_ms, uncertainty_ms]
      properties:
        client_offset_ms: { type: number }
        uncertainty_ms: { type: number }

    # ─── admin trace reads (response bodies) ─────────────────────────────────────
    TraceWindow:
      type: object
      required: [from_ms, to_ms]
      properties:
        from_ms: { type: integer }
        to_ms: { type: integer }
    TraceClock:
      description: "Either the measured client↔host clock offset, or {unmeasured:true} — never an offset-0 default (trace-format.md §4)."
      oneOf:
        - type: object
          required: [client_offset_ms, uncertainty_ms, measured_at]
          properties:
            client_offset_ms: { type: number }
            uncertainty_ms: { type: number }
            measured_at: { type: string, format: date-time }
        - type: object
          required: [unmeasured]
          properties:
            unmeasured: { type: boolean, enum: [true] }
    TraceSeries:
      type: object
      description: "Named metric series keyed by taxonomy name; each value is an array of {ts_unix_ms, v} points."
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/TraceSeriesPoint" }
    TraceResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace and /trace/window (diagnostic_handler.go handleAdminTrace)."
      required: [session_id, window, clock, series, events]
      properties:
        session_id: { type: string, format: uuid }
        window: { $ref: "#/components/schemas/TraceWindow" }
        clock: { $ref: "#/components/schemas/TraceClock" }
        series: { $ref: "#/components/schemas/TraceSeries" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
    TraceMetricsResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace/metrics — only the requested named series."
      required: [window, series]
      properties:
        window: { $ref: "#/components/schemas/TraceWindow" }
        series: { $ref: "#/components/schemas/TraceSeries" }
    TraceEventsResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace/events — only the requested event types."
      required: [window, events]
      properties:
        window: { $ref: "#/components/schemas/TraceWindow" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
    TraceAnnotationRequest:
      type: object
      description: "POST /v1/admin/sessions/{id}/trace/annotations body (§B.4)."
      required: [label]
      properties:
        ts_unix_ms: { type: integer, description: "Optional; defaults to now." }
        label: { type: string }
        tags: { type: array, items: { type: string } }
    TraceAnnotationCreated:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    # ─── encoder certification (SPT-06 / cert_handler.go) ────────────────────────
    CertRow:
      type: object
      description: "One certification verdict row (cert_handler.go certRowResp)."
      required: [id, gpu_index, encoder, profile_id, stream_profile_id, width, height, fps, bitrate_kbps, verdict, encode_ms_p50, encode_ms_p95, encode_ms_max, output_fps, drop_rate, live_write_stable, sample_window_ms, sample_count, measured_at]
      properties:
        id: { type: string, format: uuid }
        gpu_index: { type: integer }
        encoder: { type: string, description: "Encode backend family (va|nvenc|openh264|vulkan) — NOT the codec." }
        profile_id: { type: string, description: "Launch profile the bench ran under (context, not key)." }
        stream_profile_id: { type: string, description: "The certified RUNG — the key dimension since migration 0041." }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate_kbps: { type: integer }
        verdict: { type: string }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        output_fps: { type: number }
        drop_rate: { type: number }
        live_write_stable: { type: boolean }
        sample_window_ms: { type: integer }
        sample_count: { type: integer }
        agent_version: { type: string }
        measured_at: { type: string, format: date-time }
    CertVerdicts:
      type: object
      description: "GET /v1/admin/hosts/{id}/encoder-certification (cert_handler.go certResp)."
      required: [host_id, certifications]
      properties:
        host_id: { type: string, format: uuid }
        certifications:
          type: array
          items: { $ref: "#/components/schemas/CertRow" }
    CertRunRequest:
      type: object
      description: "POST .../encoder-certification/runs body (cert_handler.go certRunReq)."
      properties:
        gpu_index: { type: integer }
        encoder: { type: string }
        profiles:
          type: array
          description: "Launch-profile ids; each is expanded into its rungs (migration 0041). A rung id may be named directly. Unknown ids are skipped."
          items: { type: string }
        bitrates_kbps: { type: array, items: { type: integer } }
    CertCellPlan:
      type: object
      description: "One planned bench cell: a RUNG x bitrate point (migration 0041)."
      required: [profile_id, stream_profile_id, codec, bitrate_kbps]
      properties:
        profile_id: { type: string, description: "Launch profile the rung belongs to." }
        stream_profile_id: { type: string, description: "The rung to certify; pass this to /cells and /finalize." }
        codec: { type: string, enum: [h264, h265, av1] }
        bitrate_kbps: { type: integer }
    CertRun:
      type: object
      description: "POST .../encoder-certification/runs response (cert_handler.go certRunResp)."
      required: [run_id, host_id, status, started_at, total_pts, encoder, gpu_index, cells]
      properties:
        run_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        status: { type: string }
        started_at: { type: string, format: date-time }
        total_pts: { type: integer }
        encoder: { type: string }
        gpu_index: { type: integer }
        cells:
          type: array
          items: { $ref: "#/components/schemas/CertCellPlan" }
    CertRunStatus:
      type: object
      description: "GET .../runs/{run_id} + POST .../runs/{run_id}/complete (cert_handler.go certRunStatusResp)."
      required: [run_id, host_id, status, started_at, completed_pts, total_pts, summary_ok, summary_capped, summary_unsafe]
      properties:
        run_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        status: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        error_message: { type: [string, "null"] }
        completed_pts: { type: integer }
        total_pts: { type: integer }
        summary_ok: { type: integer }
        summary_capped: { type: integer }
        summary_unsafe: { type: integer }
    CertCellRequest:
      type: object
      description: "POST .../encoder-certification/cells body (cert_handler.go certCellReq). One of stream_profile_id or profile_id is required."
      required: [gpu_index, encoder, bitrate_kbps]
      properties:
        gpu_index: { type: integer }
        encoder: { type: string }
        profile_id: { type: string, description: "Launch profile; on its own it resolves that chain's first h264 rung." }
        stream_profile_id: { type: string, description: "The RUNG to certify (preferred since migration 0041)." }
        bitrate_kbps: { type: integer }
    CertCell:
      type: object
      description: "POST .../encoder-certification/cells response (cert_handler.go certCellResp)."
      required: [session_id, host_id, profile_id, stream_profile_id, codec, bitrate_kbps, width, height, fps, budget_ms, signaling_url, signaling_token]
      properties:
        session_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        profile_id: { type: string }
        stream_profile_id: { type: string }
        codec: { type: string, enum: [h264, h265, av1], description: "The codec the bench session streams — what the verdict will be filed under." }
        bitrate_kbps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        budget_ms: { type: number }
        signaling_url: { type: string }
        signaling_token: { type: string }
    CertFinalize:
      type: object
      description: "POST .../encoder-certification/cells/{session_id}/finalize (cert_handler.go certFinalizeResp)."
      required: [session_id, profile_id, stream_profile_id, codec, bitrate_kbps, verdict, encode_ms_p50, encode_ms_p95, encode_ms_max, output_fps, drop_rate, live_write_stable, sample_count]
      properties:
        session_id: { type: string, format: uuid }
        profile_id: { type: string }
        stream_profile_id: { type: string }
        codec: { type: string, enum: [h264, h265, av1] }
        bitrate_kbps: { type: integer }
        verdict: { type: string }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        output_fps: { type: number }
        drop_rate: { type: number }
        live_write_stable: { type: boolean }
        sample_count: { type: integer }

    # ─── agent-internal storage GC (storage/agent_gc.go) ─────────────────────────
    PendingHome:
      type: object
      description: "One reapable backing store scoped to the calling agent's host (storage.PendingHome)."
      required: [id, provider, ref]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, description: "'volume' | 'local'." }
        ref: { type: string, description: "Docker volume name or absolute host path." }
    GCPendingResponse:
      type: object
      required: [homes]
      properties:
        homes:
          type: array
          items: { $ref: "#/components/schemas/PendingHome" }
    GCConfirmRequest:
      type: object
      required: [home_ids]
      properties:
        home_ids:
          type: array
          items: { type: string, format: uuid }
    GCConfirmResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: "Count of hard-deleted home rows." }

    # ─── library discovery (Steam library discovery Phase 4, internal/library) ──
    LibraryScanTask:
      type: object
      description: >-
        One scan job, exactly as it goes on the wire. NOTE WHAT IS ABSENT: no user id, no username,
        no user-derived field. root_path is an opaque home directory and which person it belongs to
        is resolved control-plane-side on receipt of the report and never leaves that process. This
        is agent-api.md's P2-01 verdict - per-user concerns never reach the agent - honoured
        literally, and it is a GUARANTEE OF THE INTERFACE rather than a property of the current
        implementation.
      required: [scan_id, root_path, relative_roots, max_entries, max_manifest_bytes]
      properties:
        scan_id: { type: string, format: uuid, description: "The only handle the agent ever holds." }
        root_path:
          type: string
          description: >-
            The absolute host path of the user's managed home. Control-plane-supplied, so the agent
            VALIDATES CONTAINMENT against its own configured homes root before walking it: a path
            outside that root is refused and reported as an error, never walked. The agent does not
            trust the control plane with a filesystem path any more than it would trust a client.
        relative_roots:
          type: array
          items: { type: string }
          description: >-
            In-home paths to glob for appmanifest_*.acf, today the flatpak/deb
            (.local/share/Steam/steamapps) and classic (.steam/steam/steamapps) layouts, which are
            usually symlinks to each other and are de-duplicated by resolved path. libraryfolders.vdf
            is deliberately NOT consulted: it records CONTAINER-side paths, meaningless to a
            host-side scanner, so translating it would be guesswork - libraries on other disks are
            an accepted limitation instead.
        max_entries: { type: integer, description: "Cap on manifests per scan (512 today)." }
        max_manifest_bytes:
          type: integer
          format: int64
          description: >-
            Per-file read cap (1 MiB today). Both bounds are CONTROL-PLANE-OWNED rather than agent
            constants, so they can be tightened without an agent release.
    LibraryScanPendingResponse:
      type: object
      required: [scans]
      properties:
        scans:
          type: array
          items: { $ref: "#/components/schemas/LibraryScanTask" }
          description: "Empty is the steady state, and is also the answer when discovery is switched off."
    LibraryScanReportEntry:
      type: object
      description: >-
        One parsed appmanifest_*.acf. THE FIELD SET IS THE PII CONTAINMENT MECHANISM, not a
        convenience. Every manifest carries LastOwner, a SteamID64 - a persistent, globally unique,
        externally resolvable identifier for a real person's Steam account. The agent parses with a
        key ALLOW-LIST (appid, name, installdir, SizeOnDisk, StateFlags) and NEVER a denylist,
        because Steam adds keys over time and a denylist leaks every future key by default; and this
        shape has exactly those five fields, so THERE IS NOWHERE FOR A SIXTH VALUE TO TRAVEL even if
        the parser were wrong. Widening either the allow-list or this shape is the change that
        sentence exists to make someone stop and think about.
      required: [external_id, name]
      properties:
        external_id:
          type: string
          pattern: "^[1-9][0-9]{0,9}$"
          description: >-
            The Steam appid. Validated at FOUR independent points - agent parse, control-plane
            ingest (plus a bound below 2^32), the database CHECK, and the launch-time flag composer
            - because the value is written by an automated job and read by a shell-adjacent consumer
            (STEAM_STARTUP_FLAGS is word-split by `read -r -a`), and because only the CHECK survives
            a later admin edit. An entry failing ingest validation is REJECTED WHILE THE REST OF THE
            REPORT IS STILL PROCESSED: one malformed manifest must not cost a user their library.
        name:
          type: string
          description: >-
            The manifest title. Retained deliberately, and its importance went UP rather than down:
            it is the tile title AND half of the denylist key (which matches on appid OR name
            prefix), so it is load-bearing for correctness. It is a game title, not a person.
        install_dir:
          type: string
          description: >-
            COLLECTED AND NOT USED. It existed to feed launch verification, which operator decision
            3 dropped, and it has had no consumer since. It stays because narrowing a PII containment
            allow-list buys nothing while widening it later means re-touching the one piece of code
            whose job is to touch as little of the manifest as possible. Do not assume it is
            populated for some other purpose.
        size_on_disk:
          type: integer
          format: int64
          description: "COLLECTED AND NOT USED - never consumed by anything in this feature. Kept for the same reason as install_dir."
        state_flags:
          type: integer
          format: int64
          description: >-
            Unread, and the live capture is why: it was 4 for all five Valve tools on the reference
            box AND for three of the four real games. NO STRUCTURAL FIELD DISTINGUISHES A TOOL FROM
            A GAME, which is exactly why filtering is on appid and name instead. Nothing branches on
            this.
    LibraryScanReport:
      type: object
      required: [scan_id, ok]
      properties:
        scan_id: { type: string, format: uuid }
        ok:
          type: boolean
          description: >-
            false reports a failure - a refused path, no configured home root, a walk that could not
            complete. A FAILED SCAN CHANGES NOTHING BUT ITS OWN ROW: revocation is driven by ABSENCE,
            and absence is exactly what a transient error looks like, so "reconcile whatever entries
            did arrive" would make a partial walk indistinguishable from an uninstall.
        error: { type: string, description: "Failure text on ok:false. Omitted when empty; truncated server-side." }
        entries:
          type: array
          items: { $ref: "#/components/schemas/LibraryScanReportEntry" }
          description: >-
            Omitted when empty. An absent entries on an ok:true report is a legitimate "this user has
            nothing installed" and is reconciled as such - which is how an uninstall of the last game
            is recognised.
    LibraryScanAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    LibraryRule:
      type: object
      description: >-
        One operator-written layer-2 rule. Layer 1 is a shipped code constant (an appid set plus
        case-insensitive Valve tool name prefixes) and UPDATING IT IS A CODE CHANGE AND A RELEASE -
        which is exactly why this layer exists, because an operator cannot wait for one.
      required: [external_source, external_id, rule, note, created_by, created_at]
      properties:
        external_source: { type: string, enum: [steam] }
        external_id: { type: string, pattern: "^[1-9][0-9]{0,9}$" }
        rule: { $ref: "#/components/schemas/LibraryRuleValue" }
        note: { type: string, description: "Why, for the next operator. Truncated at 512 characters." }
        created_by:
          type: [string, "null"]
          format: uuid
          description: >-
            The acting admin, resolved server-side from the bearer identity. NULL once that account
            is deleted (ON DELETE SET NULL, not CASCADE) - deleting the operator who wrote a rule
            must not silently un-suppress every appid they ignored.
        created_at: { type: string, format: date-time, description: "Set, and re-set on a replace." }
    LibraryRuleValue:
      type: string
      description: >-
        'ignore' suppresses an appid the built-in denylist does not know about; 'allow'
        un-suppresses a game it wrongly caught, and OUTRANKS the built-in list - rung 1 of the
        ladder sits above rung 3.
      enum: [ignore, allow]
    LibraryRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryRule" }
    LibraryRuleWrite:
      type: object
      required: [rule]
      properties:
        rule: { $ref: "#/components/schemas/LibraryRuleValue" }
        note: { type: string, description: "Optional. Truncated at 512 characters." }
        external_source:
          type: string
          enum: [steam]
          description: >-
            Optional, defaults to 'steam'; any other value is 400 validation_failed. The vocabulary
            is provider-shaped so Heroic or RomM slot in later with no re-model, but only 'steam'
            exists today.
    LibraryRuleSetResult:
      type: object
      description: >-
        NOTE THE SHAPE ASYMMETRY, which is real and is recorded rather than smoothed over: `rule` on
        the REQUEST is the two-value string, and `rule` here is the whole stored rule object (whose
        own `rule` field is that string).
      required: [rule, disabled, revoked]
      properties:
        rule: { $ref: "#/components/schemas/LibraryRule" }
        disabled:
          type: boolean
          description: >-
            Whether this call disabled a tile. Always false for an 'allow', which by design changes
            nothing but the rule row - it does NOT re-enable an existing disabled tile, because that
            tile may have been disabled by hand for a reason unrelated to discovery; the next scan
            republishes the appid through the ladder instead.
        revoked:
          type: integer
          description: >-
            Provider entitlements removed by this call - FLEET-WIDE, because an Ignore is a fleet
            decision and a half-revoke would leave the tile live for everyone who happens not to be
            scanned next. granted_by='admin' rows are never touched.
    LibraryUnpublished:
      type: object
      description: "One observed appid under this provider app that has no ENABLED tile."
      required: [external_source, external_id, name, suppressed_by, users, last_seen_at, has_tile]
      properties:
        external_source: { type: string, enum: [steam] }
        external_id: { type: string, pattern: "^[1-9][0-9]{0,9}$" }
        name:
          type: string
          description: >-
            One of the observed names. They can diverge across users (a torn read, a localised
            client); the row is a HANDLE FOR AN ADMIN ACTION, not a catalogue entry, so the choice is
            arbitrary but deterministic.
        suppressed_by: { $ref: "#/components/schemas/LibrarySuppressedBy" }
        users: { type: integer, description: "Distinct accounts observed with it installed." }
        last_seen_at: { type: string, format: date-time }
        has_tile:
          type: boolean
          description: >-
            Distinguishes "a disabled tile exists" from "nothing was ever created" - the difference
            between an Ignore that took effect and an appid nothing has published yet. Both are
            recoverable; only the first has favourites and artwork to preserve, which is precisely
            why suppression is a hide and never a delete.
    LibrarySuppressedBy:
      type: string
      description: >-
        Which rung of the ladder is responsible. 'other' IS DELIBERATE HONESTY RATHER THAN A GAP: it
        means rungs 1-4 WOULD have published this appid and yet no enabled tile exists, and exactly
        two things reach that state, NEITHER OF THEM KNOWABLE FROM THE DATABASE - the opt-in
        appdetails lookup suppressed it during a scan, or an admin disabled the tile by hand.
        Guessing between them would be worse than saying so, and an admin who sees 'other' and
        writes an 'allow' rule gets the right outcome in the first case and no change in the second.
      enum: [rule_ignore, builtin_appid, builtin_prefix, appdetails, other]
    LibraryUnpublishedList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryUnpublished" }
    LibraryScanCounts:
      type: object
      required: [pending, claimed, reported, failed]
      properties:
        pending: { type: integer }
        claimed: { type: integer, description: "A claim older than 30 minutes is reaped back to pending - the only recovery for an agent that died mid-walk." }
        reported: { type: integer, description: "Reported AND reconciled: those commit in one transaction, so there is no third state." }
        failed: { type: integer }
    LibraryStatus:
      type: object
      required: [enabled, storage_provider, scan_interval_secs, appdetails_lookup, interval_overridden_by_env, appdetails_overridden_by_env, last_scan_completed_at, recent_scans, inert_reason, scans]
      properties:
        interval_overridden_by_env:
          type: boolean
          description: >-
            Admin-libraries amendment (2026-08-01). True when QUASAR_LIBRARY_SCAN_INTERVAL is set
            in the environment, so scan_interval_secs resolved from it rather than from
            instance_settings.library_discovery_interval_minutes. A UI should grey its interval
            control and say the environment pinned it.
        appdetails_overridden_by_env:
          type: boolean
          description: >-
            Admin-libraries amendment (2026-08-01). True when QUASAR_STEAM_APPDETAILS_LOOKUP is
            set in the environment; appdetails_lookup then reports the env value, not the
            database column. Same UI treatment as interval_overridden_by_env.
        last_scan_completed_at:
          type: [string, "null"]
          format: date-time
          description: >-
            Admin-libraries amendment (2026-08-01). When the most recent scan finished (any
            terminal outcome), or null when no scan has ever completed - the one-glance
            "is discovery actually doing anything" companion to the counters.
        recent_scans:
          type: array
          maxItems: 20
          description: >-
            Scan-observability amendment (2026-08-01, same-day follow-on). The last 20 TERMINAL
            scans (reported or failed), newest first, each with its stored outcome counts - the
            validation surface the log line used to be the only copy of. Under auto-publish the
            only observable signal of a working scan was tiles appearing; an operator whose
            library is already fully published pressed "Scan now" and could not tell it from a
            no-op. Counts are STORED AT RECONCILE (migration 0048) - scans reported before 0048
            display zeros, which the UI should present as "not recorded", not as "nothing
            happened". `backfilled` counts existing tiles whose missing data (description,
            initially) a scan filled in - see the backfill paragraph on the scan-report route:
            a backfill FILLS BLANKS AND NEVER OVERWRITES a non-empty field, so an operator edit
            is never clobbered by a scan.
          items:
            type: object
            required: [user, host, state, completed_at, observed, suppressed, created, disabled, granted, revoked, rejected, backfilled, error]
            properties:
              user: { type: string, description: "Username of the scanned home's owner." }
              host: { type: string, description: "node_name of the host that ran the walk." }
              state: { type: string, enum: [reported, failed] }
              completed_at: { type: string, format: date-time }
              observed: { type: integer }
              suppressed: { type: integer }
              created: { type: integer }
              disabled: { type: integer }
              granted: { type: integer }
              revoked: { type: integer }
              rejected: { type: integer }
              backfilled: { type: integer }
              error: { type: string, description: "Empty for reported scans." }
        enabled: { type: boolean, description: "instance_settings.library_discovery_enabled - the master switch and the only switch." }
        storage_provider: { $ref: "#/components/schemas/StorageProvider" }
        scan_interval_secs:
          type: number
          description: >-
            The RESOLVED scan interval in seconds, so an operator can see what their setting
            actually became. Admin-libraries amendment (2026-08-01): resolution is
            instance_settings.library_discovery_interval_minutes (default 360 = 21600s) unless
            QUASAR_LIBRARY_SCAN_INTERVAL is set, in which case the env var wins - including its
            unchanged 0 semantics: 0 disables discovery ENTIRELY regardless of the database
            flag, the kill switch that lets an operator guarantee no scan and no third-party
            call without database access.
        appdetails_lookup:
          type: boolean
          description: >-
            The RESOLVED third-party appdetails switch, DEFAULT OFF. Rung 5 of the ladder. IT
            DISCLOSES TO A THIRD PARTY EXACTLY WHICH STEAM APPIDS THIS INSTANCE HAS INSTALLED -
            the same privacy class as artwork hotlinking, which was rejected for the same reason
            - which is why it is an operator's decision and never a default. Admin-libraries
            amendment (2026-08-01): resolution is
            instance_settings.library_discovery_appdetails_enabled unless
            QUASAR_STEAM_APPDETAILS_LOOKUP is set, in which case the env var wins. Contained so
            that enabling it cannot override a rule an admin wrote, and bounded per scan.
        inert_reason:
          type: string
          description: >-
            "" when discovery is live; otherwise why it is doing nothing. THIS FIELD IS THE REASON
            THE ENDPOINT EXISTS: under auto-publish the only observable signal of a working scan is
            tiles appearing, so "nothing appeared" and "nothing ran" are indistinguishable to an
            operator otherwise - and leaving them to conclude from an unchanged library that nobody
            has any games installed is the failure this closes. FOUR REASONS, REPORTED IN THIS
            ORDER: the library_discovery_enabled switch is off; QUASAR_LIBRARY_SCAN_INTERVAL is 0;
            the instance storage provider is 'volume'; or NO APP IS MARKED AS A LIBRARY PROVIDER
            (library_provider='steam'), so the eligibility query joins against nothing. The fourth
            is the first-run state - an operator flips the toggle before marking the app - and it is
            reported LAST because the three above it are instance-level facts that make the provider
            question moot: telling someone who has the feature switched off that they also have no
            provider app would send them configuring an app for nothing. It is a REASON AND NOT A
            GATE: enqueue behaviour is unchanged and zero eligible triples remains a normal outcome.
            CLIENTS MUST NOT PARSE THIS STRING - it is human-readable prose rendered verbatim, the
            set will grow, and only its presence is contractual. The message names the remedy (set
            Library provider to Steam in the app editor's Identity section), because an operator told
            only that discovery is inert is barely better off than one told nothing.
        scans: { $ref: "#/components/schemas/LibraryScanCounts" }
    LibraryForceScanRequest:
      type: object
      description: >-
        The optional scope for a force scan. EVERY FIELD IS OPTIONAL AND AN EMPTY BODY IS VALID,
        meaning "everything, now" - the common case, and what the admin UI's button sends. An absent
        body is not an error; only malformed JSON is.
      properties:
        app_id:
          type: string
          format: uuid
          description: >-
            Narrow to one LIBRARY-PROVIDER app. A real app that is not a library provider is 400
            validation_failed - the same rule the four /v1/admin/apps/{id}/library/* routes apply,
            reused rather than given a second vocabulary, because it is the same operator mistake: a
            scope naming an app the reconciler will never read can only ever produce a bare zero. An
            app id that does not exist at all is 404 - the app being REAL is what makes the other one
            a 400. A malformed uuid is also 400 (a format guard at the handler, so it is never a
            Postgres 22P02 surfacing as a 500).
        user_id:
          type: string
          format: uuid
          description: "Narrow to one user. Malformed uuid is 400."
    LibraryForceScanResult:
      type: object
      description: >-
        What one force scan actually did. THERE IS NO PATH THROUGH THIS ENDPOINT THAT RETURNS A BARE
        ZERO: either work was queued, or something already had it queued, or inert_reason says why
        not. Under auto-publish silence is indistinguishable from success, which is the same
        ambiguity GET /v1/admin/library/status exists to close.
      required: [queued, skipped, eligible, inert_reason]
      properties:
        queued:
          type: integer
          description: "'pending' library_scans rows actually inserted by this call."
        skipped:
          type: integer
          description: >-
            Triples that already had an OPEN scan (pending or claimed). NOT AN ERROR COUNT:
            library_scans_open_uk is partial on those two states, so "already queued" is the CORRECT
            answer to "scan now", not a failure. Enqueue is ON CONFLICT DO NOTHING, which is what
            makes a double-press idempotent - no duplicates, no 409, no 500.
        eligible:
          type: integer
          description: >-
            queued + skipped: the (user, library-provider app, host) triples this request matched AT
            ALL. THIS IS THE NON-OBVIOUS FIELD AND IT IS WHY IT EXISTS - two zeros mean opposite
            things. queued:0 with eligible>0 means "everything is already queued, wait for the agent
            to claim it"; queued:0 with eligible:0 means "your scope matched nothing, fix the scope".
            One says do nothing, the other says do something, and without this field a client cannot
            tell them apart.
        inert_reason:
          type: string
          description: >-
            "" when the call could do work; otherwise why it could not - the switch is off,
            QUASAR_LIBRARY_SCAN_INTERVAL is 0, the instance storage provider is 'volume', or no app
            is marked as a library provider (library_provider='steam'), which is the first-run state
            and is answered LAST of the four for the reason LibraryStatus.inert_reason gives. AN
            INERT INSTANCE IS THIS 200 AND NOT A 4xx, mirroring GET /v1/admin/library/status so a
            client has one code path; the two surfaces share one server-side helper so their wording
            cannot drift, and the janitor logs the same reason once rather than every six hours. An
            eligible:0 result also carries a reason here - naming the eligibility rule that matched
            nothing - rather than a silent zero; that fifth reason is route-specific ("your scope
            matched nothing") and is only reached once none of the four instance-level ones applies.
            CLIENTS MUST NOT PARSE THIS STRING; only its presence is contractual.

    # ─── background jobs (jobs framework, 2026-08-12; migration 0066) ────────────
    JobPlane:
      type: string
      description: >-
        WHERE the job's work executes. 'control' runs in the control-plane process; 'agent' is
        claimed over the /v1/agent/jobs/* pull channel and executed by a node agent. It is not
        a hint - it decides which of the two dispatch paths ever sees the run.
      enum: [control, agent]
    JobScope:
      type: string
      description: >-
        WHAT a run is about. 'instance' = one run for the whole deployment (its job_runs rows
        carry no host_id). 'host' = one INDEPENDENT run per host, which is why a host-scoped
        job reports `targets[]` instead of top-level run state: "last run" is not a single
        fact about the job, it is a fact about the job ON A HOST.
      enum: [instance, host]
    JobScheduleKind:
      type: string
      description: >-
        'interval' fires every interval_secs measured from the END of the previous run
        (timer-reset-after-pass, so overlap is impossible by construction rather than
        unlikely). 'event' never fires on a clock - a run row is created by an explicit
        trigger - which is how event-driven work is represented WITHOUT pretending it is
        periodic, while still showing last-run and result. 'manual' only ever runs from an
        admin trigger.
      enum: [interval, event, manual]
    JobRunState:
      type: string
      description: >-
        The run lifecycle: pending -> running -> one terminal state. 'deferred' means the job's
        OWN gate refused (a host with live sessions, say) - an outcome, not an error, and the
        dispatcher schedules the retry on a persisted backoff ladder. 'skipped' means there was
        nothing to do. 'aborted' is the claim-timeout reaper's verdict on a run nobody reported;
        it is the one state an agent may never report about itself.
      enum: [pending, running, succeeded, failed, deferred, skipped, aborted]
    JobRunTrigger:
      type: string
      description: "What created the run row: the schedule, an admin's Run now, or an explicit event."
      enum: [schedule, manual, event]
    JobSchedule:
      type: object
      description: >-
        The ADMIN-OWNED half of a job (the code-owned half is its identity), resolved exactly
        as the dispatcher resolves it - one implementation of "which source won", so the viewer
        and the scheduler cannot disagree about when a job will next run.
      required: [kind, interval_secs, window_start, window_end, window_days, timezone, locked, locked_by]
      properties:
        kind: { $ref: "#/components/schemas/JobScheduleKind" }
        interval_secs:
          type: [integer, "null"]
          description: >-
            Null for a non-interval schedule. Floor of 60 (a CHECK in the migration and a guard
            in the handler): a job that wants to run more often than once a minute is not a
            background job. When `locked` is true this is the ENVIRONMENT's value, not the
            stored one.
        window_start:
          type: [string, "null"]
          description: "HH:MM:SS in `timezone`, or null for 'any time'. Paired with window_end by a CHECK - both set or both null."
        window_end:
          type: [string, "null"]
          description: >-
            HH:MM:SS in `timezone`, or null. A window that WRAPS MIDNIGHT (22:00 -> 04:00) is
            legal and normal. The window governs STARTING a run and never stopping one: a run
            in flight when the window closes is not killed, because killing a half-finished
            dedupe pass or a half-built template is worse than overrunning by minutes.
        window_days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: >-
            0 = Sunday .. 6 = Saturday (Go's time.Weekday). EMPTY MEANS EVERY DAY, and empty is
            what an unconstrained job reports - never null. A day constrains the instant the
            window OPENS, so a wrapping window on {5} runs Friday 22:00 -> Saturday 04:00.
        timezone:
          type: string
          description: >-
            IANA zone name; windows are evaluated in it. Intervals are NOT: an interval is a
            duration in absolute time and has no opinion about the clock on the wall, so a DST
            transition can shift when a windowed run lands but can never lengthen an interval.
        locked:
          type: boolean
          description: >-
            True when an environment variable is authoritative over this job's interval. The
            env override stays the winner (the pre-existing documented behaviour of knobs like
            QUASAR_LIBRARY_SCAN_INTERVAL); the API says so rather than silently accepting an
            edit the environment will overrule - a PATCH of interval_secs on a locked job is
            409 schedule_locked.
        locked_by:
          type: [string, "null"]
          description: "The environment variable that is in force, e.g. \"QUASAR_LIBRARY_SCAN_INTERVAL\". Null when not locked."
    JobRun:
      type: object
      description: "One record of one run - the shape that appears as `last_run` and as an item of the run-history page."
      required: [id, host_id, state, trigger, started_at, finished_at, duration_ms, summary, error]
      properties:
        id: { type: string, format: uuid }
        host_id: { type: [string, "null"], format: uuid, description: "Null for an instance-scoped job's run; the target host for a host-scoped one." }
        state: { $ref: "#/components/schemas/JobRunState" }
        trigger: { $ref: "#/components/schemas/JobRunTrigger" }
        started_at: { type: [string, "null"], format: date-time, description: "Null while the run is still pending (it has not started)." }
        finished_at: { type: [string, "null"], format: date-time }
        duration_ms: { type: [integer, "null"], format: int64, description: "Null until the run is finished; derived from started_at/finished_at rather than stored." }
        summary:
          type: object
          additionalProperties: true
          description: >-
            The runner's own per-job result blob - what it actually did, in its own vocabulary
            ({"apps_considered": 412, "artwork_resolved": 3}). OPAQUE TO THE FRAMEWORK, which
            never interprets it, and `{}` rather than null when a run reported nothing. Bounded
            at 4096 bytes by a CHECK; a summary that blows the bound fails the REPORT, never the
            run.
        error: { type: [string, "null"], description: "The failure text for a failed run; null otherwise." }
    JobTarget:
      type: object
      description: >-
        One host's independent run state for a MANAGED host-scoped job. Computed by the same
        code path as the instance-scoped top-level fields, so the two shapes cannot drift apart.
      required: [host_id, node_name, running, next_run_at, last_run]
      properties:
        host_id: { type: string, format: uuid }
        node_name: { type: string, description: "hosts.node_name - display only. An unresolved name renders as \"\" rather than failing the list: a stale host row must not break the whole page." }
        running: { type: boolean }
        next_run_at: { type: [string, "null"], format: date-time, description: "The open PENDING run's scheduled_for. Null when nothing is queued for this host." }
        last_run: { $ref: "#/components/schemas/JobRunOrNull" }
    JobRunOrNull:
      oneOf:
        - { $ref: "#/components/schemas/JobRun" }
        - { type: "null" }
      description: "The most recent TERMINAL run, or null when the job has never finished one on this target."
    Job:
      type: object
      description: >-
        One registered background job. The row is split by OWNERSHIP: identity (name,
        description, plane, scope, managed) is code-owned and reconciled at every boot, and the
        schedule is admin-owned and never overwritten by that reconcile - a boot that clobbered
        an operator's 02:00-06:00 window because a developer edited a literal would make the
        whole surface untrustworthy.
        THREE SHAPES, DISCRIMINATED BY `managed` AND `scope`. A managed instance-scoped job
        carries top-level running / next_run_at / last_run / consecutive_failures. A managed
        host-scoped job carries `targets` INSTEAD, one entry per host. An unmanaged job of
        either scope carries NEITHER, plus `unmanaged_note`.
        A run-derived field is OMITTED rather than sent as null when it does not apply or is
        not known (Go omitempty on a nil pointer); a client must read absent as null.
      required: [id, name, description, plane, scope, managed, enabled, schedule, history_limit]
      properties:
        id: { type: string, description: "The code-owned dotted identifier, e.g. \"artwork.sweep\". Also the URL path segment and the id in every log line." }
        name: { type: string, description: "Operator-facing display name, code-owned." }
        description: { type: string, description: "What this job does, code-owned. For an UNMANAGED job it is also the text of unmanaged_note." }
        plane: { $ref: "#/components/schemas/JobPlane" }
        scope: { $ref: "#/components/schemas/JobScope" }
        managed:
          type: boolean
          description: >-
            False = "listed but not adopted": background work that exists in code and runs on a
            hard-coded timer, shown here so an operator can SEE it, with no schedule, no run
            history and no Run-now. The list of unmanaged rows is therefore also the adoption
            backlog. Omitting them would reproduce the exact problem the Jobs page was built to
            fix - a page of six rows next to twelve invisible goroutines.
        enabled:
          type: boolean
          description: "The operator's kill switch, and it MEANS it: a disabled job never runs, not even from Run now (409 job_disabled)."
        schedule: { $ref: "#/components/schemas/JobSchedule" }
        running: { type: boolean, description: "MANAGED scope=instance only: an open run is currently in flight. Absent for a host-scoped or unmanaged job." }
        next_run_at: { type: [string, "null"], format: date-time, description: "MANAGED scope=instance only: the open PENDING run's scheduled_for. A pending row IS the next run - there is no denormalized next-run column to drift out of sync." }
        last_run: { $ref: "#/components/schemas/JobRunOrNull" }
        consecutive_failures:
          type: integer
          description: >-
            MANAGED scope=instance only: terminal `failed` runs since the last non-failed
            terminal outcome. DERIVED from history rather than stored, so it cannot drift from
            the rows it describes.
        targets:
          type: array
          items: { $ref: "#/components/schemas/JobTarget" }
          description: "MANAGED scope=host only: per-host run state, one entry per known host. Absent for an instance-scoped or unmanaged job."
        history_limit: { type: integer, minimum: 1, maximum: 500, description: "How many run rows this job retains (1..500)." }
        unmanaged_note:
          type: string
          description: >-
            UNMANAGED jobs only: a human sentence naming the file that hard-codes this work and
            saying no history is recorded. Authored in ONE place (the registry Definition's
            description) rather than duplicated as a second field.
    JobsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: [string, "null"] }
    JobRunsResponse:
      type: object
      description: "GET /v1/admin/jobs/{job_id}/runs - bounded history, newest first."
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobRun" }
        next_cursor: { type: [string, "null"] }
    JobPatchRequest:
      type: object
      description: >-
        Every field optional; an absent field is left alone. AN UNKNOWN KEY IS A 400, not a
        silent ignore. `window_start` and `window_end` must be supplied together - both as
        strings to set a window, both as null to clear it - because a half-set window is a
        schedule nobody can reason about.
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        interval_secs:
          type: integer
          minimum: 60
          description: "Only for an interval job (422 otherwise), never below 60, and refused with 409 schedule_locked while an env override is in force."
        window_start: { type: [string, "null"], description: "\"HH:MM\" or \"HH:MM:SS\", or null to clear (with window_end). 24:00 is rejected rather than normalized - a bound that means two things is the seed of a missed run nobody can explain." }
        window_end: { type: [string, "null"], description: "As window_start. Equal start and end is 422: an empty window would never open (a wrapping 22:00 -> 04:00 window, by contrast, is legal)." }
        window_days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: "0 = Sunday .. 6 = Saturday; [] means every day."
        timezone: { type: string, description: "IANA zone name. An unknown zone is 422, never silently coerced to UTC - an operator who typed \"Europe/Londn\" and got UTC would see their window fire at the wrong time with nothing saying why." }
        history_limit: { type: integer, minimum: 1, maximum: 500 }
    JobRunNowRequest:
      type: object
      description: "An EMPTY BODY IS VALID and is what an instance-scoped job's Run now sends."
      properties:
        host_id:
          type: [string, "null"]
          format: uuid
          description: >-
            REQUIRED for a host-scoped job (400 without it) and NOT ALLOWED for an
            instance-scoped one (400 with it) - "which host" is not an optional detail when a
            run is per-host, and there is no defaulting to "some host".
    JobRunNowAccepted:
      type: object
      description: "202 body. The run is QUEUED, not executed inline - the response describes a pending row."
      required: [run_id, state, scheduled_for, eta_note]
      properties:
        run_id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/JobRunState" }
        scheduled_for: { type: string, format: date-time, description: "Now, for a manual run - a manual trigger bypasses the window. It never bypasses the job's own gates." }
        eta_note:
          type: string
          description: >-
            A plain human string the UI renders VERBATIM, e.g. "queued; the host claims due jobs
            about every 60 s" for an agent-plane job. It exists so Run now does not read as
            broken for the minute before the host polls. CLIENTS MUST NOT PARSE IT.
    AgentJobPendingRun:
      type: object
      description: "One run claimed by the calling host. Returning it and marking it `running` is ONE statement, which is what makes concurrent polls take disjoint sets."
      required: [run_id, job_id, params, deadline_secs]
      properties:
        run_id: { type: string, format: uuid }
        job_id: { type: string, description: "The registry job id, e.g. \"template.warmup\"." }
        params:
          type: object
          additionalProperties: true
          description: >-
            The opaque per-job JSON the control plane stored when it materialized the run (for
            an event trigger, whatever the event carried). The framework NEVER interprets it;
            the agent hands it to the runner. `{}` rather than null when there is none. Bounded
            at 4096 bytes by a CHECK.
        deadline_secs:
          type: integer
          description: >-
            After this long with no report the dispatcher ABORTS the run and re-materializes it.
            Sent so the agent can bound its own execution rather than discover the abort by
            racing it.
    AgentJobsPendingResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AgentJobPendingRun" }
          description: "Capped at 5 per poll; [] is the steady state and also the answer when the jobs master switch is off."
    AgentJobReportRequest:
      type: object
      required: [run_id, state]
      properties:
        run_id: { type: string, format: uuid, description: "The claimed run being closed. Unknown, or owned by another host: 401, indistinguishable from a bad secret." }
        state:
          type: string
          enum: [succeeded, failed, deferred, skipped]
          description: >-
            The closed set a HOST may report. `aborted` is absent on purpose - it is the
            reaper's verdict on a host that said nothing, and a host claiming it would be
            describing a decision it does not get to make. Sending it is 400 validation_failed,
            exactly like any other unrecognised value.
        summary:
          type: object
          additionalProperties: true
          description: "The runner's own result blob, stored verbatim. Absent is treated as {}. Bounded at 4096 bytes; blowing the bound fails the report, never the run."
        error: { type: [string, "null"], description: "Failure text for a failed run." }
    AgentJobReportAccepted:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
