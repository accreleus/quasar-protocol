        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Stop a session (owner or admin; idempotent).
      responses:
        "202": { description: Teardown requested. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/events:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [sessions]
      x-unimplemented: true
      summary: Server-sent session lifecycle events (owner or admin). NOT CURRENTLY SERVED — see x-unimplemented.
      description: >-
        NOT IMPLEMENTED AS OF 2026-08-07. The Steam game-exit lifecycle arc that
        introduced this endpoint was parked and its control-plane implementation
        reverted; this contract text was deliberately left in place so the agreed
        shape survives for a future resurrection. `x-unimplemented: true` marks
        that: the route-coverage drift test skips such operations, because a
        documented-but-unserved route would otherwise fail every branch as a
        phantom. Remove the marker in the same change that registers the route.
        Original amendment text follows.


        Session-events amendment (2026-08-02): SSE stream (text/event-stream) replacing
        Session-events amendment (2026-08-02): SSE stream (text/event-stream) replacing
        lifecycle polling for clients that support it. One event type, `session`, whose data
        is the same envelope as GET /v1/sessions/{id} — sent once on subscribe (snapshot) and
        on every change to state / state_detail / app_launch_state / health_state; the event
        for a terminal state is final and the server then closes the stream. Comment lines
        (`:`) are keep-alives (~25s). Best-effort latency optimization, never an authority:
        the GET remains canonical, and a client MUST retain polling as fallback (older
        control plane -> 404; dropped stream -> re-subscribe or poll). Bearer-authenticated
        like every session read (browsers use fetch-streaming, not EventSource, so the
        Authorization header carries as normal).
      responses:
        "200":
          description: SSE stream of `session` events (see description for framing).
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/stats:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Client posts its session telemetry (owner or admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StatsRequest" } } }
      responses:
        "202": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}/signaling-token:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Mint fresh signaling coordinates for the same live session.
      responses:
        "201":
          description: Independent single-use token created.
          content: { application/json: { schema: { $ref: "#/components/schemas/SignalingEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/swap:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Swap the running app without WebRTC teardown (owner or admin).
      description: |
        STEAM LIBRARY DISCOVERY PHASE 2 adds a NEW TERMINAL CONDITION here - 403 forbidden when
        the SESSION'S OWNER is not entitled to the target app. The status code itself already
        existed on this endpoint for the ownership check; what is new is a second way to reach
        it.

        WHY IT EXISTS AT ALL (it is not in the spec's enforcement list; the implementation added
        it): a swap IS a launch of a different app into a live session, so without this check
        the launch gate is defeatable in two requests - launch an app you are entitled to, then
        swap into one you are not, and the launch check never sees the second app.

        KEYED ON THE SESSION OWNER, NOT THE CALLER, and that is the load-bearing half. Swap is
        owner-OR-ADMIN, so keying on the caller would let an admin swapping someone else's
        session launder their own entitlements into it: the session would end up running an app
        its owner may not launch, and its owner keeps the stream. The question is "may this
        session run this app", and a session's access is its owner's.

        STEAM LIBRARY DISCOVERY PHASE 3 ADDS TWO 409 CONDITIONS HERE, both additive (409 was
        already declared on this endpoint and Error.code is an open string).

        409 home_not_provisioned - the swap target is a DERIVED TILE and THIS SESSION'S HOST holds
        no live user_homes row for its parent. A swap is pinned to the live session's host and has
        NO PLACEMENT STEP, so unlike a launch there is nowhere to re-pin it to: a tile whose
        library lives on another host, or does not exist yet, cannot be swapped into. Launch it
        directly instead - the launch path resolves the home host and pins there. Standard error
        envelope, no extra fields. This was reported as 500 internal until a review found it: the
        sentinel survived the wrap and only the mapping was missing, so an ordinary,
        user-correctable condition surfaced as a server fault.

        409 parent_app_disabled - the swap target is a DERIVED TILE whose parent is disabled. Same
        rule and same reasoning as POST /v1/sessions; see that endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id: { type: string, format: uuid }
      responses:
        "200": { description: Swapped. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Caller is neither owner nor admin; or (Phase 2) the SESSION OWNER holds no
            entitlement for the target app.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            session_not_swappable / swap_exceeds_reservation / conflict (pre-existing), or
            (Phase 3) home_not_provisioned - the target tile's parent has no home on THIS
            session's host - or parent_app_disabled.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/sessions/{id}/display:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    patch:
      tags: [sessions]
      summary: Change the live render resolution / interface scale / external resolution of a running session (owner or admin).
      description: |
        SESSION-DISPLAY-UPDATE amendment (additive, pre-approved 2026-08-15). Best-effort relay
        to the assigned host's agent-api session_display_update message - modelled directly on
        POST /v1/sessions/{id}/swap: no session-state transition, and a rejection is always a
        no-op (the session is left running exactly as it was).

        RENDER RESOLUTION AND UI SCALE ARE EPHEMERAL: agent-held only, never written to the
        sessions table, never present on the Session resource. The encode caps, interpipe
        boundary, and the session's pinned stream WxH are UNCHANGED by render_width/render_height/
        ui_scale - only the compositor's advertised wl_output logical mode and
        wp_fractional_scale_v1 preferred_scale move. Clients read the live values back via
        session_metrics (agent-api.md) - the only authoritative readback - or keep their own
        last-acked value.

        SESSION-DISPLAY-STREAM (approved 2026-08-16) amendment (additive, 2026-08-16, approved 2026-08-16 (PR #15); do not
        implement against it until merged). Adds stream_width/stream_height: the EXTERNAL
        (encoded/streamed) size, independent of render_width/render_height (INTERNAL). Unlike
        render size, this changes what the encoder actually produces - the coded size moves at
        the next IDR, with no WebRTC renegotiation. Gated on the assigned host's encoder
        supporting a live resize (readback: Session.stream.external_resize_supported). Ephemeral
        like render size, but mirrored into an in-memory control-plane cache
        (Session.stream.external_width/external_height) for GET convenience; session_metrics
        remains the sole authoritative readback. See control-api.md for the full
        INTERNAL-vs-EXTERNAL vocabulary and the fixed stream.rungs table.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionDisplayUpdate" }
      responses:
        "202":
          description: Accepted; agent is applying the update. Body is the current session (Session shape is unchanged by this endpoint).
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "400": { description: "validation_failed — render_width/render_height not both-or-neither, dims not even, dims out of [16, session pinned LAUNCH WxH] (independent of the current external/stream size, 2026-08-16 amendment), ui_scale outside [1.0, 3.0], or stream_width/stream_height not both-or-neither or not one of the session's stream.rungs pairs.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller is neither owner nor admin.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            session_not_running - the session's top-level state is not running - or
            display_update_rejected - the agent rejected the update, or no ack arrived within
            the control plane's command timeout - or (session-display-stream, approved 2026-08-16, AWAITING
            SIGN-OFF) external_resize_unsupported - the assigned host's encoder cannot live-resize
            the stream, only returned when the request includes stream_width/stream_height. The
            session is left untouched in every case.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/sessions/{id}/verdict:
