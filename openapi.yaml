# Quasar control-plane API — OpenAPI 3.1 schema.
#
# FROZEN-INTERFACE ARTIFACT. This is a faithful machine rendering of the prose
# contract in control-api.md; control-api.md stays authoritative. Changes follow
# the same additive + Opus + human-sign-off rules as the prose contract.
#
# Kept honest by the route-coverage drift test in
# control-plane/cmd/quasar-control/openapi_drift_test.go: every /v1 route the
# server registers must appear here (and vice-versa). Do not hand-remove a path
# to make that test pass — reconcile against the running router.
#
# Authoring note (2026-07-10, updated 2026-07-28): several registered routes are NOT yet in
# control-api.md prose (admin/apps, hosts/{id}/gpus, users, users/{id}). UI-P4 closed part of
# that gap: admin/profile-policy, admin/stream-profiles and me/profile-preferences are now in
# the prose (control-api.md §Stream profiles and launch profiles). Their bodies here were
# transcribed from
# the web client's typed contract (web/src/api/types.ts) and validated live by the
# conformance harness (scripts/harness/run-apitest.sh) — but the prose contract still needs the
# amendment + sign-off (see docs/design/plans/openapi-contract-drift-report.md). A few
# admin trace/storage/cert routes remain loosely typed (type: object) pending shapes.
openapi: 3.1.0
info:
  title: Quasar Control-Plane API
  version: "1.0.0"
  description: |
    The public/control API of the Quasar control plane (`/v1`). JSON in/out.
    All endpoints except `/v1/auth/register` and `/v1/auth/login` require
    `Authorization: Bearer <access_token>`. Admin endpoints (tagged
    `x-required-role: admin`) reject a valid non-admin token with 403 — the gate
    is server-enforced (`RequireAuth → RequireAdmin`), never UI-gated.

    CLIENT VERSION GATE (#380, additive). Every bearer-authenticated endpoint
    accepts the OPTIONAL request header `X-Quasar-Client-Version` (strict
    MAJOR.MINOR.PATCH) and MAY answer `426 client_too_old` when the presented
    version is below the operator-configured floor. It is enforced once, in the
    shared auth middleware (`RequireAuth`), never per handler — so rather than
    repeating the parameter and the response on ~200 operations, it is declared
    once here and as the reusable `ClientVersionHeader` parameter /
    `ClientTooOld` response components. Absent header ⇒ no gate (web/legacy);
    malformed value ⇒ treated as absent (logged, not gated). Order of checks on a
    bearer request: 401 → 426 → 403 → handler. See control-api.md §Client version
    gate on bearer-authenticated endpoints.
  x-global-request-headers:
    - $ref: "#/components/parameters/ClientVersionHeader"
  x-global-responses:
    "426": { $ref: "#/components/responses/ClientTooOld" }
servers:
  - url: http://{host}:{port}
    description: |
      A Quasar control-plane instance (e.g. hermes :8080, tower :18080). The server
      base carries NO path prefix — every path below is absolute from the origin and
      begins with /v1 (this matches the Go router's registered patterns, which the
      drift test compares against).
    variables:
      host: { default: "localhost" }
      port: { default: "8080" }

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, logout, current-user.
  - name: me
    description: Caller-self surface (devices, profiles, storage, password).
  - name: apps
    description: The app library (public read; admin write).
  - name: sessions
    description: Session launch + lifecycle + client telemetry/trace.
  - name: hosts
    description: Host/GPU oversight + lifecycle (admin).
  - name: admin
    description: Admin oversight — settings, invites, storage, sessions, host config, certification.
  - name: users
    description: User administration (admin).
  - name: agent
    description: Node-agent ↔ control-plane internal endpoints (not operator-facing).
  - name: signaling
    description: WebRTC signaling (WebSocket; not a REST body — see signaling.md).
  - name: dev
    description: Development-only surface — registered ONLY when QUASAR_DEV_AGENT_AUTH=1, never in production (the control plane refuses to boot with the flag set and QUASAR_ENV=production). Paths carry x-dev-only true; the route-coverage drift test skips them (their registration semantics are asserted by dedicated tests instead).
  - name: setup
    description: First-run setup — claim the instance (create the first admin, token-gated) and read setup status. `POST /v1/setup/claim` self-disables (409) once any admin exists; `GET /v1/setup/status` is unauthenticated and returns only routing booleans.
  - name: access
    description: >-
      Remote access and TLS (first-run wizard v2 §S6). Serving the leaf certificate for
      download is UNAUTHENTICATED by design — a client that does not yet trust the
      certificate frequently cannot log in to fetch it — and discloses only the public half
      every TLS handshake already transmits. The admin diagnostics route carries the `admin`
      tag and the normal server-enforced gate.
  - name: images
    description: App-image catalog + management (admin). The catalog mirrors the accretion-io/quasar-images manifest; installing an image also lands its runtime preset. P1 = read + sync; P3 adds install/uninstall/pin/update + digest pinning (#440).

paths:
  # ─── auth ────────────────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account (role always 'user'; invite-gated per instance settings).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { description: "registration_closed — the invitation system is off (default)." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Log in; returns the opaque bearer access_token (field is access_token, not token).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/ClientTooOld" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the presented bearer token (idempotent).
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me:
    get:
      tags: [auth]
      summary: The current user.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/password:
    post:
      tags: [me]
      summary: Change own password (revokes all tokens; must re-authenticate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: Password rotated; all tokens revoked. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── dev (dev-gated; absent unless QUASAR_DEV_AGENT_AUTH=1) ───────────────
  /v1/dev/agent-session:
    post:
      tags: [dev]
      x-dev-only: true
      summary: Mint a throwaway, auto-reaped ephemeral identity + token for automated UI validation (dev-gated; #399).
      description: |
        Registered ONLY when `QUASAR_DEV_AGENT_AUTH=1`; absent the flag the route
        does not exist (404), and the control plane refuses to boot with the flag
        set while `QUASAR_ENV=production`. Auth is the per-boot dev key (written to
        the container log and `/run/quasar/dev-agent-key`), not a bearer token.
        Response is shape-compatible with `POST /v1/auth/login` so every existing
        client path works unchanged. The minted identity is a REAL user row with a
        real token — server-side role enforcement is untouched — and is deleted
        (with its sessions and device bindings) when its TTL lapses.
      security: []
      parameters:
        - name: X-Quasar-Dev-Key
          in: header
          required: true
          schema: { type: string }
          description: The per-boot dev secret. Wrong or missing → 401 with no message/timing distinction.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevAgentSessionRequest" }
      responses:
        "200":
          description: Ephemeral identity minted (login-shape + storage_keys).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevAgentSessionResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── setup (first-run; claim self-disables once an admin exists) ──────────
  /v1/setup/status:
    get:
      tags: [setup]
      summary: Routing booleans for the SPA — is the instance claimed, is setup finished.
      description: |
        Unauthenticated and deliberately minimal: returns only whether an admin
        exists and whether the setup flow has been completed, so the SPA can send
        a virgin instance to /setup instead of a login screen no one can satisfy.
        Exposes nothing an attacker can use beyond those two booleans.
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /v1/setup/claim:
    post:
      tags: [setup]
      summary: Create the first admin (token-gated); self-disables once any admin exists (#first-run wizard).
      description: |
        First-run claim. Auth is the per-boot setup token (written ONLY to
        /run/quasar/setup-token, 0600, never to the log; the boot log names the
        file path) — NOT a bearer token. Wrong or missing token → 401 with no message/timing distinction.
        Refused with 409 setup_already_complete once any admin exists (checked
        under the same advisory lock as BOOTSTRAP_ADMIN_* provisioning, so the two
        paths can never both create an admin). Response is login-shaped so the
        operator is signed in as their new admin.
      security: []
      parameters:
        - name: X-Quasar-Setup-Token
          in: header
          required: true
          schema: { type: string }
          description: The per-boot setup token. Wrong/missing → 401, indistinguishable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupClaimRequest" }
      responses:
        "201":
          description: First admin created; caller is now authenticated as that admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: setup_already_complete — an admin already exists.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/setup/complete:
    post:
      tags: [setup]
      summary: Mark the first-run wizard finished or skipped (admin, idempotent).
      description: |
        Sets `instance_settings.setup_completed_at` if it is null and returns the
        resulting status. Idempotent: calling it again is a no-op that returns the
        same body. This is what makes `setup_completed` mean anything — completion
        is INSTANCE state, so a skip must be permanent for every admin on every
        device, not a per-browser marker. The wizard's furthest-step position stays
        client-side by design; only completion is server-side.
      x-required-role: admin
      responses:
        "200":
          description: Setup marked complete (or already was).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── me (devices / profiles / storage) ───────────────────────────────────
  /v1/me/devices:
    get:
      tags: [me]
      summary: List the caller's devices (newest-first).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      summary: Upsert the caller's device capability probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpsert" }
      responses:
        "200":
          description: Device recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/devices/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    patch:
      tags: [me]
      summary: Rename / set trust on an owned device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                trusted: { type: boolean }
      responses:
        "200":
          description: Updated device.
          content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [me]
      summary: Revoke an owned device (expires its tokens).
      responses:
        "204": { description: Device revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/me/profiles:
    get:
      tags: [me]
      summary: Launch-profile eligibility + recommendation for the caller's device.
      description: |
        UI-P5 adds the OPTIONAL app_id query parameter. With it, the response is narrowed to the
        launch profiles that app offers (its allow-list, intersected with eligibility), so a
        client renders the correct per-app launch menu without intersecting anything itself.
        Without it the response is exactly the pre-UI-P5 one.

        THIS FILTER IS A CONVENIENCE, NOT THE GATE. POST /v1/sessions enforces the same
        allow-list independently, so a client that omits the parameter, or ignores what it
        returns, cannot launch anything extra.
      parameters:
        - name: app_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >-
            UI-P5, OPTIONAL. Narrow the evaluation to the launch profiles this app offers. 404
            when the app does not resolve under the SAME visibility rule as GET /v1/apps/{id}
            (non-admin: absent or disabled) - never a silent fall-back to the full catalogue,
            which would widen the menu on a typo.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/me/storage:
    get:
      tags: [me]
      summary: The caller's own per-app storage usage.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/MyStorageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/favourites/{app_id}:
    parameters: [ { $ref: "#/components/parameters/PathAppId" } ]
    put:
      tags: [me]
      summary: "UI-P1: favourite an app for the calling user (idempotent)."
      description: |
        RequireAuth — any authenticated account, explicitly NOT admin. The owner is the bearer
        identity; no endpoint in this surface takes a user_id. Idempotent
        (INSERT … ON CONFLICT DO NOTHING) — a repeat PUT does not re-stamp created_at.
        404 when the app id does not resolve under the SAME visibility rule as GET /v1/apps/{id}
        (non-admin: absent or disabled; admin: absent) — a 204 on a disabled app would confirm
        the existence of something the caller cannot read.

        STEAM LIBRARY DISCOVERY PHASE 2: 403 forbidden when the caller is not entitled, checked
        AFTER the 404 above rather than folded into it. This is the one read-adjacent place the
        contract gives a distinguishable answer instead of a uniform 404, and it is a considered
        trade: GET /v1/apps/{id} is a READ, so collapsing "not entitled" into "not found" costs
        the caller nothing, but this is a WRITE the client offers as a toggle on a tile - an app
        the caller can no longer launch should say so rather than appear to have evaporated. The
        existence signal it concedes is bounded, since the caller must already hold a valid app
        UUID to reach it. APPLIED TO EVERY ROLE, ADMIN INCLUDED, unlike the visibility rule
        above: /v1/me/* is the user surface by definition, an admin favouriting an app that is
        not in their own library is meaningless, and a role arm here would be the first crack in
        the no-bypass rule.
      responses:
        "204": { description: App favourited. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Phase 2: the caller holds no entitlement for this app."
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [me]
      summary: "UI-P1: unfavourite an app (idempotent, unconditional — never 404)."
      description: |
        RequireAuth. Idempotent AND unconditional for a well-formed UUID: never-favourited,
        disabled and since-deleted all return 204. Deliberately never 404s — the intent is
        satisfied either way and an app delete cascades the row away, so a 404 would be
        unactionable. Same posture as DELETE /v1/admin/invites/{id} and POST /v1/auth/logout.
      responses:
        "204": { description: App not favourited (whether or not it was). }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/profile-preferences:
    get:
      tags: [me]
      summary: "Read the caller's stream-profile preferences. (Not yet in control-api.md prose.)"
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: "Update the caller's stream-profile preferences. (Not yet in control-api.md prose.)"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/ui-preferences:
    get:
      tags: [me]
      summary: "Read the caller's client UI preferences. Never readable by another user, including admins."
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/UIPreferences" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: "Update the caller's client UI preferences. Partial: absent fields are left unchanged; unknown keys are preserved verbatim."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UIPreferences" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/UIPreferences" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/highlights:
    get:
      tags: [me]
      summary: The calling user's home-page featured rail (server-ranked, at most 5).
      description: |
        The home landing page's hero rail. Per-caller, resolved entirely from the bearer
        identity: it accepts no user_id and there is no admin variant.

        THE SERVER OWNS THE RANKING. This was the explicit sign-off decision (2026-08-05):
        the rail's order and its per-item `reason` are produced here, and a client renders
        what it is given. A client MUST NOT re-derive or re-sort the rail from /v1/apps and
        /v1/sessions — two rankers is precisely the drift this endpoint exists to prevent.

        ENTITLEMENT-FILTERED, AND THIS IS NOT COSMETIC. The rail is derived from `sessions`,
        and a session row outlives the entitlement that authorised it — an admin revoking a
        user's entitlement does not delete their history. Highlights therefore applies the
        SAME entitled + enabled predicate as GET /v1/apps (internal/crud/store.go
        entitledSQL). Without it, a revoked app reappears on the user's home page with its
        play time attached. The launch itself is still refused at POST /v1/sessions — this
        endpoint is UX, not the authorization boundary — but surfacing a revoked title is an
        information leak in its own right.

        BEST-EFFORT BY CONTRACT. `items` may be shorter than 5, and is empty for a user who
        has never launched anything. A client MUST render the page with an empty rail rather
        than treating it as an error.
      parameters:
        - name: window_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: >-
            The lookback for the "most played" ranking. Does not affect "resume" or "recently
            added" reasons, which are unbounded and newest-first respectively.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HighlightList" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── apps ────────────────────────────────────────────────────────────────
  /v1/apps:
    get:
      tags: [apps]
      summary: List the enabled apps the CALLER IS ENTITLED TO (favourite is resolved for the caller).
      description: |
        UI-P1, BREAKING (2026-07-27): this list was previously public (`security: []`) and
        returned the full catalogue — names, descriptions, cover URLs, stream defaults — to any
        unauthenticated caller. That was an information-disclosure defect on a self-hosted
        deployment; it now requires a bearer and returns 401 without one. Both known consumers
        (the web SPA and quasar-client) already send the bearer. See control-api.md.

        STEAM LIBRARY DISCOVERY PHASE 2, NOT ADDITIVE: this list is now `enabled = true` AND
        entitled. An app appears only if the caller holds an 'all' entitlement (visible to
        everyone) or a ('user', caller) one. NO SHAPE OR STATUS CODE CHANGES and a client that
        renders what it receives needs no change - what changes is that the list can now be
        SHORTER THAN THE CATALOGUE.

        Day one it is byte-identical to the pre-Phase-2 list: migration 0043 backfills an 'all'
        row for every existing app in the same transaction that creates the table, so the
        filter's first evaluation returns exactly what the unfiltered query returned. It narrows
        only as an admin deliberately narrows it.

        THE FILTER APPLIES TO EVERY ROLE, ADMINS INCLUDED, AND THERE IS NO BYPASS. An admin
        browsing the library is a user browsing THEIR OWN library; a fleet-wide god view here
        would be actively wrong once library discovery is on, since it would show every other
        user's games. The god view is GET /v1/admin/apps, which is unfiltered and unchanged, so
        nothing becomes unreachable. An admin who wants an app in their own library grants
        themselves the entitlement - one call, and it leaves an audit row, which
        `if isAdmin { skip }` does not.

        THIS IS UX, NOT THE AUTHORIZATION BOUNDARY. The boundary is POST /v1/sessions: a client
        that ignores this list and launches an app id directly is refused there, not here.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [apps]
      summary: Create an app (entitled to everyone by default - see AppWrite.entitle).
      description: >-
        Steam library discovery Phase 2 adds the OPTIONAL, CREATE-ONLY `entitle` field
        ("all" | "none", default "all"). With the default, the created app carries an
        ('all', granted_by='admin') entitlement and is immediately visible to everyone - exactly
        the pre-entitlements behaviour. The default grant is part of the create: if writing it
        fails the create fails whole (500, no app) rather than succeeding into an app that
        exists but that nobody can see, which is not a security problem but an undiagnosable
        one.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppWrite" }
      responses:
        "201":
          description: App created.
          content:
            application/json:
              schema:
                type: object
                required: [app]
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            #534 AMENDMENT (2026-08-25), ADDITIVE: code `library_discovery_disabled` - the
            request would create a library-provider app (non-empty library_provider) while
            library_discovery_enabled is false. Refused rather than created-then-suspended:
            discovery is a fail-closed, fleet-wide, privacy-relevant setting (it walks user
            homes), so an app create must not flip it as a side effect, and a 201 followed
            by a silent reconciler suspension reads as data loss. Enable library discovery
            in Settings first. Mirrors the existing 409 `provider_enabled` refusal on
            DELETE /v1/admin/images/{id}/install.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  /v1/apps/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [apps]
      summary: A single app (requires auth; response is wrapped in {app}).
      description: |
        This route has always had TWO behaviours: for a non-admin it is the library read; for an
        admin it returns the full admin shape (disabled apps included, runtime_spec included).

        STEAM LIBRARY DISCOVERY PHASE 2: for a NON-ADMIN caller this is now 404 when the caller
        is not entitled, folded into the existing no-such-app answer rather than given its own
        status. The endpoint is already an existence check for a non-admin (a disabled app is
        404 too), so collapsing "not entitled" into it leaks nothing and is the correct posture
        for a per-user library. 403 is reserved for the two WRITES
        (PUT /v1/me/favourites/{app_id}, POST /v1/sessions) where the caller has deliberately
        named an app and needs an actionable answer.

        THE ADMIN BRANCH IS DELIBERATELY NOT ENTITLEMENT-FILTERED - DO NOT "FIX" IT. It is the
        admin app-EDITOR's loader (web/src/api/admin.ts:160) and there is no GET
        /v1/admin/apps/{id} route to move that load onto, so filtering it would make an app
        UN-EDITABLE the instant an admin restricted it: an operator lockout with no recovery
        inside the product, reachable by using the feature exactly as intended.

        THE RESULTING ASYMMETRY, STATED SO IT IS NOT READ AS A BUG: an admin can read one app's
        detail here while that same app is ABSENT from their own GET /v1/apps. That is
        consistent - the admin surface is "the fleet's configuration", the library is "what I
        may launch", and this route serves both - and it concedes no information, since
        GET /v1/admin/apps would hand an admin the same rows. It grants no launch either:
        POST /v1/sessions and .../swap are entitlement-checked for every role.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            No such app; for a non-admin also a disabled app, and (Phase 2) an app the caller
            holds no entitlement for.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    patch:
      tags: [apps]
      summary: Edit an app.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppWrite" } } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [app]
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            #534 AMENDMENT (2026-08-25), ADDITIVE: code `library_discovery_disabled` - the
            edit would set a non-empty library_provider, or enable a reconciler-suspended
            provider app, while library_discovery_enabled is false (either write would be
            immediately reverted by the reconciler). The ways out are deliberate: clear
            library_provider, keep the app disabled, or enable library discovery in
            Settings. See the POST /v1/apps 409 for the rationale.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    delete:
      tags: [apps]
      summary: Remove an app from the catalog (refuse-if-in-use, and refuse-if-it-has-derived-tiles).
      description: |
        STEAM LIBRARY DISCOVERY PHASE 3 ADDS A SECOND REFUSAL, mirroring the existing
        refuse-if-in-use pattern and reusing the generic `conflict` code rather than adding one.
        Deleting a PROVIDER app that has derived tiles is 409 unless the caller opts in with
        ?delete_derived=true, because apps.parent_app_id CASCADEs: the delete would silently take
        every derived tile with it, and each tile's app_artwork and user_app_favourites rows with
        those. The cascade is the INTEGRITY BACKSTOP UNDER THIS CONFIRMATION, not the UX.

        THE 409 BODY LISTS THE TILES, IT DOES NOT COUNT THEM - `derived_tiles: [{id, name}, ...]`
        nested inside the error object, the same idiom as `live_sessions` on restart_required.
        The point of a confirmation is that the admin sees WHAT they are about to destroy, and
        "12 tiles" is not that. The list is capped; an empty array means the tiles could not be
        listed, never that there are none (there are, or this 409 would not have been raised).

        Only the exact string "true" opts in. Anything else - absent, "1", "yes", "TRUE" - is
        treated as not opting in, so a typo refuses rather than deletes.
      x-required-role: admin
      parameters:
        - name: delete_derived
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: >-
            Steam library discovery Phase 3. "true" confirms that deleting this app may cascade to
            its derived tiles. Any other value, and absence, do not confirm. Inert for an app with
            no derived tiles, which is every app predating migration 0044.
      responses:
        "204": { description: App removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            In use by an active session (pre-existing), OR (Phase 3) the app has derived tiles and
            ?delete_derived=true was not sent - the body then carries `derived_tiles`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  # ─── admin: runtime presets (UI-P3) ──────────────────────────────────────
  /v1/admin/runtime-presets:
    get:
      tags: [admin]
      summary: "UI-P3: list runtime presets, each with its used_by app list."
      description: |
        A runtime preset is a reusable container configuration (image, args, env, mounts,
        managed-home defaults) that many apps inherit instead of repeating. It is NOT a launch
        profile - UI-P4's launch profiles are the quality/encode chain. RequireAuth ->
        RequireAdmin, server-enforced.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: "UI-P3: create a runtime preset."
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetWrite" } } }
      responses:
        "201": { description: Created. , content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/runtime-presets/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin]
      summary: "UI-P3: a single runtime preset, with its used_by app list."
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: "UI-P3: edit a runtime preset (takes effect on the next launch of every app using it)."
      description: |
        Absent fields are UNCHANGED, never reset to default. The edit reaches every app already
        using the preset with no app edit, because the merge is server-side at launch rather than
        flattened on save. 409 on a name collision.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetWrite" } } }
      responses:
        "200": { description: Updated. , content: { application/json: { schema: { $ref: "#/components/schemas/RuntimePresetEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin]
      summary: "UI-P3: delete a runtime preset (refuse-if-in-use)."
      description: |
        409 conflict while ANY app references the preset, INCLUDING a disabled one - a disabled
        app still holds the reference and would still be silently reconfigured. Point the apps
        elsewhere (PATCH /v1/apps/{id} {"runtime_preset_id": null}) first. The admin UI disabling
        its Delete button when used_by is non-empty is a UX affordance and never the enforcement;
        the DB FK (ON DELETE RESTRICT) is the backstop under this 409, not the gate.
      x-required-role: admin
      responses:
        "204": { description: Runtime preset removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/activity:
    get:
      tags: [admin]
      summary: Newest-first administrative activity history.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: integer, minimum: 1 } }
        # UI v3 amendment (2026-08-28, additive): five OPTIONAL filters. Every one
        # absent is exactly the pre-amendment query. They AND together, and they
        # compose with `cursor` - paging a filtered feed keeps the filter.
        - name: action
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: >-
            PREFIX match on `action`, not a substring or a regex, so `user.` selects the
            whole `user.*` family and `user.deleted` selects one action. Dotted actions
            are namespaced by design; prefix is the operator's natural query over them.
        - name: actor_user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >-
            Exact match on `actor_user_id`. A malformed uuid is `400 validation_failed`.
            Rows with a null actor (server-originated events such as `session.failed`)
            are never returned by this filter.
        - name: target_type
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: "Exact match on `target_type` (`user`, `host`, `session`, `app`, `image`, `invite`, `instance`, …)."
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: >-
            Lower bound, inclusive, on `created_at` (RFC 3339). There is deliberately no
            `until`: this feed is read newest-first from now backwards, and `cursor`
            already bounds the other end. An unparseable value is `400 validation_failed`.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
          description: >-
            Case-insensitive substring over `action`, `target_id` and the joined actor
            username - the three things an operator can actually read off the page.
            Deliberately NOT over `details`: that column holds operator-supplied free
            text, and a substring search across it would turn a note into a way to find
            unrelated rows. Escapes `%` and `_` so a literal underscore matches a literal
            underscore.
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/AdminActivityList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/apps:
    get:
      tags: [admin, apps]
      summary: "List all apps incl. disabled + admin fields. (Not yet in control-api.md prose.)"
      description: >-
        Steam library discovery Phase 2: THIS IS THE UNFILTERED GOD VIEW and is deliberately
        NOT entitlement-filtered. That is exactly what lets GET /v1/apps stay filtered for
        admins too - nothing becomes unreachable, it moves to the route that already means
        "the whole fleet's catalogue". If an admin "cannot see an app", the answer is to grant
        the entitlement (audited), never to add a role arm to the library filter.
      x-required-role: admin
      responses:
        "200":
          description: OK.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminAppsResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── entitlements (Steam library discovery Phase 2) ──────────────────────
  # An entitlement is one fact: "this subject may see and launch this app".
  # These four admin routes are the ONLY way to widen visibility, which is what
  # lets GET /v1/apps and POST /v1/sessions stay entitlement-filtered for admins
  # too. NOT ADDITIVE as a whole: see control-api.md's Phase 2 amendment for the
  # behaviour changes on GET /v1/apps, GET /v1/apps/{id},
  # PUT /v1/me/favourites/{app_id}, POST /v1/sessions and .../swap.
  /v1/admin/apps/{id}/entitlements:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin, apps]
      summary: Who may see and launch this app.
      description: >-
        Phase 2. Ordered 'all' first, then by username - the admin "Visible to" control reads
        top-down and "everyone" is the fact that subsumes the rest. An app may carry BOTH an
        'all' row and personal rows; they are independent facts and revoking one does not
        revoke the other.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementList" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin, apps]
      summary: Grant an entitlement (409 if the subject already holds one).
      description: >-
        Phase 2. subject_type 'all' must OMIT subject_id; subject_type 'user' REQUIRES a user
        uuid - anything else is 400 validation_failed. 409 conflict when that subject already
        holds an entitlement for this app, deliberately NOT a silent idempotent 201: the two
        are different outcomes for an admin who believes they are granting access to someone
        new. The row is always written granted_by='admin' with the acting admin recorded in
        granted_by_user - a client cannot assert either - and the grant is written to the admin
        activity log as app.entitlement.grant.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementGrant" } } }
      responses:
        "201": { description: Entitlement granted., content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/apps/{id}/entitlements/{entitlement_id}:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { $ref: "#/components/parameters/PathEntitlementId" }
    delete:
      tags: [admin, apps]
      summary: Revoke an entitlement (scoped to the app in the path).
      description: >-
        Phase 2. SCOPED TO THE APP IN THE PATH, not a bare delete by id: the entitlement must
        belong to {id}, and a well-formed pair that does not match is 404 not_found. So a stale
        admin page cannot revoke an entitlement on some OTHER app by replaying an id it still
        holds, and the URL means what it reads as. Revoking an 'all' row does not revoke
        anybody's personal grant, and vice versa. A granted_by='provider' revoke is NOT
        permanent - the next library sync re-grants it if the title is still installed; the
        permanent fleet-wide suppression is the Phase 4 ignore rule. Written to the admin
        activity log as app.entitlement.revoke.
      x-required-role: admin
      responses:
        "204": { description: Entitlement revoked. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/users/{id}/entitlements:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin, users]
      summary: This user's PERSONAL entitlements only (not the 'all' rows they also benefit from).
      description: >-
        Phase 2. Returns only subject_type='user' rows for this user, ordered by app name, and
        DELIBERATELY NOT the 'all' rows the user also benefits from. Including those would make
        this screen a per-user copy of the entire catalogue on which every Revoke button has a
        FLEET-WIDE effect - an admin looking at one user's page, clicking Revoke on a row shown
        as that user's, and removing the app from everyone. The narrower answer also matches the
        question this route exists to answer ("what has been granted to this person
        specifically?"); the fleet-wide view of an app's access is
        GET /v1/admin/apps/{id}/entitlements, where an 'all' row is unmistakably an app-level
        fact. "Everything this user can see" is already answerable - it is GET /v1/apps as that
        user - and widening this route to produce it is the change being warned against.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementList" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── provider entitlement mode (#465 amendment, additive) ─────────────────
  # See the "Provider entitlement mode" amendment note above the "How the
  # client uses this" section in control-api.md for the full rationale: this
  # is the seam EnsureProviderApp's own doc comment (control-plane
  # internal/images/provider_app.go) named as the follow-up when it ruled out
  # threading an entitlement mode through the app CREATE path.
  /v1/admin/library-providers/{provider}/entitlement-mode:
    parameters: [ { $ref: "#/components/parameters/PathProvider" } ]
    post:
      tags: [admin, apps]
      summary: Set the WHOLE entitlement state of a provider app (all|user|none), by provider name.
      description: >-
        #465, additive. REPLACES every entitlement row on the provider app named by {provider}
        with exactly what mode implies - "all" writes one ('all', NULL) row, "user" writes one
        ('user', <acting admin>) row (this endpoint has no subject_id field - it always means
        the caller), "none" writes none. This is a MODE control (a radio button expressing one
        of three exclusive states), not an incremental grant: calling it discards whatever was
        there, including a hand-picked set of per-user grants made through
        POST /v1/admin/apps/{id}/entitlements. Use that route instead for anything short of a
        full state replacement.
        Exists because the caller (the setup wizard / settings library step) knows the provider
        name but not the app id - EnsureProviderApp creates the app off the request thread, as a
        side effect of PATCH /v1/admin/settings library_discovery_enabled false->true, so there
        is no response carrying an app_id to key the generic entitlements routes against.
        404 not_found when no app exists yet with this library_provider (not enabled yet, or the
        async create has not landed) - the wizard's answer is "try again shortly", not a retry
        loop hidden here. Written to the admin activity log as app.entitlement.set_mode.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProviderEntitlementModeSet" } } }
      responses:
        "200": { description: Mode applied., content: { application/json: { schema: { $ref: "#/components/schemas/ProviderEntitlementModeEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── library discovery, admin surfaces (Steam library discovery Phase 4) ──
  # Purely additive: five admin routes, no existing shape or behaviour changed.
  # (A sixth, POST /v1/admin/library/scan, was added by the force-scan follow-on
  # below - also additive, also with agent-api.md byte-identical.)
  # The suppression ladder these serve, per observed appid, first match wins:
  #   1. an `allow` rule exists                                    -> publish
  #   2. an `ignore` rule exists                                   -> suppress
  #   3. the built-in denylist matches the appid OR a name prefix  -> suppress
  #   4. otherwise                                                 -> publish
  #   5. (only when QUASAR_STEAM_APPDETAILS_LOOKUP is on) Valve's store says the
  #      type is not "game" -> suppress. APPENDED, never substituted: consulted
  #      only for appids rungs 1-4 would publish and NEVER for one a rule decided.
  # Rung 1 above rung 3 is what makes a wrongly-denylisted game recoverable
  # WITHOUT A RELEASE; rung 2 above rung 4 is what makes an operator's Ignore
  # stick.
  /v1/admin/library/status:
    get:
      tags: [admin]
      summary: Is discovery actually doing anything, and if not, WHY.
      description: >-
        Phase 4. INERT_REASON IS THE REASON THIS ENDPOINT EXISTS, and it is part of the contract
        rather than a nicety: under auto-publish the only observable signal of a working scan is
        tiles appearing, so "nothing appeared" and "nothing ran" look identical to an operator
        unless something says which. It is "" when discovery is live, and otherwise names exactly
        one of - the master switch is off; QUASAR_LIBRARY_SCAN_INTERVAL is 0 (which disables
        discovery regardless of the database flag); or the instance storage provider is 'volume',
        which has no host path a node-agent can walk. scan_interval_secs is the RESOLVED interval,
        so an operator can see what their "6h" actually became.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: Could not read settings or scan counts. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  # ─── force scan (Phase 4 follow-on) ──────────────────────────────────────
  # Additive, admin-gated, no migration, agent-api.md STILL byte-identical.
  # Discovery shipped paced by TWO independent 6h timers, each anchored to its
  # own process's boot rather than to the moment an operator enables the
  # feature: the janitor decides when a scan is enqueued, the agent's poll
  # decides when it is claimed. Enabling discovery could take up to TWELVE hours
  # to produce one tile, and this is a PULL channel, so the control plane cannot
  # push. Two changes fix it and they are one idea: the agent's poll dropped from
  # 6h to 60s (agent behaviour, not wire shape - a poll is one indexed query,
  # while the filesystem walk stays paced by QUASAR_LIBRARY_SCAN_INTERVAL), and
  # this route. A "scan now" button in front of a 6h poll would have made an
  # operator wait six hours for their own button.
  /v1/admin/library/scan:
    post:
      tags: [admin]
      summary: "\"Scan now\": enqueue pending scans immediately, bypassing the recency pacing."
      description: >-
        IT BYPASSES PACING AND NEVER A GATE. What it drops is the janitor's "no successful scan for
        this triple inside QUASAR_LIBRARY_SCAN_INTERVAL" predicate - the rule that stops a six-hourly
        sweep re-walking every home on every pass, and precisely the rule an operator who just
        installed a game or just fixed a home mount is overriding on purpose. Every GATE still
        applies and is still reported: the library_discovery_enabled switch, the 'volume' storage
        provider, QUASAR_LIBRARY_SCAN_INTERVAL=0 as the hard kill switch, and the per-home
        provider='local' filter (enforced inside the enqueue, so a volume-backed home on an
        otherwise-local instance is never forced into a pending row nothing could claim).
        AN INERT INSTANCE IS A 200 CARRYING inert_reason, DELIBERATELY NOT A 409 OR A 400. It mirrors
        GET /v1/admin/library/status, whose inert_reason exists for exactly this question, so a
        client renders ONE code path for "here is what happened" and "here is why nothing did"; the
        server computes both surfaces' reasons through one shared helper so the wording cannot drift
        between the status panel and the button.
        Scope is optional and AN EMPTY BODY IS VALID, meaning "everything, now" - the common case and
        what the admin button sends. A non-provider app_id is 400 and an app_id that does not exist
        at all is 404, reusing the two-mistakes-two-fixes split the four /v1/admin/apps/{id}/library/*
        routes already apply rather than inventing a second vocabulary for the same mistake; a
        malformed uuid or malformed JSON is likewise 400.
        ORDER OF CHECKS IS OBSERVABLE AND THEREFORE CONTRACTUAL: body shape first (400), then
        INERTNESS (200 + inert_reason), then the scope (400/404). A bad app_id on a switched-off
        instance is the 200, not the 400 - the instance-level answer explains why nothing at all can
        happen, and reporting a scope defect first would send an operator fixing an app id on a
        control plane that would have refused any scope.
        Double-press is IDEMPOTENT: library_scans_open_uk is partial on pending/claimed and the
        enqueue is ON CONFLICT DO NOTHING, so the second press inserts nothing, reports it as
        `skipped`, and is not an error.
        Audited as library.scan.force, identifiers and counts only - this makes the whole fleet walk
        every user's home directory on demand.
      x-required-role: admin
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryForceScanRequest" } } }
      responses:
        "200": { description: "Enqueued, or inert with a stated reason.", content: { application/json: { schema: { $ref: "#/components/schemas/LibraryForceScanResult" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: Could not read settings or enqueue scans. , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/admin/apps/{id}/library/unpublished:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin, apps]
      summary: "\"Seen, not published\": observed appids with no enabled tile."
      description: >-
        Phase 4. THIS READ IS WHY library_observations RECORDS SUPPRESSED APPIDS AT ALL. A
        suppressed appid has no tile, so without this a game the built-in denylist wrongly caught
        would be invisible, with no surface on which an admin could find it - let alone allow it.
        It is a read of one table and a button, NOT a review queue: nothing waits on it, and the
        feature is fully correct for an operator who never opens it.
        {id} MUST BE A LIBRARY PROVIDER, and the refusal is 400 rather than 404 - deliberately, and
        never 200. A 200 would be the trap: these routes are keyed on (parent_app_id,
        external_source, external_id) and the reconciler only reads rules whose parent carries
        library_provider='steam', so anything addressed at an ordinary app is permanently inert, and
        the operator most likely to do it is the one already hunting for why a rule "isn't working".
        404 is wrong because the app is REAL - "no such app" and "the app is fine but unmarked" are
        two different mistakes with two different fixes, and collapsing them sends someone looking
        for a missing app that is sitting right there. The message names the remedy (set Library
        provider to Steam on the app) so it is ACTIONABLE, but as everywhere else it is for a human
        and MUST NOT BE PARSED - only `code` is contractual.
        The check reads library_provider and NEVER kind: an app styled as a Launcher without a
        provider set must fail it, and a provider app left at kind='game' must pass. That is
        §Derived tiles' "no server path branches on kind" promise cutting both ways.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryUnpublishedList" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/apps/{id}/library/rules:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin, apps]
      summary: The operator-written appid rules on this provider app (layer 2 of the denylist).
      description: >-
        Phase 4. Newest first. Layer 1 is a code constant and updating it is a release; this is the
        layer an operator can write, and it is overlaid at runtime OVER layer 1 - which is what
        makes a wrongly-denylisted game recoverable without waiting for a deploy.
        Same {id} rule as the sibling reads: 400 validation_failed for a REAL app that is not a
        library provider, 404 only for an app id that does not exist. Two different operator
        mistakes, two different fixes.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryRuleList" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/apps/{id}/library/rules/{external_id}:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { $ref: "#/components/parameters/PathExternalId" }
    put:
      tags: [admin, apps]
      summary: Ignore or un-ignore one appid (one route, two directions).
      description: >-
        Phase 4. rule:"ignore" is the Ignore action and it does THREE things in one transaction,
        NONE OF THEM A DELETE - writes the rule row, sets enabled=false on the tile if one exists,
        and revokes that tile's granted_by='provider' entitlements FLEET-WIDE (an Ignore is a fleet
        decision; a half-revoke would leave the tile live for everyone who happens not to be scanned
        next). It is not a delete because `apps` cascades to user_app_favourites and app_artwork, so
        deleting a junk tile destroys every user's favourite of it and its artwork row irreversibly
        - and the next scan re-creates a bare row anyway, because the appid is still on disk.
        Durability rests on two INDEPENDENT facts, deliberately, because either alone is a
        resurrection bug: the rule row makes the reconciler skip the appid, AND the reconciler never
        modifies an existing tile, so enabled=false is never flipped back.
        rule:"allow" outranks the built-in denylist and writes ONLY the rule row - it does NOT
        re-enable an existing disabled tile; the next scan republishes the appid through the ladder.
        That asymmetry is intentional: a tile may have been disabled by hand for a reason unrelated
        to discovery, and an un-ignore must not override the admin who did it.
        The primary key (parent_app_id, external_source, external_id) is the idempotency key, so a
        repeat is a REPLACE and never an accumulation. Audited as app.library.rule.set.
        The 400 on this route now covers TWO causes: a malformed appid, and a real {id} that is not
        a library provider - the latter checked INSIDE the write transaction, so a concurrent
        un-marking of the provider cannot slip a rule in behind it.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LibraryRuleWrite" } } }
      responses:
        "200": { description: Rule written., content: { application/json: { schema: { $ref: "#/components/schemas/LibraryRuleSetResult" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin, apps]
      summary: Drop a rule, returning the appid to whatever the built-in denylist says.
      description: >-
        Phase 4. Enables and disables NOTHING by itself - the next scan applies the ladder afresh.
        Takes the same optional ?external_source= (default "steam"); unlike the PUT it does not
        reject an unknown source with a 400, because an unknown source simply matches no rule and is
        therefore the 404 it already is. It DOES reject a real {id} that is not a library provider
        with a 400, like its three siblings. Its 404 deliberately collapses "no such app" and "no
        such rule" - the caller is deleting something that is not there either way, and separating
        them would confirm the existence of an app id to a request that named a rule.
        Audited as app.library.rule.delete.
      x-required-role: admin
      parameters:
        - name: external_source
          in: query
          required: false
          schema: { type: string, enum: [steam] }
          description: "Defaults to 'steam'. Provider-shaped vocabulary; only 'steam' exists today."
      responses:
        "204": { description: Rule deleted. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── cover artwork (UI-P7) ───────────────────────────────────────────────
  # The artwork provider SHIPS DARK: with no API key configured the control
  # plane makes no third-party request, writes no artwork, and every app keeps
  # cover_url/hero_url null - i.e. the gradient tile, exactly the pre-UI-P7
  # behaviour. The LOCAL half (upload, override, clear, serving) is available
  # regardless, because it contacts nothing.
  /v1/artwork/{asset}:
    parameters:
      - name: asset
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{64}\\.(jpg|png|webp)$" }
        description: >-
          The cached blob's CONTENT-ADDRESSED name: the lowercase hex SHA-256 of the image bytes
          plus an extension derived from the sniffed type. Nothing a remote supplies influences
          it, so path traversal is impossible by construction; anything not matching the pattern
          is 404, never 500.
    get:
      tags: [apps]
      summary: Serve a locally cached artwork image.
      description: >-
        UI-P7. DELIBERATELY UNAUTHENTICATED: a browser cannot attach a bearer token to an
        <img src>, so the URL is instead a capability - the path is a 256-bit content hash,
        unguessable, and reveals nothing about the app, the user or the catalogue. Responses
        carry X-Content-Type-Options: nosniff and an immutable long cache (the bytes at a
        content-addressed URL can never change). Art is always served from here and NEVER
        hotlinked from the provider: a self-hosted deployment must not depend on a third party
        at browse time, and hotlinking would report the whole library to that third party on
        every page view.
      responses:
        "200":
          description: The image.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/apps/{id}/artwork:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin, apps]
      summary: An app's artwork record + whether a provider is configured.
      x-required-role: admin
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/AppArtworkEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin, apps]
      summary: Override an app's artwork (fuzzy matching WILL be wrong sometimes).
      description: >-
        UI-P7. Exactly one intent per request. `provider_ref` accepts a candidate from
        POST .../artwork/search. `tile_url`/`hero_url` fetch operator-supplied art - the path for
        anything a games database does not have, including every desktop app. `rematch` re-runs
        automatic matching now instead of waiting for the background sweep; it REFUSES a locked
        record with 409 unless `force` is also sent (#385 - it previously cleared unconditionally,
        silently discarding the correction the flag exists to protect).
        An operator-supplied URL is ATTACKER-ADJACENT input (an operator pastes what they were
        sent) and goes through the same guards as a provider URL with no exception for admin
        privilege: http(s) only, resolved address must be publicly routable (loopback, RFC1918,
        link-local, CGNAT and cloud-metadata addresses are refused, including across redirects),
        at most 3 redirects, a byte cap, and the stored bytes must SNIFF as JPEG/PNG/WebP
        regardless of the Content-Type claimed. Any override sets locked=true, so the background
        sweep can never silently re-break the correction.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppArtworkWrite" } } }
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/AppArtworkEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin, apps]
      summary: Clear an app's artwork (back to the gradient tile).
      description: >-
        UI-P7. Removes the artwork record and NULLs cover_url/hero_url. Cached blobs are
        content-addressed and possibly shared with another app, so they are deliberately NOT
        deleted here; unreferenced ones are reclaimed by the service's orphan sweep.
      x-required-role: admin
      responses:
        "204": { description: Artwork cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/apps/{id}/artwork/search:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [admin, apps]
      summary: Search the configured artwork provider for candidate matches.
      description: >-
        UI-P7. With no provider configured this is 409 conflict - nothing is broken, the
        deployment simply has not opted in to a third party. An empty candidate list is a
        NORMAL result, not a failure.
      x-required-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string, description: "Defaults to the app's own name when absent or blank." }
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/AppArtworkCandidates" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/admin/apps/{id}/artwork/upload:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - name: crop
        in: query
        schema: { type: string, enum: [tile, hero], default: tile }
        description: "Which crop the uploaded image replaces."
    post:
      tags: [admin, apps]
      summary: Upload artwork for one crop (the always-available fallback).
      description: >-
        UI-P7. Raw image bytes with an image/* Content-Type. Needs no provider and no network,
        which is what makes an unmatched app - every desktop app included - a solved case rather
        than a permanent gradient. The body is capped by the server's own reader (not by the
        declared Content-Length) and the bytes must sniff as JPEG/PNG/WebP; SVG is refused
        outright as an executable document format. Sets locked=true.
      x-required-role: admin
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: OK., content: { application/json: { schema: { $ref: "#/components/schemas/AppArtworkEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: "The image exceeds the configured byte cap." }

  /v1/admin/artwork/reresolve:
    post:
      tags: [admin, apps]
      summary: Re-resolve artwork for the whole catalogue.
      description: >-
        #385. Clears and re-runs automatic matching for every app. Exists because a change to the
        PROVIDER QUERY cannot reach apps that already have a record - automatic resolution returns
        early for those by design - so the move to a 2:3 portrait tile crop would otherwise leave
        existing apps on their old landscape art forever. Deliberately an explicit admin action
        rather than a boot-time migration: the bytes come from a third party, and spending a
        deployment's third-party budget unasked would be the wrong default.
        LOCKED RECORDS ARE SKIPPED AND COUNTED, never overwritten; `force` is the only way past an
        operator's manual correction. Per-app failures are counted and stepped over, leaving that
        app with no record - which is the background sweep's own work-queue predicate, so it is
        retried on the next tick rather than lost. Orphaned blobs are reclaimed by the existing
        boot-time orphan sweep; no new reclamation path is added here.
      x-required-role: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean, description: "Also re-resolve locked records. Default false." }
      responses:
        "200":
          description: The sweep's counts.
          content:
            application/json:
              schema:
                type: object
                required: [total, resolved, skipped_locked, failed]
                properties:
                  total: { type: integer, description: "Apps considered." }
                  resolved: { type: integer, description: "Apps cleared and re-resolved." }
                  skipped_locked: { type: integer, description: "Apps left alone because their record is locked." }
                  failed: { type: integer, description: "Apps that errored; logged and stepped over." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─── hosts ───────────────────────────────────────────────────────────────
  /v1/hosts:
    get:
      tags: [hosts]
      summary: List hosts + capacity (admin).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/HostList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/hosts/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [hosts]
      summary: A single host (admin).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [hosts]
      summary: Forget an offline host (refuse-if-online-or-in-use).
      x-required-role: admin
      responses:
        "204": { description: Host forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/hosts/{id}/drain:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [hosts]
      summary: Cordon a host out of service.
      x-required-role: admin
      responses:
        "200": { description: Draining. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hosts/{id}/uncordon:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [hosts]
      summary: Return a host to service.
      x-required-role: admin
      responses:
        "200": { description: In service. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hosts/{id}/gpus:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [hosts]
      summary: "List a host's GPUs + capacity. (Not yet in control-api.md prose.)"
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/GPUsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── sessions ────────────────────────────────────────────────────────────
  /v1/sessions:
    get:
      tags: [sessions]
      summary: The caller's sessions (newest-first, owner-scoped).
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sessions]
      summary: Launch a session; returns signaling coordinates.
      description: |
        UI-P5 adds ONE NEW FAILURE MODE on this existing endpoint: a profile_id outside the
        app's launchable allow-list is 409 profile_not_launchable_for_app, and no session row
        persists.

        NO EXISTING SHAPE OR STATUS CODE CHANGES - 409 was already emitted here (profile
        overrides disabled, codec unsupported by host) and is already declared below. What is
        new is one error code, which is additive because Error.code is an open string with no
        enum: a client that does not know it falls through to its generic-409 branch. The new
        refusal is only reachable for an app an operator has explicitly restricted; every
        pre-UI-P5 app has an empty allow-list and is unaffected.

        409 rather than 400 or 403, deliberately. The id is valid and resolves, so 400
        validation_failed - this endpoint's answer for an UNKNOWN profile_id - would make "no
        such profile" and "this app does not offer it" indistinguishable. And 403 forbidden is
        the ROLE gate in this contract ("valid token, insufficient role", raised before any
        resource lookup); this refusal is per-app stream-quality curation and every caller gets
        the same answer. It sits with its two neighbours: profile_ineligible (409, the DEVICE
        refuses a valid profile) and conflict (409, the app's `force` policy refuses an
        override).

        Its OWN code rather than the generic conflict, because conflict on this endpoint already
        carries two unrelated conditions (overrides disabled, codec unsupported by the placed
        host) and this is the only recoverable one: it means the caller's menu is stale, so the
        remedy is to re-read GET /v1/me/profiles?app_id= and re-pick.

        THE UI FILTER IS NOT THE ENFORCEMENT. GET /v1/me/profiles?app_id= returns the filtered
        menu, but this endpoint checks the allow-list itself, regardless of client - exactly as
        admin endpoints are gated server-side regardless of client. AN EXPLICIT stream OVERRIDE
        DOES NOT BYPASS IT: stream carries no role gate here, so honouring it would let any
        authenticated caller defeat the allow-list with one extra field. Only an admin bypasses
        it (role read server-side).

        KNOWN GAP: POST /v1/sessions/{id}/swap does NOT re-resolve the profile, so a session
        launched on an unrestricted app keeps its wider stream when swapped into a restricted
        one. Deliberate - P2-07 swaps are no-resize and must not renegotiate. The allow-list is
        a launch-time rule.

        STEAM LIBRARY DISCOVERY PHASE 2 ADDS A NEW TERMINAL STATUS TO THIS ENDPOINT - 403
        forbidden - WHICH IS WHY THAT AMENDMENT IS NOT ADDITIVE. It is raised when the caller
        holds neither an 'all' nor a personal entitlement for app_id, and no session row
        persists. THIS IS THE AUTHORIZATION BOUNDARY OF THE WHOLE ENTITLEMENTS FEATURE; the
        entitlement-filtered GET /v1/apps is UX, and a client that ignores it and posts an app
        id directly is refused here.

        403 rather than 404: GET /v1/apps/{id} answers 404 for a non-entitled app precisely
        because a READ can afford to say nothing. A launch cannot - the caller named this app
        deliberately, and "no such app" would send them to report a broken catalogue instead of
        asking an admin for access. 403 rather than 409: the three 409s around it
        (profile_ineligible, profile_not_launchable_for_app, quota) all mean "valid request,
        wrong right now"; this one is a statement about the CALLER, which is what 403 means in
        this contract.

        CHECKED INSIDE THE SCHEDULING TRANSACTION, BEFORE THE QUOTA CHECK AND BEFORE PLACEMENT.
        Authorization precedes resource accounting - a caller who is both unentitled and at
        their session limit must be told "you may not launch this", not "you have too many
        sessions" - and nothing is reserved for a launch that is going to be refused. It applies
        to EVERY ROLE, admin included; an admin who wants to launch an app they have restricted
        grants themselves the entitlement (POST /v1/admin/apps/{id}/entitlements), which is one
        call and leaves an audit row.

        STEAM LIBRARY DISCOVERY PHASE 3 ADDS TWO 409 CONDITIONS, BOTH ADDITIVE (409 was already
        declared on this endpoint, and Error.code is an open string).

        home_in_use is NOT a new code - P5-01 has emitted it since managed homes shipped. What
        Phase 3 changes is WHAT IT KEYS ON and WHAT IT CARRIES. The single-writer rule is per
        (user, HOME-OWNING app), and a derived tile does not own a home: it borrows its parent's.
        So the guard resolves parent_app_id ?? id before counting, and a user with a Steam
        session live is refused on EVERY tile derived from it, and vice versa. IT IS ONE LOCK,
        held by the parent's home, and the launcher tile is simply its most visible holder. Two
        Steam clients on one steamapps tree is a documented corruption class (a mid-write death
        marks the install unclean and forces a full re-verify), so this is correctness, not a
        limitation to engineer around. The body now carries session_id, the conflicting session.
        THE CLIENT MUST RENDER IT AS "Steam is already running - go to your session", NAMING THE
        LAUNCHER TILE (what the user sees in their library) RATHER THAN A PARENT APP ID, and
        never as a generic launch failure: from the user's side they clicked a game and were told
        a different app is in the way.

        home_not_provisioned (409) IS a new code. A derived tile provisions nothing - the launch
        path calls RequireHome, which reads and never creates - so a user with no home for
        (user, parent) on any host is refused BEFORE placement, and NO user_homes ROW IS CREATED.
        The message names the parent app: "launch <Steam app> once on a host to create your
        library, then try again." Deliberately stricter than the existing locality preference: a
        derived tile is pinned HARD to the host holding the home (via the existing PinHostID
        machinery) and cannot fall back to a free host, because a session that refuses to start
        is recoverable in one click while a session that silently creates a second empty Steam
        library is a support ticket and a wasted disk.

        AND A THIRD, ADDED BY REVIEW RATHER THAN BY THE SPEC: 409 parent_app_disabled.

        A TILE'S OWN enabled AND ITS PARENT'S enabled ARE ANDed AT LAUNCH. Launching a derived
        tile whose parent app is disabled is 409 parent_app_disabled, and the message NAMES the
        parent. This is a deliberate deviation from the implementation spec's own field table,
        which lists `enabled` under "lives on the tile" and genuinely reads the other way. That
        table says which ROW a field is read FROM; it does not say the parent's `enabled` is
        irrelevant. A tile has NO INDEPENDENT EXISTENCE - image, runtime, mounts and home are all
        the parent's - so launching a tile IS running the parent, and `enabled = false` on an app
        in this system means "stop this from running".

        Without it that demonstrably did not hold: a reviewer verified empirically that a
        disabled parent's tiles still launched, dispatching the disabled parent's image against
        the disabled parent's home, with no error and nothing in any UI warning the operator -
        because the tiles are separate rows and they still look enabled. An operator taking Steam
        out of service over a bad image tag, a mid-upgrade window or an incident would have had
        the inverse of a kill switch.

        THE TILE IS NOT MODIFIED AND STILL APPEARS IN THE CALLER'S LIBRARY. Its own `enabled` is
        untouched and GET /v1/apps still lists it, so this is not derivable from the app object
        and a client cannot pre-empt it. That asymmetry is why it gets ITS OWN CODE rather than
        the generic conflict, on the same reasoning as home_not_provisioned: the remedy is an
        action on a DIFFERENT app by SOMEONE ELSE (an operator re-enabling the parent), and a
        client cannot derive that from a message string it is not allowed to parse. It is not the
        caller's fault and there is nothing they can do about it.

        THE PARENT'S NAME IS IN THE MESSAGE, NOT IN A STRUCTURED FIELD, and unlike home_in_use's
        session_id that is deliberate: session_id exists because a client turns it into a link and
        must branch on its presence, whereas this has no client action attached - there is nothing
        to navigate to. A field nobody consumes is contract surface with no purchase. The message
        is human-readable and forwardable ("ask an operator to re-enable it"); it is NOT a
        machine-readable channel and must not be parsed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchRequest" }
      responses:
        "201":
          description: Session assigned.
          content: { application/json: { schema: { $ref: "#/components/schemas/LaunchResponse" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Phase 2, NEW TERMINAL STATUS ON THIS ENDPOINT: the caller holds no entitlement for
            app_id. No session row persists.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            session_quota_exceeded / home_in_use / profile_ineligible /
            profile_not_launchable_for_app / conflict (pre-existing), or (Phase 3)
            home_not_provisioned - a derived tile whose parent has no home on any host - or
            parent_app_disabled.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sessions/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [sessions]
