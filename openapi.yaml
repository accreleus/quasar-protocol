# Quasar control-plane API — OpenAPI 3.1 schema.
#
# FROZEN-INTERFACE ARTIFACT. This is a faithful machine rendering of the prose
# contract in control-api.md; control-api.md stays authoritative. Changes follow
# the same additive + Opus + human-sign-off rules as the prose contract.
#
# Kept honest by the route-coverage drift test in
# control-plane/cmd/quasar-control/openapi_drift_test.go: every /v1 route the
# server registers must appear here (and vice-versa). Do not hand-remove a path
# to make that test pass — reconcile against the running router.
#
# Authoring note (2026-07-10): several registered routes are NOT yet in control-api.md
# prose (admin/apps, admin/profile-policy, admin/stream-profiles, hosts/{id}/gpus,
# me/profile-preferences, users, users/{id}). Their bodies here were transcribed from
# the web client's typed contract (web/src/api/types.ts) and validated live by the
# conformance harness (deploy/run-apitest.sh) — but the prose contract still needs the
# amendment + sign-off (see docs/design/plans/openapi-contract-drift-report.md). A few
# admin trace/storage/cert routes remain loosely typed (type: object) pending shapes.
openapi: 3.1.0
info:
  title: Quasar Control-Plane API
  version: "1.0.0"
  description: |
    The public/control API of the Quasar control plane (`/v1`). JSON in/out.
    All endpoints except `/v1/auth/register` and `/v1/auth/login` require
    `Authorization: Bearer <access_token>`. Admin endpoints (tagged
    `x-required-role: admin`) reject a valid non-admin token with 403 — the gate
    is server-enforced (`RequireAuth → RequireAdmin`), never UI-gated.
servers:
  - url: http://{host}:{port}
    description: |
      A Quasar control-plane instance (e.g. hermes :8080, tower :18080). The server
      base carries NO path prefix — every path below is absolute from the origin and
      begins with /v1 (this matches the Go router's registered patterns, which the
      drift test compares against).
    variables:
      host: { default: "localhost" }
      port: { default: "8080" }

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, logout, current-user.
  - name: me
    description: Caller-self surface (devices, profiles, storage, password).
  - name: apps
    description: The app library (public read; admin write).
  - name: sessions
    description: Session launch + lifecycle + client telemetry/trace.
  - name: hosts
    description: Host/GPU oversight + lifecycle (admin).
  - name: admin
    description: Admin oversight — settings, invites, storage, sessions, host config, certification.
  - name: users
    description: User administration (admin).
  - name: agent
    description: Node-agent ↔ control-plane internal endpoints (not operator-facing).
  - name: signaling
    description: WebRTC signaling (WebSocket; not a REST body — see signaling.md).

paths:
  # ─── auth ────────────────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new account (role always 'user'; invite-gated per instance settings).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "403": { description: "registration_closed — the invitation system is off (default)." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Log in; returns the opaque bearer access_token (field is access_token, not token).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the presented bearer token (idempotent).
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me:
    get:
      tags: [auth]
      summary: The current user.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/password:
    post:
      tags: [me]
      summary: Change own password (revokes all tokens; must re-authenticate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: Password rotated; all tokens revoked. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── me (devices / profiles / storage) ───────────────────────────────────
  /v1/me/devices:
    get:
      tags: [me]
      summary: List the caller's devices (newest-first).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      summary: Upsert the caller's device capability probe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceUpsert" }
      responses:
        "200":
          description: Device recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/devices/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    patch:
      tags: [me]
      summary: Rename / set trust on an owned device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                trusted: { type: boolean }
      responses:
        "200":
          description: Updated device.
          content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [me]
      summary: Revoke an owned device (expires its tokens).
      responses:
        "204": { description: Device revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/me/profiles:
    get:
      tags: [me]
      summary: Stream-profile eligibility + recommendation for the caller's device.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/storage:
    get:
      tags: [me]
      summary: The caller's own per-app storage usage.
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/MyStorageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/profile-preferences:
    get:
      tags: [me]
      summary: "Read the caller's stream-profile preferences. (Not yet in control-api.md prose.)"
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: "Update the caller's stream-profile preferences. (Not yet in control-api.md prose.)"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePreferencesResponse" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── apps ────────────────────────────────────────────────────────────────
  /v1/apps:
    get:
      tags: [apps]
      summary: List enabled apps (public library).
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppList" }
    post:
      tags: [apps]
      summary: Create an app.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppWrite" }
      responses:
        "201":
          description: App created.
          content:
            application/json:
              schema:
                type: object
                required: [app]
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/apps/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [apps]
      summary: A single app (requires auth; response is wrapped in {app}).
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [apps]
      summary: Edit an app.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AppWrite" } } }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [app]
                properties:
                  app: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [apps]
      summary: Remove an app from the catalog (refuse-if-in-use).
      x-required-role: admin
      responses:
        "204": { description: App removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/apps:
    get:
      tags: [admin, apps]
      summary: "List all apps incl. disabled + admin fields. (Not yet in control-api.md prose.)"
      x-required-role: admin
      responses:
        "200":
          description: OK.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminAppsResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── hosts ───────────────────────────────────────────────────────────────
  /v1/hosts:
    get:
      tags: [hosts]
      summary: List hosts + capacity (admin).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/HostList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/hosts/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [hosts]
      summary: A single host (admin).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [hosts]
      summary: Forget an offline host (refuse-if-online-or-in-use).
      x-required-role: admin
      responses:
        "204": { description: Host forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/hosts/{id}/drain:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [hosts]
      summary: Cordon a host out of service.
      x-required-role: admin
      responses:
        "200": { description: Draining. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hosts/{id}/uncordon:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [hosts]
      summary: Return a host to service.
      x-required-role: admin
      responses:
        "200": { description: In service. , content: { application/json: { schema: { $ref: "#/components/schemas/Host" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/hosts/{id}/gpus:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [hosts]
      summary: "List a host's GPUs + capacity. (Not yet in control-api.md prose.)"
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/GPUsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── sessions ────────────────────────────────────────────────────────────
  /v1/sessions:
    get:
      tags: [sessions]
      summary: The caller's sessions (newest-first, owner-scoped).
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sessions]
      summary: Launch a session; returns signaling coordinates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchRequest" }
      responses:
        "201":
          description: Session assigned.
          content: { application/json: { schema: { $ref: "#/components/schemas/LaunchResponse" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sessions/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [sessions]
      summary: Poll a session's lifecycle (owner or admin).
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Stop a session (owner or admin; idempotent).
      responses:
        "202": { description: Teardown requested. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/stats:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Client posts its session telemetry (owner or admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StatsRequest" } } }
      responses:
        "202": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}/swap:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Swap the running app without WebRTC teardown (owner or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id: { type: string, format: uuid }
      responses:
        "200": { description: Swapped. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/trace/clock:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Client posts a client↔host clock-offset estimate (owner or admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TraceClockRequest" } } }
      responses:
        "202": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/sessions/{id}/trace/events:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Client posts its session's browser trace events (owner or admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TraceEventsRequest" } } }
      responses:
        "202": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── users (admin) ───────────────────────────────────────────────────────
  /v1/users:
    get:
      tags: [users]
      summary: "List users (admin). (Not yet in control-api.md prose.)"
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/AdminUsersResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/users/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    patch:
      tags: [users]
      summary: "Update a user (role/quota/disable). (Not yet in control-api.md prose.)"
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminUserUpdate" } } }
      responses:
        "200": { description: Updated. , content: { application/json: { schema: { $ref: "#/components/schemas/AdminUser" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      summary: "Delete a user (admin). (Not yet in control-api.md prose.)"
      x-required-role: admin
      responses:
        "204": { description: User deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── admin: settings / invites ───────────────────────────────────────────
  /v1/admin/settings:
    get:
      tags: [admin]
      summary: Read instance settings (registration_mode, …).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SettingsEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      summary: Update instance settings.
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SettingsEnvelope" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/invites:
    get:
      tags: [admin]
      summary: List minted invites (never the plaintext code).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { type: object, properties: { invites: { type: array, items: { $ref: "#/components/schemas/Invite" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Mint a magic one-time invite link (code returned once).
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                max_uses: { type: integer, default: 1 }
                expires_at: { type: string, format: date-time }
                note: { type: string }
      responses:
        "201": { description: Invite minted. , content: { application/json: { schema: { type: object, properties: { invite: { $ref: "#/components/schemas/InviteMinted" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/invites/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    delete:
      tags: [admin]
      summary: Revoke an invite (idempotent).
      x-required-role: admin
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─── admin: storage ──────────────────────────────────────────────────────
  /v1/admin/storage/homes:
    get:
      tags: [admin]
      summary: List managed homes (storage oversight).
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/AdminHomesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/storage/homes/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    delete:
      tags: [admin]
      summary: Tombstone a managed home for GC.
      x-required-role: admin
      responses:
        "204": { description: Tombstoned. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── admin: host runtime config ──────────────────────────────────────────
  /v1/admin/config/catalog:
    get:
      tags: [admin]
      summary: Read the host-settings knob catalog.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/ConfigCatalogResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/hosts/{id}/settings:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [admin]
      summary: Read a host's resolved settings + overrides.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/HostSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: Update per-host overrides (body is {overrides, restart_confirm} — 'settings' is ignored).
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostSettingsPatch" }
      responses:
        "200": { description: New effective state. , content: { application/json: { schema: { $ref: "#/components/schemas/HostSettings" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "restart_required — a restart-class knob changed with live sessions and restart_confirm != true (body carries live_sessions)." , content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /v1/admin/hosts/{id}/restart:
