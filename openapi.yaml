  # ─── sessions ────────────────────────────────────────────────────────────
  /v1/sessions:
    get:
      tags: [sessions]
      summary: The caller's sessions (newest-first, owner-scoped).
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sessions]
      summary: Launch a session; returns signaling coordinates.
      description: |
        UI-P5 adds ONE NEW FAILURE MODE on this existing endpoint: a profile_id outside the
        app's launchable allow-list is 409 profile_not_launchable_for_app, and no session row
        persists.

        NO EXISTING SHAPE OR STATUS CODE CHANGES - 409 was already emitted here (profile
        overrides disabled, codec unsupported by host) and is already declared below. What is
        new is one error code, which is additive because Error.code is an open string with no
        enum: a client that does not know it falls through to its generic-409 branch. The new
        refusal is only reachable for an app an operator has explicitly restricted; every
        pre-UI-P5 app has an empty allow-list and is unaffected.

        409 rather than 400 or 403, deliberately. The id is valid and resolves, so 400
        validation_failed - this endpoint's answer for an UNKNOWN profile_id - would make "no
        such profile" and "this app does not offer it" indistinguishable. And 403 forbidden is
        the ROLE gate in this contract ("valid token, insufficient role", raised before any
        resource lookup); this refusal is per-app stream-quality curation and every caller gets
        the same answer. It sits with its two neighbours: profile_ineligible (409, the DEVICE
        refuses a valid profile) and conflict (409, the app's `force` policy refuses an
        override).

        Its OWN code rather than the generic conflict, because conflict on this endpoint already
        carries two unrelated conditions (overrides disabled, codec unsupported by the placed
        host) and this is the only recoverable one: it means the caller's menu is stale, so the
        remedy is to re-read GET /v1/me/profiles?app_id= and re-pick.

        THE UI FILTER IS NOT THE ENFORCEMENT. GET /v1/me/profiles?app_id= returns the filtered
        menu, but this endpoint checks the allow-list itself, regardless of client - exactly as
        admin endpoints are gated server-side regardless of client. AN EXPLICIT stream OVERRIDE
        DOES NOT BYPASS IT: stream carries no role gate here, so honouring it would let any
        authenticated caller defeat the allow-list with one extra field. Only an admin bypasses
        it (role read server-side).

        KNOWN GAP: POST /v1/sessions/{id}/swap does NOT re-resolve the profile, so a session
        launched on an unrestricted app keeps its wider stream when swapped into a restricted
        one. Deliberate - P2-07 swaps are no-resize and must not renegotiate. The allow-list is
        a launch-time rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaunchRequest" }
      responses:
        "201":
          description: Session assigned.
          content: { application/json: { schema: { $ref: "#/components/schemas/LaunchResponse" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sessions/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [sessions]
      summary: Poll a session's lifecycle (owner or admin).
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Stop a session (owner or admin; idempotent).
      responses:
        "202": { description: Teardown requested. , content: { application/json: { schema: { $ref: "#/components/schemas/SessionEnvelope" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sessions/{id}/stats:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Client posts its session telemetry (owner or admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StatsRequest" } } }
      responses:
        "202": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/sessions/{id}/signaling-token:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [sessions]
      summary: Mint fresh signaling coordinates for the same live session.
      responses:
        "201":
          description: Independent single-use token created.
          content: { application/json: { schema: { $ref: "#/components/schemas/SignalingEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/sessions/{id}/swap:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
