  /v1/admin/hosts/{id}/encoder-certification/runs:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [admin]
      summary: Open a certification run (reserve per-host lock; return the cell plan).
      x-required-role: admin
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CertRunRequest" } } }
      responses:
        "201": { description: Run opened. , content: { application/json: { schema: { $ref: "#/components/schemas/CertRun" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/admin/hosts/{id}/encoder-certification/runs/{run_id}:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: Poll a certification run's status/progress.
      x-required-role: admin
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/CertRunStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/hosts/{id}/encoder-certification/runs/{run_id}/complete:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { name: run_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Close the run (release the per-host lock).
      x-required-role: admin
      responses:
        "200": { description: Run closed. , content: { application/json: { schema: { $ref: "#/components/schemas/CertRunStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/hosts/{id}/encoder-certification/cells:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [admin]
      summary: Launch one pinned bench cell.
      x-required-role: admin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CertCellRequest" } } }
      responses:
        "201": { description: Cell launched. , content: { application/json: { schema: { $ref: "#/components/schemas/CertCell" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/hosts/{id}/encoder-certification/cells/{session_id}/finalize:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Derive the verdict from agent metrics, upsert + teardown the cell.
      x-required-role: admin
      responses:
        "200": { description: Verdict derived. , content: { application/json: { schema: { $ref: "#/components/schemas/CertFinalize" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─── agent-internal ──────────────────────────────────────────────────────
  /v1/agent/storage/gc-pending:
    get:
      tags: [agent]
      summary: "Node-agent internal: list homes pending GC. (Not operator-facing.)"
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/GCPendingResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/agent/storage/gc-confirm:
    post:
      tags: [agent]
      summary: "Node-agent internal: confirm GC of reaped homes. (Not operator-facing.)"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GCConfirmRequest" } } }
      responses:
        "200": { description: OK. , content: { application/json: { schema: { $ref: "#/components/schemas/GCConfirmResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─── signaling (WebSocket) ───────────────────────────────────────────────
  /v1/signal:
    get:
      tags: [signaling]
      summary: WebRTC signaling channel (WebSocket upgrade; not a REST body).
      description: |
        Upgrades to a WebSocket carrying the signaling protocol (offer/answer/ICE).
        Authenticated by the single-use `?token=<...>` minted in the launch response,
        NOT a bearer header. The frame protocol is defined in protocol/signaling.md;
        OpenAPI cannot model it — this stub exists only for route-coverage completeness.
      security: []
      x-websocket: true
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: "Single-use signaling token from the launch response." }
      responses:
        "101": { description: Switching Protocols (WebSocket). }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "The opaque access_token from POST /v1/auth/login (Authorization: Bearer <access_token>)."

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid/expired/revoked token.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Forbidden:
      description: Authenticated but insufficient role / not the owner (precedes resource lookup).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: No such resource.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Conflict:
      description: Conflict (duplicate, in-use, quota, non-swappable, home-in-use, …).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ValidationFailed:
      description: Malformed or invalid request.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Too many requests.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unavailable:
      description: "no_host_available / capacity_exhausted — well-formed but no room to place now (retryable)."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  schemas:
    Role:
      type: string
      enum: [user, admin]
    RegistrationMode:
      type: string
      enum: [closed, invite_only, open]
    Encoder:
      type: string
      enum: [openh264, va, nvenc, vulkan]
    H264Profile:
      type: string
      enum: [constrained-baseline, baseline, main, high]
    SessionState:
      type: string
      enum: [pending, assigned, starting, running, stopping, stopped, failed]

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "e.g. validation_failed, unauthorized, forbidden, not_found, conflict, session_quota_exceeded, no_host_available, capacity_exhausted, restart_required, rate_limited, internal." }
        message: { type: string }
        live_sessions: { type: integer, description: "Present on restart_required." }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    User:
      type: object
      required: [id, email, username, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time, description: "Present on /v1/me + register; omitted from the login user." }

    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string }
        invite_code: { type: string, description: "Required when registration_mode = invite_only." }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device_key: { type: string, description: "Optional; binds the minted token to this device (LP-SEC-01)." }
        client_version: { type: string, description: "Optional; native client (P9-01)." }
        contract_version: { type: string, description: "Optional; native client (P9-01)." }
    LoginResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token: { type: string, description: "The opaque bearer token — the field is access_token, NOT token." }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        min_client_version: { type: string }
        latest_client_version: { type: string }

    Device:
      type: object
      # Shared by the list (full shape) + the upsert response (id/first_seen_at/last_seen_at
      # only), so `required` is the intersection always present in every response.
      required: [id, first_seen_at, last_seen_at]
      properties:
        id: { type: string, format: uuid }
        device_key: { type: string }
        name: { type: string }
        trusted: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
        active_session_id: { type: [string, "null"], format: uuid }
        capabilities: { type: object, additionalProperties: true }
    DeviceUpsert:
      type: object
      properties:
        device_key: { type: string }
        capabilities: { type: object, additionalProperties: true }

    Stream:
      type: object
      # Shared shape: session.stream carries h264_profile + playout0_ms; an app's
      # display_stream carries only width/height/fps/bitrate_kbps. `required` is the
      # intersection present in both contexts.
      required: [width, height, fps, bitrate_kbps]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate_kbps: { type: integer }
        h264_profile: { $ref: "#/components/schemas/H264Profile" }
        playout0_ms: { type: integer, description: "AS-02: tier-selected initial receiver playout target (ms) on session.stream; absent on an app's display_stream." }
    AppListItem:
      type: object
      required: [id, name, description, cover_url, default_width, default_height, default_fps, default_bitrate_kbps, default_profile_id, profile_policy, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        cover_url: { type: [string, "null"] }
        default_width: { type: integer }
        default_height: { type: integer }
        default_fps: { type: integer }
        default_bitrate_kbps: { type: integer }
        default_profile_id: { type: [string, "null"] }
        profile_policy: { type: string, enum: [inherit, prefer, force, custom] }
        display_stream: { $ref: "#/components/schemas/Stream" }
        enabled: { type: boolean }
    AppList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AppListItem" }
        next_cursor: { type: [string, "null"] }
    App:
      allOf:
        - { $ref: "#/components/schemas/AppListItem" }
    RuntimeSpec:
      type: object
      description: "Agent-internal container spec (not exposed on public read shapes)."
      properties:
        image: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        mounts: { type: array, items: { type: string } }
        gpu: { type: boolean }
    AppWrite:
      type: object
      required: [name]
      description: "Admin create/edit shape. runtime_spec + resource defaults are admin/scheduler-internal."
      properties:
        name: { type: string }
        description: { type: string }
        cover_url: { type: [string, "null"] }
        enabled: { type: boolean }
        default_width: { type: integer }
        default_height: { type: integer }
        default_fps: { type: integer }
        default_bitrate_kbps: { type: integer }
        default_profile_id: { type: [string, "null"] }
        runtime_spec: { $ref: "#/components/schemas/RuntimeSpec" }

    Session:
      type: object
      # health_state/health_reason are additive (present only when running/unsustainable);
      # every other key is always serialized (nullable ones present-but-null).
      required: [id, user_id, app_id, host_id, state, state_detail, error_message, profile_id, stream, created_at, started_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        host_id: { type: [string, "null"], format: uuid }
        state: { $ref: "#/components/schemas/SessionState" }
        state_detail: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        profile_id: { type: [string, "null"] }
        stream: { $ref: "#/components/schemas/Stream" }
        health_state:
          type: string
          description: "AS10-06: computed stream-health classification; present only when the session is running/unsustainable."
          enum: [healthy, network_degrading, abr_at_floor, client_decode_degrading, client_presentation_degrading, unsustainable, failed]
        health_reason: { type: string, description: "AS10-06: optional human explanation accompanying a degraded health state." }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    SessionEnvelope:
      type: object
      required: [session]
      properties:
        session: { $ref: "#/components/schemas/Session" }
    SessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        next_cursor: { type: [string, "null"] }
    LaunchRequest:
      type: object
      required: [app_id]
      properties:
        app_id: { type: string, format: uuid }
        profile_id: { type: string, description: "User-facing selector (AS10-03)." }
        client_type: { type: string, enum: [browser, native], description: "Absent ⇒ browser." }
        stream:
          type: object
          description: "Admin/debug/back-compat override; beats profile_id field-by-field."
          properties:
            width: { type: integer }
            height: { type: integer }
            fps: { type: integer }
            bitrate_kbps: { type: integer }
            h264_profile: { $ref: "#/components/schemas/H264Profile" }
    LaunchResponse:
      type: object
      required: [session, signaling]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        signaling:
          type: object
          required: [url, token, expires_at]
          properties:
            url: { type: string, description: "wss://<host>/v1/signal" }
            token: { type: string, description: "Single-use, short-TTL, plaintext this response only." }
            expires_at: { type: string, format: date-time }

    Host:
      type: object
      # crud/handler.go hostResp — every key is always serialized (nullable ones present-but-null).
      required: [id, node_name, status, agent_version, cpu_cores, mem_mb, cpu_model, capacity_detection, capacity_reason, last_registered_at, last_heartbeat_at, storage]
      properties:
        id: { type: string, format: uuid }
        node_name: { type: string }
        status: { type: string, enum: [online, offline, draining] }
        agent_version: { type: [string, "null"] }
        cpu_cores: { type: [integer, "null"] }
        mem_mb: { type: [integer, "null"] }
        # host-observability-2: agent-reported CPU marketing name; null until reported.
        cpu_model: { type: [string, "null"] }
        capacity_detection: { type: string, enum: [ok, unavailable, failed], description: "Fresh GPU capacity detection state; only ok is schedulable." }
        capacity_reason: { type: [string, "null"], maxLength: 512, description: "Bounded diagnostic when capacity is unavailable or failed." }
        last_registered_at: { type: [string, "null"], format: date-time }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        storage:
          # host-observability amendment: agent-reported storage volumes (capacity report);
          # null until an amendment-aware agent reports.
          type: [array, "null"]
          items: { $ref: "#/components/schemas/StorageVolume" }
    StorageVolume:
      type: object
      required: [label, path, total_mb, available_mb]
      properties:
        label: { type: string }
        path: { type: string }
        total_mb: { type: integer }
        available_mb: { type: integer }
    HostList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Host" }
        next_cursor: { type: [string, "null"] }
    HostSettings:
      type: object
      description: "GET returns pending_restart; PATCH returns restart_triggered — otherwise same shape."
      properties:
        resolved: { type: object, additionalProperties: true }
        overrides: { type: object, additionalProperties: true }
        # host-observability amendment: agent-reported env←overrides overlay from its latest
        # capacity report (agent-api.md effective_settings); null when never reported.
        effective:
          type: [object, "null"]
          additionalProperties: { type: string }
        pending_restart: { type: boolean }
        restart_triggered: { type: boolean }
    HostRestartRequest:
      type: object
      properties:
        confirm:
          type: boolean
          description: "Required true to restart while the host has live sessions (mirrors HostSettingsPatch.restart_confirm)."
    HostRestartResponse:
      type: object
      required: [restart_triggered]
      properties:
        restart_triggered: { type: boolean }
    HostSettingsPatch:
      type: object
      required: [overrides]
      description: "The field is 'overrides' — a top-level 'settings' key is silently ignored. A null value clears an override."
      properties:
        overrides:
          type: object
          additionalProperties: true
        restart_confirm:
          type: boolean
          description: "Required true to apply a restart-class knob while the host has live sessions."

    SettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          required: [registration_mode, updated_by, updated_at]
          properties:
            registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
            updated_by: { type: [string, "null"], format: uuid }
            updated_at: { type: string, format: date-time }

    Invite:
      type: object
      description: "List shape — never carries the plaintext code."
      required: [id, code_prefix, role, max_uses, used_count, expires_at, revoked_at, note, created_at]
      properties:
        id: { type: string, format: uuid }
        code_prefix: { type: string, description: "First 8 hex of code_hash — a stable non-secret handle." }
        role: { $ref: "#/components/schemas/Role" }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    InviteMinted:
      type: object
      description: "POST /v1/admin/invites 201 body's `invite` — the plaintext code + magic link, ONCE. Distinct shape from the Invite list row (no code_prefix/revoked_at/note)."
      required: [id, code, role, max_uses, used_count, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Plaintext, returned once, never retrievable again." }
        invite_url: { type: string, description: "Present only when the server has a configured public base URL." }
        role: { $ref: "#/components/schemas/Role" }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    # ─── admin: apps ──────────────────────────────────────────────────────────
    AdminApp:
      allOf:
        - { $ref: "#/components/schemas/App" }
        - type: object
          description: "Admin-visible app shape: includes runtime_spec + resource/storage defaults (P2-08, P5-01)."
          required: [default_vram_mb, default_encode_slots, runtime_spec, managed_home, home_container_path]
          properties:
            default_vram_mb: { type: integer }
            default_encode_slots: { type: integer }
            runtime_spec: { type: object, additionalProperties: true }
            managed_home: { type: boolean, description: "P5-01: whether this app provisions a per-user managed home directory." }
            home_container_path: { type: string, description: "P5-01: container path where the home is mounted (default /home/quasar)." }
    AdminAppsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminApp" }
        next_cursor: { type: [string, "null"] }

    # ─── hosts: GPU availability ────────────────────────────────────────────────
    GPUAvailability:
      type: object
      description: "One GPU's capacity from GET /v1/hosts/{id}/gpus."
      required: [gpu_id, gpu_index, vendor, model, vram_mb_total, vram_mb_reserved, slots_total, slots_reserved, active_sessions, render_node]
      properties:
        gpu_id: { type: string }
        gpu_index: { type: integer }
        vendor: { type: string }
        model: { type: string }
        vram_mb_total: { type: integer }
        vram_mb_reserved: { type: integer }
        slots_total: { type: integer }
        slots_reserved: { type: integer }
        active_sessions: { type: integer }
        # host-observability-2: stable by-path render-node device path for this GPU
        # (valid as a render_node setting value); null until reported.
        render_node: { type: [string, "null"] }
    GPUsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GPUAvailability" }

    # ─── stream profiles / policy (AS10-01/02) ───────────────────────────────────
    StreamProfile:
      type: object
      description: "A first-class stream profile (AS10-01). Codec-agnostic; H.264 is launchable today, HEVC/AV1 are placeholders."
      required: [id, display_name, width, height, fps, codecs, h264_profile, nominal_bitrate_kbps, min_offer_bandwidth_kbps, recommended_offer_bandwidth_kbps, headroom_factor, abr_floor_kbps, max_startup_rtt_ms, min_decode_height, high_refresh_display, hardware_encoder_required, browser_client, playout0_ms, visibility]
      properties:
        id: { type: string }
        display_name: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        codecs:
          type: array
          items:
            type: object
            required: [codec, status]
            properties:
              codec: { type: string }
              status: { type: string, enum: [launchable, future, unsupported] }
        h264_profile: { type: string }
        nominal_bitrate_kbps: { type: integer }
        min_offer_bandwidth_kbps: { type: integer }
        recommended_offer_bandwidth_kbps: { type: integer }
        headroom_factor: { type: number }
        abr_floor_kbps: { type: integer }
        max_startup_rtt_ms: { type: integer }
        min_decode_height: { type: integer }
        high_refresh_display: { type: string, enum: [none, recommended, required] }
        hardware_encoder_required: { type: boolean }
        browser_client: { type: string, enum: [recommended, supported, risky] }
        playout0_ms: { type: integer }
        visibility: { type: string, enum: [user, debug, internal] }
    AdminStreamProfilesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StreamProfile" }
    ProfileReason:
      type: object
      description: "A stable reason code + message explaining an eligibility decision (AS10-02)."
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ProfileEvaluation:
      allOf:
        - { $ref: "#/components/schemas/StreamProfile" }
        - type: object
          description: "Per-profile eligibility verdict from GET /v1/me/profiles (AS10-02)."
          required: [eligibility, reasons]
          properties:
            eligibility: { type: string, enum: [eligible, risky, ineligible] }
            reasons:
              type: array
              items: { $ref: "#/components/schemas/ProfileReason" }
    ProfilesResponse:
      type: object
      description: "GET /v1/me/profiles response (AS10-02): eligibility + recommendation."
      required: [recommended_id, confidence, notes, profiles]
      properties:
        recommended_id: { type: string }
        confidence: { type: string, enum: [high, low] }
        notes:
          type: array
          items: { $ref: "#/components/schemas/ProfileReason" }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/ProfileEvaluation" }
    ProfilePolicyResponse:
      type: object
      properties:
        global_default_profile_id: { type: [string, "null"] }
        user_overrides_allowed: { type: boolean }
    ProfilePreferencesResponse:
      type: object
      properties:
        default_profile_id: { type: [string, "null"] }
        global_default_profile_id: { type: [string, "null"] }
        user_overrides_allowed: { type: boolean }

    # ─── admin: users ─────────────────────────────────────────────────────────
    AdminUser:
      type: object
      description: "User record from GET /v1/users (admin)."
      required: [id, email, username, role, disabled, max_concurrent_sessions, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        max_concurrent_sessions: { type: integer }
        created_at: { type: string, format: date-time }
    AdminUsersResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_cursor: { type: [string, "null"] }
    AdminUserUpdate:
      type: object
      description: "PATCH /v1/users/{id} request body — role/quota/disable, all fields optional."
      properties:
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        max_concurrent_sessions: { type: integer }

    # ─── admin: sessions + telemetry ─────────────────────────────────────────────
    AgentMetrics:
      type: object
      description: "Metrics from the node-agent encode pipeline."
      properties:
        fps: { type: number }
        bitrate_kbps: { type: integer }
        encode_ms: { type: number }
        frames_encoded: { type: integer }
        frames_dropped: { type: integer }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        overlay_frames: { type: integer }
    BrowserMetrics:
      type: object
      description: "Metrics from the browser WebRTC client."
      properties:
        fps: { type: number }
        bitrate_kbps: { type: integer }
        rtt_ms: { type: number }
        jitter_buffer_ms: { type: number }
        decode_ms: { type: number }
        packets_lost: { type: integer }
        frames_dropped: { type: integer }
        present_fps: { type: number }
        present_interval_sd_ms: { type: number }
        present_interval_p95_ms: { type: number }
        playout_target_ms: { type: number }
        glass_to_glass_ms: { type: number }
        encode_ms: { type: number }
        network_pacing_ms: { type: number }
        decode_display_ms: { type: number }
        is_hidden: { type: integer, description: "AS10-11: tab visibility at sample time (0/1)." }
    MetricPoint:
      type: object
      description: "One row from GET /v1/admin/sessions/{id}/metrics."
      required: [source, ts_unix_ms, metrics]
      properties:
        source: { type: string, enum: [agent, browser] }
        ts_unix_ms: { type: integer }
        metrics:
          oneOf:
            - { $ref: "#/components/schemas/AgentMetrics" }
            - { $ref: "#/components/schemas/BrowserMetrics" }
    MetricsResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }
        next_cursor: { type: [string, "null"] }
    LatestMetrics:
      type: object
      description: "latest_metrics on each session list item — present only when telemetry exists."
      properties:
        agent: { $ref: "#/components/schemas/MetricPoint" }
        browser: { $ref: "#/components/schemas/MetricPoint" }
    AdminSession:
      allOf:
        - { $ref: "#/components/schemas/Session" }
        - type: object
          properties:
            latest_metrics: { $ref: "#/components/schemas/LatestMetrics" }
    AdminSessionsResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminSession" }
        next_cursor: { type: [string, "null"] }

    # ─── admin: host runtime config catalog ──────────────────────────────────────
    ConfigKnob:
      type: object
      description: "One entry from GET /v1/admin/config/catalog."
      # min/max/enum are omitempty in hostcfg.Knob — present only for knobs that carry them.
      required: [key, type, default, nullable, class, env_var]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, float, enum, string] }
        default: { type: [boolean, number, string, "null"] }
        min: { type: number }
        max: { type: number }
        enum:
          type: array
          items: { type: string }
        nullable: { type: boolean }
        class: { type: string, enum: [live, restart] }
        env_var: { type: string }
    ConfigCatalogResponse:
      type: object
      required: [knobs]
      properties:
        knobs:
          type: array
          items: { $ref: "#/components/schemas/ConfigKnob" }

    # ─── console mode (CM-01) ────────────────────────────────────────────────────
    ConsoleConfig:
      type: object
      description: "Per-host console-mode config. On PATCH the body is partial (any subset); on GET it is the resolved object. Off + local-only by default; audio_output has no default (null = quiet)."
      properties:
        enabled: { type: boolean }
        connector: { type: string, description: "'auto' or a DRM connector name (DP-4, HDMI-A-1, …)." }
        compositor: { type: string, enum: [weston, cage] }
        audio_output: { type: [string, "null"], description: "Local host sink id ('auto' | alsa hw id | hdmi | motherboard | usb:*), or null = no local audio." }
        stream: { type: boolean, description: "Also stream over WebRTC (dual-output). Default false = local-only." }
        stream_audio: { type: boolean }
        input_devices:
          description: "'auto' or an explicit list of /dev/input/event* paths."
          oneOf:
            - { type: string, enum: [auto] }
            - { type: array, items: { type: string } }
        grab: { type: boolean }
        auto_start_on_display: { type: boolean }
        auto_connect_controller: { type: boolean }
        default_app: { type: [string, "null"], format: uuid }
        default_user: { type: [string, "null"], format: uuid, description: "CM-06: owner of auto-started console sessions (users.id). Required when auto_start_on_display=true." }
        fullscreen: { type: boolean }
    ConsoleCapabilities:
      type: object
      description: "What the host can do in console mode (from agent-api capacity.console_capabilities). Empty arrays if unreported."
      required: [connectors, audio_sinks, input_devices]
      properties:
        connectors:
          type: array
          items: { type: string }
        audio_sinks:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
        input_devices:
          type: array
          items:
            type: object
            required: [path, label]
            properties:
              path: { type: string }
              label: { type: string }
    ConsoleConfigEnvelope:
      type: object
      required: [config, capabilities]
      properties:
        config: { $ref: "#/components/schemas/ConsoleConfig" }
        capabilities: { $ref: "#/components/schemas/ConsoleCapabilities" }

    # ─── session trace / diagnostic bundle (ST-06/ST-07) ─────────────────────────
    TraceSeriesPoint:
      type: object
      properties:
        ts_unix_ms: { type: integer }
        v: { type: number }
    TraceEvent:
      type: object
      properties:
        source: { type: string, enum: [agent, browser] }
        ts_unix_ms: { type: integer }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
    DiagnosticBundle:
      type: object
      description: "GET /v1/admin/sessions/{id}/diagnostic-bundle response shape (ST-06/ST-07)."
      properties:
        trace:
          type: object
          properties:
            session_id: { type: string, format: uuid }
            host_id: { type: string, format: uuid }
            profile_id: { type: string }
            started_at: { type: string, format: date-time }
            ended_at: { type: [string, "null"], format: date-time }
        window:
          type: object
          properties:
            from_ms: { type: integer }
            to_ms: { type: integer }
        clock:
          oneOf:
            - type: object
              properties:
                client_offset_ms: { type: number }
                uncertainty_ms: { type: number }
                measured_at: { type: string, format: date-time }
            - type: object
              properties:
                unmeasured: { type: boolean, enum: [true] }
        series:
          type: object
          description: "Named metric series; keys include encoder.encode_ms, encoder.fps, abr.setpoint_kbps, transport.rtt_ms, transport.packets_lost, client.present_interval_sd_ms, client.glass_to_glass_ms, plus arbitrary additional series names."
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TraceSeriesPoint" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
        derived_windows:
          type: object
          properties:
            hitches:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  present_interval_sd_ms: { type: number }
            abr_downshifts:
              type: array
              items:
                type: object
                properties:
                  ts_unix_ms: { type: integer }
                  from_kbps: { type: integer }
                  to_kbps: { type: integer }
            encoder_saturation:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  encode_ms_p95: { type: number }
            likely_network_congestion:
              type: array
              items:
                type: object
                properties:
                  from_ms: { type: integer }
                  to_ms: { type: integer }
                  packets_lost_delta: { type: integer }
                  rtt_ms_p95: { type: number }
        classifier:
          type: object
          properties:
            verdict:
              type: string
              enum: [likely_encoder_saturation, likely_network_congestion, likely_client_presentation_limit, nominal, indeterminate_client_hidden, unknown]
            evidence:
              type: array
              items: { type: string }

    # ─── storage (P5-05) ─────────────────────────────────────────────────────────
    AdminHome:
      type: object
      description: "One managed-home row from GET /v1/admin/storage/homes (storage/handler.go homeResp)."
      required: [id, user_id, app_id, host_id, provider, ref, bytes_used, created_at, last_used_at, gc_after]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: [string, "null"], format: uuid, description: "Null when the user was deleted and the row is orphaned pending GC." }
        app_id: { type: [string, "null"], format: uuid, description: "Null when the app was deleted and the row is orphaned pending GC." }
        host_id: { type: [string, "null"], format: uuid }
        provider: { type: string }
        ref: { type: string }
        bytes_used: { type: integer }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        gc_after: { type: [string, "null"], format: date-time, description: "Non-null means a GC tombstone has been set." }
    AdminHomesResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminHome" }
        next_cursor: { type: [string, "null"] }
    MyStorageItem:
      type: object
      description: "One row from GET /v1/me/storage (storage.MyStorageItem)."
      required: [app_id, app_name, bytes_used, last_used_at]
      properties:
        app_id: { type: string, format: uuid }
        app_name: { type: string }
        bytes_used: { type: integer }
        last_used_at: { type: [string, "null"], format: date-time }
    MyStorageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MyStorageItem" }

    # ─── session telemetry / trace ingest (request bodies) ───────────────────────
    StatsRequest:
      type: object
      description: "POST /v1/sessions/{id}/stats body (metrics_handler.go). `metrics` is filtered to the BrowserMetrics dictionary at ingest."
      required: [samples]
      properties:
        client:
          type: string
          enum: [browser, native]
          description: "Optional reporter discriminator (P9-07). Absent ⇒ browser. Any other value is rejected, not coerced."
        samples:
          type: array
          items:
            type: object
            required: [ts_unix_ms, metrics]
            properties:
              ts_unix_ms: { type: integer }
              metrics: { $ref: "#/components/schemas/BrowserMetrics" }
              client_health:
                type: string
                enum: [smooth, decode_degrading, presentation_degrading, backgrounded_or_hidden, client_unsupported]
                description: "AS10-11: browser-classified client health (sibling of the numeric metrics dict)."
              client_health_reason: { type: string }
              device_key: { type: string }
    TraceEventsRequest:
      type: object
      description: "POST /v1/sessions/{id}/trace/events body (ST-04). Events with unknown types are dropped at ingest."
      required: [events]
      properties:
        client: { type: string, enum: [browser, native], description: "Optional reporter discriminator (P9-01). Absent ⇒ browser." }
        events:
          type: array
          maxItems: 64
          items:
            type: object
            required: [ts_unix_ms, type]
            properties:
              ts_unix_ms: { type: integer }
              type: { type: string, enum: [playout.changed, client.freeze_detected, client.visibility_changed, webrtc.state_changed] }
              payload: { type: object, additionalProperties: true }
    TraceClockRequest:
      type: object
      description: "POST /v1/sessions/{id}/trace/clock body (ST-05). Both values required + finite; uncertainty non-negative."
      required: [client_offset_ms, uncertainty_ms]
      properties:
        client_offset_ms: { type: number }
        uncertainty_ms: { type: number }

    # ─── admin trace reads (response bodies) ─────────────────────────────────────
    TraceWindow:
      type: object
      required: [from_ms, to_ms]
      properties:
        from_ms: { type: integer }
        to_ms: { type: integer }
    TraceClock:
      description: "Either the measured client↔host clock offset, or {unmeasured:true} — never an offset-0 default (trace-format.md §4)."
      oneOf:
        - type: object
          required: [client_offset_ms, uncertainty_ms, measured_at]
          properties:
            client_offset_ms: { type: number }
            uncertainty_ms: { type: number }
            measured_at: { type: string, format: date-time }
        - type: object
          required: [unmeasured]
          properties:
            unmeasured: { type: boolean, enum: [true] }
    TraceSeries:
      type: object
      description: "Named metric series keyed by taxonomy name; each value is an array of {ts_unix_ms, v} points."
      additionalProperties:
        type: array
        items: { $ref: "#/components/schemas/TraceSeriesPoint" }
    TraceResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace and /trace/window (diagnostic_handler.go handleAdminTrace)."
      required: [session_id, window, clock, series, events]
      properties:
        session_id: { type: string, format: uuid }
        window: { $ref: "#/components/schemas/TraceWindow" }
        clock: { $ref: "#/components/schemas/TraceClock" }
        series: { $ref: "#/components/schemas/TraceSeries" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
    TraceMetricsResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace/metrics — only the requested named series."
      required: [window, series]
      properties:
        window: { $ref: "#/components/schemas/TraceWindow" }
        series: { $ref: "#/components/schemas/TraceSeries" }
    TraceEventsResponse:
      type: object
      description: "GET /v1/admin/sessions/{id}/trace/events — only the requested event types."
      required: [window, events]
      properties:
        window: { $ref: "#/components/schemas/TraceWindow" }
        events:
          type: array
          items: { $ref: "#/components/schemas/TraceEvent" }
    TraceAnnotationRequest:
      type: object
      description: "POST /v1/admin/sessions/{id}/trace/annotations body (§B.4)."
      required: [label]
      properties:
        ts_unix_ms: { type: integer, description: "Optional; defaults to now." }
        label: { type: string }
        tags: { type: array, items: { type: string } }
    TraceAnnotationCreated:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    # ─── encoder certification (SPT-06 / cert_handler.go) ────────────────────────
    CertRow:
      type: object
      description: "One certification verdict row (cert_handler.go certRowResp)."
      required: [id, gpu_index, encoder, profile_id, width, height, fps, bitrate_kbps, verdict, encode_ms_p50, encode_ms_p95, encode_ms_max, output_fps, drop_rate, live_write_stable, sample_window_ms, sample_count, measured_at]
      properties:
        id: { type: string, format: uuid }
        gpu_index: { type: integer }
        encoder: { type: string }
        profile_id: { type: string }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        bitrate_kbps: { type: integer }
        verdict: { type: string }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        output_fps: { type: number }
        drop_rate: { type: number }
        live_write_stable: { type: boolean }
        sample_window_ms: { type: integer }
        sample_count: { type: integer }
        agent_version: { type: string }
        measured_at: { type: string, format: date-time }
    CertVerdicts:
      type: object
      description: "GET /v1/admin/hosts/{id}/encoder-certification (cert_handler.go certResp)."
      required: [host_id, certifications]
      properties:
        host_id: { type: string, format: uuid }
        certifications:
          type: array
          items: { $ref: "#/components/schemas/CertRow" }
    CertRunRequest:
      type: object
      description: "POST .../encoder-certification/runs body (cert_handler.go certRunReq)."
      properties:
        gpu_index: { type: integer }
        encoder: { type: string }
        profiles: { type: array, items: { type: string } }
        bitrates_kbps: { type: array, items: { type: integer } }
    CertCellPlan:
      type: object
      required: [profile_id, bitrate_kbps]
      properties:
        profile_id: { type: string }
        bitrate_kbps: { type: integer }
    CertRun:
      type: object
      description: "POST .../encoder-certification/runs response (cert_handler.go certRunResp)."
      required: [run_id, host_id, status, started_at, total_pts, encoder, gpu_index, cells]
      properties:
        run_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        status: { type: string }
        started_at: { type: string, format: date-time }
        total_pts: { type: integer }
        encoder: { type: string }
        gpu_index: { type: integer }
        cells:
          type: array
          items: { $ref: "#/components/schemas/CertCellPlan" }
    CertRunStatus:
      type: object
      description: "GET .../runs/{run_id} + POST .../runs/{run_id}/complete (cert_handler.go certRunStatusResp)."
      required: [run_id, host_id, status, started_at, completed_pts, total_pts, summary_ok, summary_capped, summary_unsafe]
      properties:
        run_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        status: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        error_message: { type: [string, "null"] }
        completed_pts: { type: integer }
        total_pts: { type: integer }
        summary_ok: { type: integer }
        summary_capped: { type: integer }
        summary_unsafe: { type: integer }
    CertCellRequest:
      type: object
      description: "POST .../encoder-certification/cells body (cert_handler.go certCellReq)."
      required: [gpu_index, encoder, profile_id, bitrate_kbps]
      properties:
        gpu_index: { type: integer }
        encoder: { type: string }
        profile_id: { type: string }
        bitrate_kbps: { type: integer }
    CertCell:
      type: object
      description: "POST .../encoder-certification/cells response (cert_handler.go certCellResp)."
      required: [session_id, host_id, profile_id, bitrate_kbps, width, height, fps, budget_ms, signaling_url, signaling_token]
      properties:
        session_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        profile_id: { type: string }
        bitrate_kbps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        budget_ms: { type: number }
        signaling_url: { type: string }
        signaling_token: { type: string }
    CertFinalize:
      type: object
      description: "POST .../encoder-certification/cells/{session_id}/finalize (cert_handler.go certFinalizeResp)."
      required: [session_id, profile_id, bitrate_kbps, verdict, encode_ms_p50, encode_ms_p95, encode_ms_max, output_fps, drop_rate, live_write_stable, sample_count]
      properties:
        session_id: { type: string, format: uuid }
        profile_id: { type: string }
        bitrate_kbps: { type: integer }
        verdict: { type: string }
        encode_ms_p50: { type: number }
        encode_ms_p95: { type: number }
        encode_ms_max: { type: number }
        output_fps: { type: number }
        drop_rate: { type: number }
        live_write_stable: { type: boolean }
        sample_count: { type: integer }

    # ─── agent-internal storage GC (storage/agent_gc.go) ─────────────────────────
    PendingHome:
      type: object
      description: "One reapable backing store scoped to the calling agent's host (storage.PendingHome)."
      required: [id, provider, ref]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, description: "'volume' | 'local'." }
        ref: { type: string, description: "Docker volume name or absolute host path." }
    GCPendingResponse:
      type: object
      required: [homes]
      properties:
        homes:
          type: array
          items: { $ref: "#/components/schemas/PendingHome" }
    GCConfirmRequest:
      type: object
      required: [home_ids]
      properties:
        home_ids:
          type: array
          items: { type: string, format: uuid }
    GCConfirmResponse:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer, description: "Count of hard-deleted home rows." }
